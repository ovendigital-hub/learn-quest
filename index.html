<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Learn Quest — Grade 6</title>
<style>
  :root{
    --bg:#f4f7ff; --card:#ffffff; --ink:#27314d; --muted:#6b779a; --line:#e6ebf7;
    --brand:#5b6cff; --brand2:#8a5bff;
    --maths:#ff7a59; --english:#3ec1d3; --science:#37c978; --social:#ffb23e; --hindi:#ff5d8f;
    --good:#37c978; --bad:#ff5d6c; --star:#ffc83d;
  }
  *{box-sizing:border-box}
  body{margin:0;font-family:'Trebuchet MS',system-ui,-apple-system,"Segoe UI",sans-serif;background:var(--bg);color:var(--ink)}
  .wrap{max-width:980px;margin:0 auto;padding:16px}
  a{color:inherit}
  button{font-family:inherit;cursor:pointer;border:none}

  /* top bar */
  .top{display:flex;align-items:center;gap:12px;justify-content:space-between;
    background:linear-gradient(120deg,var(--brand),var(--brand2));color:#fff;border-radius:18px;padding:16px 20px;margin-bottom:18px}
  .top h1{margin:0;font-size:1.4rem;display:flex;align-items:center;gap:8px}
  .top .who{display:flex;align-items:center;gap:8px;font-size:.95rem}
  .top .who input{border:none;border-radius:8px;padding:6px 10px;font-family:inherit;font-size:.95rem;max-width:130px}
  .pill{background:rgba(255,255,255,.22);border-radius:20px;padding:6px 12px;font-weight:bold;font-size:.85rem}

  /* stat row */
  .stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px;margin-bottom:18px}
  .stat{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:14px 16px;text-align:center}
  .stat .big{font-size:1.6rem;font-weight:800}
  .stat .lbl{color:var(--muted);font-size:.8rem;text-transform:uppercase;letter-spacing:1px}

  /* week tabs */
  .weeks{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:16px}
  .weektab{background:var(--card);border:1px solid var(--line);border-radius:20px;padding:8px 16px;font-weight:bold;color:var(--muted)}
  .weektab.active{background:var(--ink);color:#fff;border-color:var(--ink)}

  /* subject group */
  .subjhead{display:flex;align-items:center;gap:10px;margin:18px 0 10px;font-size:1.1rem;font-weight:800}
  .subjdot{width:14px;height:14px;border-radius:50%}
  .lessons{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:14px}
  .lesson{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:16px;display:flex;flex-direction:column;gap:8px;transition:transform .08s,box-shadow .12s}
  .lesson:hover{transform:translateY(-2px);box-shadow:0 8px 22px rgba(91,108,255,.12)}
  .lesson .emoji{font-size:1.8rem}
  .lesson h3{margin:0;font-size:1.05rem}
  .lesson .meta{color:var(--muted);font-size:.82rem;flex:1}
  .lesson .row{display:flex;align-items:center;justify-content:space-between;gap:8px}
  .badge{font-size:.74rem;font-weight:bold;padding:4px 9px;border-radius:20px}
  .b-new{background:#eef1ff;color:var(--brand)}
  .b-prog{background:#fff3e0;color:#d98600}
  .b-master{background:#e7f9ef;color:var(--good)}
  .b-soon{background:#f0f1f5;color:var(--muted)}
  .lvl{font-size:.66rem;font-weight:bold;padding:2px 9px;border-radius:20px;margin-left:8px;vertical-align:middle;white-space:nowrap}
  .lvl-med{background:#e7f9ef;color:#1f8a4c}
  .lvl-mh{background:#fff3e0;color:#d98600}
  .lvl-hard{background:#ffe1e6;color:#d12f49}
  .go{background:var(--brand);color:#fff;border-radius:10px;padding:8px 12px;font-weight:bold;font-size:.85rem}
  .go.soon{background:#e8eaf2;color:var(--muted);cursor:not-allowed}
  .prog{height:8px;background:#eef1f8;border-radius:6px;overflow:hidden}
  .prog>i{display:block;height:100%;background:var(--good)}

  .btn{background:var(--brand);color:#fff;border-radius:10px;padding:10px 16px;font-weight:bold}
  .btn.ghost{background:#eef1ff;color:var(--brand)}
  .btn.alt{background:var(--ink)}
  .btn.big{font-size:1.05rem;padding:13px 22px}
  .btnrow{display:flex;gap:10px;flex-wrap:wrap}

  /* lesson view */
  .card{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:22px;margin-bottom:16px}
  .crumbs{color:var(--muted);font-size:.85rem;margin-bottom:8px;cursor:pointer}
  .lessontitle{display:flex;align-items:center;gap:12px;margin:0 0 4px;font-size:1.5rem}
  .objective{background:#eef1ff;border-radius:12px;padding:12px 14px;color:#41507f;margin:12px 0}
  .sec{margin:18px 0}
  .sec h4{margin:0 0 6px;font-size:1.1rem;display:flex;align-items:center;gap:8px}
  .sec p{margin:6px 0}
  .example{background:#fff8f3;border-left:4px solid var(--maths);border-radius:10px;padding:12px 14px}
  .tip{background:#e7f9ef;border-left:4px solid var(--good);border-radius:10px;padding:12px 14px}
  .worked{background:#eef3ff;border-left:4px solid var(--brand);border-radius:10px;padding:12px 14px}
  .worked-h{font-weight:800;color:var(--brand);margin-bottom:6px}
  .sec p{margin:8px 0;line-height:1.6}
  .mascot{display:flex;gap:10px;align-items:flex-start;background:#f3f0ff;border-radius:12px;padding:12px 14px}
  .mascot .face{font-size:1.6rem}
  kbd{background:#eef1f8;border-radius:6px;padding:2px 7px;font-family:inherit;font-weight:bold}

  /* fraction widget */
  .fracwidget{text-align:center;background:#fbfcff;border:1px dashed var(--line);border-radius:14px;padding:16px}
  .bar{display:flex;gap:4px;justify-content:center;margin:12px 0;flex-wrap:wrap}
  .seg{width:42px;height:48px;border-radius:8px;background:#eceffb;border:2px solid #d8def1;cursor:pointer;transition:.1s}
  .seg.on{background:var(--maths);border-color:#e85c36}
  .fracval{font-size:2rem;font-weight:800;color:var(--maths)}
  .ctrls{display:flex;gap:8px;justify-content:center;align-items:center;margin-top:8px}
  .ctrls button{background:var(--ink);color:#fff;border-radius:8px;width:34px;height:34px;font-size:1.1rem;font-weight:bold}

  /* quiz */
  .q{border:1px solid var(--line);border-radius:14px;padding:14px 16px;margin:12px 0;background:#fff}
  .q .qtext{font-weight:bold;margin-bottom:10px}
  .choices{display:flex;flex-direction:column;gap:8px}
  .choice{display:flex;align-items:center;gap:10px;border:2px solid var(--line);border-radius:10px;padding:10px 12px;cursor:pointer;transition:.1s;background:#fff}
  .choice:hover{border-color:var(--brand)}
  .choice.sel{border-color:var(--brand);background:#eef1ff}
  .choice.correct{border-color:var(--good);background:#e7f9ef}
  .choice.wrong{border-color:var(--bad);background:#ffeef0}
  .choice .key{width:26px;height:26px;border-radius:50%;background:#eef1f8;display:flex;align-items:center;justify-content:center;font-weight:bold;flex:0 0 auto}
  .feedback{margin-top:8px;font-size:.9rem;padding:8px 10px;border-radius:8px}
  .feedback.ok{background:#e7f9ef;color:#1f8a4c}
  .feedback.no{background:#ffeef0;color:#c0354a}

  /* result */
  .result{text-align:center;padding:8px}
  .scoreRing{font-size:3rem;font-weight:800}
  .stars{font-size:1.8rem;letter-spacing:4px}

  /* modal */
  .modal{position:fixed;inset:0;background:rgba(20,26,48,.55);display:flex;align-items:center;justify-content:center;padding:16px;z-index:50}
  .modal .box{background:#fff;border-radius:18px;max-width:680px;width:100%;max-height:88vh;overflow:auto;padding:22px}
  .repline{display:flex;justify-content:space-between;gap:10px;padding:8px 0;border-bottom:1px dashed var(--line);font-size:.92rem}
  .repsub{font-weight:800;margin:14px 0 4px}
  .x{float:right;background:#eef1f8;border-radius:8px;padding:6px 10px;font-weight:bold;color:var(--muted)}
  .sharearea{width:100%;min-height:74px;resize:vertical;font-family:ui-monospace,Consolas,monospace;font-size:.8rem;
    border:1px solid var(--line);border-radius:10px;padding:10px;background:#f7f9ff;color:var(--ink);word-break:break-all}
  .sharearea:focus{outline:none;border-color:var(--brand)}
  .hide{display:none}
  .center{text-align:center}
  .muted{color:var(--muted)}
  .confetti{position:fixed;top:-10px;font-size:1.4rem;animation:fall 2.2s linear forwards;z-index:60}
  @keyframes fall{to{transform:translateY(105vh) rotate(360deg);opacity:.9}}
</style>
</head>
<body>
<div class="wrap" id="app"></div>

<script>
/* ============================================================
   LEARN QUEST — data-driven grade-6 tutorial platform

const SUBJECTS = [
  {id:'maths',   name:'Maths',          icon:'🔢', color:'var(--maths)'},
  {id:'english', name:'English',        icon:'📖', color:'var(--english)'},
  {id:'science', name:'Science',        icon:'🔬', color:'var(--science)'},
  {id:'social',  name:'Social Studies', icon:'🌍', color:'var(--social)'},
  {id:'hindi',   name:'Hindi',          icon:'✍️', color:'var(--hindi)'},
];

const CURRICULUM = { lessons: [

/* ---------- FULL SAMPLE LESSON: MATHS · FRACTIONS (Week 1) ---------- */
/* ===== MATHS · Fractions — 5 day-sessions ===== */
{
  id:'maths-d1', subject:'maths', week:1, day:1, title:'Day 1 · What is a Fraction?', emoji:'🍕',
  blurb:'The meaning of a fraction, numerator & denominator, fractions of a collection, number line.',
  objective:"Understand what a fraction means, name the numerator and denominator, read fractions, find a fraction of a group of objects, and place fractions on a number line.",
  sections:[
    {type:'mascot', text:"Hi! I'm <b>Hooty</b> the owl 🦉. Let's start fractions from the very beginning — with pizzas, chocolate and marbles. Tap things as we go!"},
    {type:'text', h:'🍕 A fraction = an equal part of a whole', html:"Imagine one whole pizza. If we cut it into <b>4 EQUAL slices</b> and take <b>3</b> of them, we have eaten <b>three-fourths</b> of the pizza, written <b>3/4</b>.<br><br>A <b>fraction</b> is a number that names <b>part of a whole</b> when the whole is split into <b>equal</b> parts. The word 'equal' is very important — if the slices are different sizes, we cannot call them a fair fraction!"},
    {type:'frac'},
    {type:'text', h:'🔢 The two numbers of a fraction', html:"Every fraction has two numbers, one above the other:<br><b>Numerator</b> (the TOP number) — how many equal parts we are talking about.<br><b>Denominator</b> (the BOTTOM number) — how many equal parts the whole is divided into.<br><br>In <kbd>3/4</kbd>: the numerator is <b>3</b> and the denominator is <b>4</b>. We read it as 'three-fourths' or 'three by four'.<br><br>💡 Memory hook: <b>D</b>enominator = <b>D</b>own; it tells the total number of pieces."},
    {type:'text', h:'🍬 Fractions of a collection', html:"A fraction can also describe part of a <b>group</b> of things, not just one object. To find <b>1/3 of 12 marbles</b>, split the 12 marbles into <b>3 equal groups</b> (4 in each group) and take <b>1 group</b> → <b>4 marbles</b>.<br>So the denominator tells you <i>how many equal groups</i> to make, and the numerator tells you <i>how many groups</i> to take."},
    {type:'text', h:'📏 Fractions on a number line', html:"Fractions are real numbers that sit <b>between the whole numbers</b>. To show fourths between 0 and 1, divide that gap into <b>4 equal steps</b>. The marks are then 1/4, 2/4, 3/4, and 4/4 (which is 1)."},
    {type:'worked', h:'two quick problems', html:"<b>(a) Show 3/8.</b> Step 1 — the denominator is 8, so draw a shape with <b>8 equal parts</b>. Step 2 — the numerator is 3, so <b>shade 3</b> parts. The shaded amount is 3/8. ✅<br><br><b>(b) Find 1/4 of 12 sweets.</b> Step 1 — denominator 4 → make <b>4 equal groups</b> from 12 (that's 3 in each). Step 2 — numerator 1 → take <b>1 group</b> = <b>3 sweets</b>. ✅"},
    {type:'practice', q:{text:"A chocolate bar has 5 equal pieces and you eat 2. What fraction did you eat?", choices:["5/2","2/5","2/3","1/5"], answer:1, explain:"2 pieces out of 5 equal pieces = 2/5."}},
    {type:'practice', q:{text:"What is 2/3 of 9 pencils?", choices:["3","6","9","2"], answer:1, explain:"Make 3 equal groups of 9 (3 each); take 2 groups = 6 pencils."}},
    {type:'mascot', text:"Great start! 🌟 Take today's 10-question test (you need <b>95%</b> = 10/10) and earn your star. ⭐"},
  ],
  test:{ passScore:95, questions:[
    {level:'Medium', text:"A fraction names a ___ of a whole that has been split into equal parts.", choices:["part","colour","name","price"], answer:0, explain:"A fraction is a part of a whole."},
    {level:'Medium', text:"For a fraction to be fair, the parts of the whole must be…", choices:["equal in size","different colours","very big","numbered"], answer:0, explain:"The parts must be equal."},
    {level:'Medium', text:"In 3/4, the bottom number (4) is the…", choices:["denominator","numerator","whole","remainder"], answer:0, explain:"The bottom number is the denominator (total equal parts)."},
    {level:'Medium', text:"In 3/4, the top number (3) is the…", choices:["numerator","denominator","divisor","decimal"], answer:0, explain:"The top number is the numerator."},
    {level:'Medium', text:"'Three-fifths' written as a fraction is…", choices:["3/5","5/3","3/8","2/5"], answer:0, explain:"Three-fifths = 3/5."},
    {level:'Medium', text:"A pizza is cut into 8 equal slices and you take 5. What fraction did you take?", choices:["5/8","8/5","3/8","5/3"], answer:0, explain:"5 of 8 equal parts = 5/8."},
    {level:'Medium-Hard', text:"What is 1/4 of 12 marbles?", choices:["3","4","6","8"], answer:0, explain:"Split 12 into 4 equal groups (3 each); take 1 group = 3."},
    {level:'Medium-Hard', text:"What is 2/3 of 9 sweets?", choices:["6","3","9","5"], answer:0, explain:"Make 3 groups of 9 (3 each); take 2 groups = 6."},
    {level:'Medium-Hard', text:"On a number line from 0 to 1 split into 5 equal steps, the 2nd mark stands for…", choices:["2/5","5/2","1/5","2/10"], answer:0, explain:"The 2nd of 5 equal steps from 0 = 2/5."},
    {level:'Hard', text:"A box has 20 chocolates. 3/4 of them are dark. How many dark chocolates are there?", choices:["15","5","12","16"], answer:0, explain:"3/4 of 20 = (20÷4)×3 = 5×3 = 15."},
  ]},
},
{
  id:'maths-d2', subject:'maths', week:1, day:2, title:'Day 2 · Proper, Improper & Mixed Fractions', emoji:'🍕',
  blurb:'The three types of fractions and how to convert improper ↔ mixed.',
  objective:"Tell proper, improper and mixed fractions apart, and convert an improper fraction to a mixed number and back.",
  sections:[
    {type:'mascot', text:"Welcome back! 🦉 Today we sort fractions into three families and learn to switch between two of them. 🔄"},
    {type:'text', h:'📏 The three types', html:"<b>Proper fraction</b> — the top is <b>smaller</b> than the bottom (e.g. 3/8). It is <b>less than one whole</b>.<br><b>Improper fraction</b> — the top is <b>equal to or bigger</b> than the bottom (e.g. 9/4, 5/5). It is <b>one whole or more</b>.<br><b>Mixed number</b> — a <b>whole number plus a proper fraction</b> together (e.g. 2¼)."},
    {type:'text', h:'🍕 Why improper and mixed are the SAME amount', html:"Picture 9 quarter-slices of pizza (9/4). Four quarters make one whole pizza, so 8 quarters make 2 whole pizzas, and 1 quarter is left over. That is <b>2 whole pizzas and 1/4</b> = <b>2¼</b>. So <b>9/4 = 2¼</b> — two ways of writing the same amount!"},
    {type:'worked', h:'converting both ways', html:"<b>Improper → Mixed (7/3):</b> Divide the top by the bottom. 7 ÷ 3 = <b>2 remainder 1</b>. The quotient 2 is the whole number, the remainder 1 is the new top, the bottom stays 3 → <b>2 1/3</b>. ✅<br><br><b>Mixed → Improper (2¼):</b> Multiply the whole number by the bottom and add the top. (2 × 4) + 1 = <b>9</b>; keep the bottom 4 → <b>9/4</b>. ✅"},
    {type:'practice', q:{text:"Which of these is an improper fraction?", choices:["3/7","2/5","9/4","1/2"], answer:2, explain:"9/4 has a top bigger than its bottom → improper."}},
    {type:'practice', q:{text:"Write 2¼ as an improper fraction.", choices:["6/4","9/4","8/4","9/2"], answer:1, explain:"(2×4)+1 = 9 over 4 → 9/4."}},
    {type:'mascot', text:"You can sort and convert now! 🌟 Take the 10-question test (95% to earn your star). ⭐"},
  ],
  test:{ passScore:95, questions:[
    {level:'Medium', text:"In a PROPER fraction, the top is ___ the bottom.", choices:["smaller than","bigger than","equal to","double"], answer:0, explain:"Proper = top smaller than bottom (less than 1 whole)."},
    {level:'Medium', text:"Which one is a PROPER fraction?", choices:["3/8","9/4","5/5","7/2"], answer:0, explain:"Only 3/8 has top < bottom."},
    {level:'Medium', text:"Which one is an IMPROPER fraction?", choices:["2/5","9/4","3/7","1/2"], answer:1, explain:"9/4 has top ≥ bottom → improper."},
    {level:'Medium', text:"5/5 is equal to…", choices:["1","0","5","½"], answer:0, explain:"Top = bottom → one whole = 1."},
    {level:'Medium', text:"An improper fraction is always…", choices:["one whole or more","less than one whole","a whole number","negative"], answer:0, explain:"Improper fractions equal 1 or more."},
    {level:'Medium', text:"A mixed number is made of a whole number plus a…", choices:["proper fraction","improper fraction","decimal","remainder"], answer:0, explain:"Mixed = whole number + proper fraction."},
    {level:'Medium-Hard', text:"Write 2¼ as an improper fraction.", choices:["9/4","8/4","6/4","9/2"], answer:0, explain:"(2×4)+1 = 9 → 9/4."},
    {level:'Medium-Hard', text:"Write 7/3 as a mixed number.", choices:["2 1/3","1 1/3","3 1/2","2 2/3"], answer:0, explain:"7 ÷ 3 = 2 r 1 → 2 1/3."},
    {level:'Hard', text:"Write 17/5 as a mixed number.", choices:["3 2/5","2 2/5","3 3/5","4 2/5"], answer:0, explain:"17 ÷ 5 = 3 r 2 → 3 2/5."},
    {level:'Hard', text:"Write 3¾ as an improper fraction.", choices:["15/4","13/4","12/4","7/4"], answer:0, explain:"(3×4)+3 = 15 → 15/4."},
  ]},
},
{
  id:'maths-d3', subject:'maths', week:1, day:3, title:'Day 3 · Equivalent Fractions & Simplifying', emoji:'🍕',
  blurb:'Fractions that look different but are equal, and reducing to simplest form.',
  objective:"Make equivalent fractions by multiplying/dividing, reduce a fraction to its simplest form, and check whether two fractions are equal.",
  sections:[
    {type:'mascot', text:"Did you know one amount can be written many ways? 🤔 Let's discover equivalent fractions. 🟰"},
    {type:'text', h:'🟰 What equivalent means', html:"<b>Equivalent fractions</b> are fractions that look different but stand for <b>exactly the same amount</b>.<br><br>Think of a chocolate bar: half of it can be shown as <b>1/2</b>, or you can score it into more pieces and call it <b>2/4</b>, <b>3/6</b> or <b>4/8</b> — it is still the same amount of chocolate! So <kbd>1/2 = 2/4 = 3/6 = 4/8</kbd>."},
    {type:'text', h:'✖️ Making equivalent fractions', html:"To make an equivalent fraction, <b>multiply (or divide) the top AND the bottom by the same number</b>. You must do the same thing to both — that keeps the value unchanged.<br>Example: 2/3 = (2×2)/(3×2) = <b>4/6</b> = (2×4)/(3×4) = <b>8/12</b>."},
    {type:'text', h:'➗ Simplifying to lowest terms', html:"To <b>simplify</b> (or reduce) a fraction, <b>divide</b> the top and bottom by a common factor until no number (except 1) divides both. The result is the <b>simplest form</b>.<br>Example: 6/8 → divide both by 2 → <b>3/4</b>. Nothing else divides 3 and 4, so 3/4 is simplest."},
    {type:'worked', h:'make, simplify & check', html:"<b>Make:</b> 2/3 = ?/12. The bottom went 3 → 12, that's ×4, so do ×4 on top too: 2×4 = 8 → <b>8/12</b>. ✅<br><br><b>Simplify:</b> 18/24. The biggest number dividing both is 6. 18÷6 = 3, 24÷6 = 4 → <b>3/4</b>. ✅<br><br><b>Check if equal:</b> Is 2/3 = 6/9? Cross-multiply: 2×9 = 18 and 3×6 = 18. They match → <b>yes, equal</b>. ✅"},
    {type:'practice', q:{text:"Which fraction is equivalent to 2/3?", choices:["3/4","4/6","2/6","5/6"], answer:1, explain:"Multiply top & bottom by 2 → 4/6."}},
    {type:'practice', q:{text:"Simplify 10/15 to lowest terms.", choices:["2/3","5/15","10/15","1/2"], answer:0, explain:"Divide both by 5 → 2/3."}},
    {type:'mascot', text:"Equivalent and simplest forms — sorted! 🌟 Take the 10-question test (95% to earn your star). ⭐"},
  ],
  test:{ passScore:95, questions:[
    {level:'Medium', text:"Equivalent fractions have the same…", choices:["value","colour","top number","bottom number"], answer:0, explain:"They name the same amount (value)."},
    {level:'Medium', text:"To make an equivalent fraction you multiply the top and bottom by the…", choices:["same number","number 1 only","top number","denominator only"], answer:0, explain:"Multiply both by the same number."},
    {level:'Medium', text:"1/2 = ?/8", choices:["4/8","2/8","3/8","6/8"], answer:0, explain:"×4 on both → 4/8."},
    {level:'Medium', text:"Which is equivalent to 3/4?", choices:["6/8","4/6","2/3","5/8"], answer:0, explain:"×2 on both → 6/8."},
    {level:'Medium', text:"Simplify 6/8 to lowest terms.", choices:["3/4","2/4","6/8","1/2"], answer:0, explain:"Divide both by 2 → 3/4."},
    {level:'Medium', text:"4/5 = ?/20", choices:["16/20","8/20","12/20","5/20"], answer:0, explain:"×4 on both → 16/20."},
    {level:'Medium-Hard', text:"Simplify 18/24 to lowest terms.", choices:["3/4","2/3","6/8","9/12"], answer:0, explain:"Divide both by 6 → 3/4."},
    {level:'Medium-Hard', text:"Simplest form of 12/16 is…", choices:["3/4","6/8","2/3","4/5"], answer:0, explain:"Divide both by 4 → 3/4."},
    {level:'Hard', text:"Is 2/3 equal to 6/9?", choices:["Yes","No","Only sometimes","Cannot say"], answer:0, explain:"Cross-multiply: 2×9 = 18 = 3×6 → equal."},
    {level:'Hard', text:"Simplest form of 24/36 is…", choices:["2/3","3/4","4/6","12/18"], answer:0, explain:"Divide both by 12 → 2/3."},
  ]},
},
{
  id:'maths-d4', subject:'maths', week:1, day:4, title:'Day 4 · Comparing & Ordering Fractions', emoji:'🍕',
  blurb:'Which fraction is bigger? Same/different denominators, and ordering.',

  sections:[

    {type:'text', h:'⚖️ Three easy cases', html:"<b>Same bottom (denominator):</b> the bigger top wins. 7/9 &gt; 5/9 (more ninths).<br><b>Same top (numerator):</b> the bigger bottom means <b>smaller</b> pieces, so it is the smaller fraction. 1/3 &gt; 1/4 (thirds are bigger pieces than quarters)."},
    {type:'text', h:'🔁 Different tops AND bottoms', html:"When both numbers differ, make the comparison fair in one of two ways:<br><b>1) Common denominator:</b> rewrite both with the same bottom (use the LCM), then compare tops.<br><b>2) Cross-multiply:</b> multiply each top by the other bottom and compare the two products."},
    {type:'worked', h:'compare and order', html:"<b>Compare 2/3 and 3/4.</b> LCM of 3 and 4 is 12. 2/3 = 8/12 and 3/4 = 9/12. Since 8 &lt; 9, <b>2/3 &lt; 3/4</b>. (Cross-multiply check: 2×4 = 8, 3×3 = 9 → same answer.) ✅<br><br><b>Order 1/2, 3/4, 2/3 from small to big.</b> Use twelfths: 1/2 = 6/12, 2/3 = 8/12, 3/4 = 9/12 → order is <b>1/2, 2/3, 3/4</b>. ✅"},

  id:'english-d1', subject:'english', week:1, day:1, title:'Day 1 · Fables, Folk Tales & "A Bottle of Dew"', emoji:'📖',
  blurb:'What fables & folk tales are, finding the moral, and the story "A Bottle of Dew".',
  objective:"Understand what fables and folk tales are, learn how to find a story's moral, and read and understand 'A Bottle of Dew' from Poorvi Unit 1.",
  sections:[
    {type:'mascot', text:"Hello reader! 🦉 I'm Hooty. Unit 1 is full of wise old stories. Before we read them, let's understand <b>what kind of stories</b> they are — and the secret 'lesson' hidden inside every one. 📖✨"},
    {type:'text', h:'📖 What exactly is a fable?', html:"A <b>fable</b> is a <b>very short story</b> whose characters are usually <b>animals (or even objects) that talk and behave like people</b>. Because the story is short and simple, the <b>lesson</b> it teaches stands out very clearly. That lesson is called the <b>moral</b>.<br><br>Fables are extremely old. Many famous ones come from <b>Aesop</b> (an ancient Greek storyteller) and from India's own <b>Panchatantra</b> — collections written down thousands of years ago to teach wisdom to children."},
    {type:'text', h:'🗣️ And what is a folk tale?', html:"A <b>folk tale</b> is a <b>traditional story</b> that ordinary people told <b>aloud</b>, passing it from grandparents to parents to children, long <i>before</i> it was ever written in a book. Folk tales belong to the <b>culture</b> of a place. They often celebrate <b>cleverness, kindness and hard work</b>, and they carry the values of the people who told them."},
    {type:'example', html:"Both fables and folk tales teach us something. The difference is mainly <i>how</i> they travel: a <b>fable</b> is a short tale built around one clear moral (often with animals), while a <b>folk tale</b> is a community's story handed down <b>by word of mouth</b> over many years."},
    {type:'text', h:'🎯 How to find the MORAL of a story', html:"The <b>moral</b> is the wise message you carry home. To find it, ask yourself two questions:<br>1) <b>What lesson did the main character learn?</b><br>2) <b>What is the story trying to teach me about life?</b><br>The answer, said in one sentence, is the moral."},
    {type:'practice', q:{text:"The wise lesson hidden inside a fable is called its…", choices:["Moral","Title","Author","Cover"], answer:0, explain:"The life-lesson of a fable or folk tale is its moral."}},

    {type:'text', h:'🍌 The story: "A Bottle of Dew"', html:"A young man named <b>Rama Natha</b> is clever but <b>lazy</b> — he dreams of becoming rich <b>without working</b>. He becomes sure that a single <b>magic 'bottle of dew'</b> will solve everything. His <b>wise father</b> worries about his son's habits, so he gently <b>guides him through a trick</b>: he convinces Rama Natha that the magic will only work if he <b>grows a special crop and waters it daily</b>. To do this, Rama Natha has to <b>work hard in the fields every single day</b>."},
    {type:'text', h:'🌅 What happens — and the lesson', html:"Day after day of honest <b>hard work</b> slowly makes the farm <b>prosper</b> (grow rich). In the end Rama Natha realises the truth: there was never any real magic — the <b>hard work itself</b> was the magic that made him successful.<br><br>👉 <b>Moral:</b> <i>Hard work is more valuable than magic. There is no shortcut to success.</i>"},
    {type:'text', h:'📝 New words to know', html:"<b>dew</b> — tiny drops of water that settle on plants in the early morning.<br><b>lazy</b> — not wanting to work or make an effort.<br><b>prosper</b> — to become successful or wealthy.<br><b>patience</b> — calmly waiting and continuing without giving up."},
    {type:'practice', q:{text:"At first, what does Rama Natha believe will make him rich?", choices:["A magic bottle of dew","Hard work in the fields","His father's money","A lucky coin"], answer:0, explain:"He lazily hopes a magic bottle of dew will make him rich without effort."}},
    {type:'mascot', text:"You've met your first folk tale! 🌟 Take today's 10-question test (you need <b>95%</b> — that's 10/10) and earn your star. ⭐"},
  ],

    {type:'text', h:'🧀 The story: "The Raven and the Fox"', html:"A <b>raven</b> finds a tasty piece of <b>cheese</b> and flies up to a branch to enjoy it. A hungry <b>fox</b> spots the cheese and wants it — but it is too high to reach. So the clever fox uses a trick called <b>flattery</b> (false praise). He loudly admires the raven's beauty and begs to hear its 'wonderful, sweet voice'."},
    {type:'text', h:'🪶 The proud mistake — and the lesson', html:"The <b>proud</b> raven is so pleased by the praise that it opens its beak to <b>caw</b> — and the cheese drops straight into the fox's waiting mouth! The vain raven loses its meal.<br><br>👉 <b>Moral:</b> <i>Do not be fooled by flattery; pride can make you careless.</i><br><br><b>Characters:</b> the <b>fox</b> is <i>cunning/clever</i>; the <b>raven</b> is <i>proud and foolish</i>."},
    {type:'practice', q:{text:"How does the fox get the cheese from the raven?", choices:["By flattering it until it opens its beak","By climbing the tree","By scaring it away","By buying it"], answer:0, explain:"The fox uses flattery (false praise) so the proud raven sings and drops the cheese."}},

    {type:'text', h:'🛡️ The story: "Rama to the Rescue"', html:"One night a <b>thief</b> sneaks into the home of <b>Rama and his wife</b>. Instead of panicking, the quick-thinking couple keep their <b>presence of mind</b>. Using <b>clever thinking and courage</b>, they cleverly outwit the thief and protect their home and belongings."},
    {type:'text', h:'💡 The lesson', html:"👉 <b>Moral:</b> <i>Cleverness, courage and presence of mind can save us from danger.</i> You do not always need strength — a calm, clever mind can be your best protection."},
    {type:'text', h:'📝 New words to know', html:"<b>flattery</b> — false or excessive praise used to fool someone.<br><b>vain / proud</b> — having too high an opinion of oneself.<br><b>cunning</b> — clever in a sly, tricky way.<br><b>courage</b> — bravery; facing danger without giving in to fear.<br><b>presence of mind</b> — staying calm and thinking quickly in a difficult moment."},
    {type:'practice', q:{text:"In 'Rama to the Rescue', how do Rama and his wife defeat the danger?", choices:["With clever thinking and courage","By running far away","By giving the thief money","By shouting only"], answer:0, explain:"They use cleverness, courage and presence of mind to outwit the thief."}},

  id:'english-d3', subject:'english', week:1, day:3, title:'Day 3 · Subject & Predicate', emoji:'📖',
  blurb:'The two parts of every sentence, and how to find each one.',
  objective:"Identify the subject (naming part) and predicate (telling part) of a sentence, and use the verb to locate the predicate.",
  sections:[
    {type:'mascot', text:"Grammar time! 💪 Every sentence is like a little team of TWO players. Let's meet them. 🧩"},
    {type:'text', h:'🧱 The two parts of a sentence', html:"Every complete sentence has two parts:<br><br><b>1) The Subject</b> — the <b>naming part</b>. It tells us <b>who or what</b> the sentence is about.<br><b>2) The Predicate</b> — the <b>telling part</b>. It tells us <b>what the subject does or is</b>. The predicate <b>always contains the verb</b> (the action or 'being' word)."},
    {type:'example', html:"<b>The clever fox</b> | <b>tricked the proud raven.</b><br>↳ Subject = <b>The clever fox</b> (who the sentence is about)<br>↳ Predicate = <b>tricked the proud raven</b> (what the fox did — note the verb <i>tricked</i>)."},
    {type:'text', h:'🔎 How to find the subject', html:"Ask: <b>'Who or what is this sentence about?'</b> The answer — <i>together with its describing words</i> — is the <b>subject</b>. Everything that is left is the <b>predicate</b>.<br><br>The subject can be one word (<i>Birds</i> fly.) or many words (<i>The sacred rivers of India</i> are beautiful.)."},
    {type:'text', h:'🧠 A reliable trick', html:"Find the <b>verb</b> first (the action/being word). The verb is <b>always inside the predicate</b>. The part before the action that names the 'doer' is usually the subject."},
    {type:'practice', q:{text:"In 'The hungry fox waited under the tree.', the SUBJECT is…", choices:["The hungry fox","waited under the tree","under the tree","waited"], answer:0, explain:"The sentence is about 'The hungry fox' → that is the subject."}},
    {type:'practice', q:{text:"In the same sentence, the PREDICATE is…", choices:["waited under the tree","The hungry fox","The hungry","fox"], answer:0, explain:"The telling part (with the verb 'waited') is 'waited under the tree'."}},
    {type:'mascot', text:"You can now split any sentence in two! 🌟 Prove it in today's 10-question test (95% to earn your star). ⭐"},
  ],

    {level:'Medium', text:"The predicate always contains a…", choices:["verb","question mark","capital letter only","number"], answer:0, explain:"The verb is always inside the predicate."},

{
  id:'english-d4', subject:'english', week:1, day:4, title:'Day 4 · Phrases & Clauses', emoji:'📖',
  blurb:'Telling apart a phrase (no subject+verb) from a clause (has subject+verb).',
  objective:"Recognise the difference between a phrase and a clause using the 'subject + verb' test.",
  sections:[
    {type:'mascot', text:"Words love to travel in groups! 🚶‍♂️🚶‍♀️ Today we learn the two main kinds of word-groups: phrases and clauses. 🔗"},
    {type:'text', h:'🔗 What is a phrase?', html:"A <b>phrase</b> is a <b>group of words that work together</b> as one unit but does <b>NOT contain a subject-and-verb pair</b>. By itself, a phrase does <b>not</b> give a complete thought.<br><br>Examples: <i>in the early morning</i> · <i>a bottle of dew</i> · <i>under the tall tree</i>. Notice — none of these has someone <i>doing</i> an action."},
    {type:'text', h:'🧩 What is a clause?', html:"A <b>clause</b> is a <b>group of words that DOES contain a subject and a verb</b>. It tells us about an action or a state.<br><br>Examples: <i>the raven sang</i> (subject <b>the raven</b> + verb <b>sang</b>) · <i>Rama worked hard</i> · <i>because she was tired</i>."},
    {type:'tip', html:"<b>The one test you need:</b> look for a <b>subject + a verb</b>. If you can find <b>both</b> → it's a <b>clause</b>. If you cannot → it's a <b>phrase</b>."},
    {type:'example', html:"<i>near the river</i> → no verb → <b>phrase</b>.<br><i>she sat near the river</i> → subject <b>she</b> + verb <b>sat</b> → <b>clause</b>."},

    {type:'text', h:'🌍 Diversity all around us', html:"The living world is incredibly <b>varied</b> — tiny mosses, giant banyan trees, ants, elephants and whales all share our planet. To study so many living things, scientists <b>classify</b> them: they sort living things into groups based on <b>shared features</b>.<br><br>Think of it like tidying a messy toy box — it is much easier to find things when similar toys are grouped together. We will start by grouping plants."},
    {type:'text', h:"🌱 The stem: a plant's backbone", html:"The <b>stem</b> is the part that holds a plant upright and carries water and food between the roots and the leaves. Plants differ a lot in how <b>tall</b> they grow and how <b>strong</b> their stems are — and that gives us our first way to group them."},
    {type:'text', h:'🪴 Herbs, shrubs and trees', html:"<b>Herbs</b> — <b>small</b> plants with a <b>soft, green, tender stem</b> you can bend easily. They are usually short-lived. <i>Examples: mint, tomato, grass, wheat, coriander.</i><br><br><b>Shrubs</b> — <b>medium-sized</b> plants with a <b>hard, woody stem</b> that branches out <b>near the ground</b>, giving a bushy look. <i>Examples: rose, lemon, henna (mehndi).</i><br><br><b>Trees</b> — <b>tall and large</b> plants with a single <b>thick, hard, woody trunk</b>; branches appear high up. They live for many years. <i>Examples: mango, neem, banyan.</i>"},
    {type:'worked', h:'classify a plant', html:"<b>Plant A:</b> knee-high, with a soft green stem you can bend, lives only a few months. → soft + green + small = a <b>herb</b> (like a tomato plant). ✅<br><b>Plant B:</b> taller than a house, one thick woody trunk, branches high above. → tall + thick woody trunk = a <b>tree</b> (like a mango tree). ✅<br><b>Plant C:</b> waist-high, woody, lots of branches from near the soil. → medium + woody + branches near base = a <b>shrub</b> (like a rose). ✅"},

  sections:[
    {type:'mascot', text:"Hello explorer! 🦉 Hooty here. How do we squeeze the whole Earth onto a sheet of paper? With a map! Let's learn to read one properly. 🧭"},
    {type:'text', h:'🗺️ What is a map?', html:"A <b>map</b> is a drawing of the Earth, or a part of it, on <b>flat paper</b>, drawn as if we are looking <b>straight down from above</b> (a bird's-eye view). Because the real area is huge, the map is shrunk down evenly — it is drawn <b>to scale</b>. Maps help us find places, plan journeys, and understand the world at a glance."},
    {type:'text', h:'🧩 The three components of a map', html:"Every good map has three key parts:<br><br><b>1) Distance (Scale)</b> — a map is far smaller than the real land, so the <b>scale</b> tells us how a small distance on the map stands for a big distance on the ground (for example, 1 cm = 100 km).<br><b>2) Direction</b> — a <b>North arrow</b> or compass shows which way is north, so we can turn the map the right way.<br><b>3) Symbols</b> — maps use small signs and colours for features like rivers, roads and railways. A <b>legend</b> (or key) lists what each symbol means."},
    {type:'text', h:'🎨 Reading the colours', html:"Mapmakers usually colour <b>water blue</b> 💧, <b>plains/forest green</b> 🌳, and <b>mountains brown</b> ⛰️. Whenever you are unsure, check the <b>legend</b> — it decodes every symbol and colour on that map."},
    {type:'text', h:'📚 What is an atlas?', html:"An <b>atlas</b> is a <b>book or collection of many maps</b> bound together — physical maps, political maps, and more — so you can find any part of the world in one place."},
    {type:'worked', h:'read a map step by step', html:"A map shows a wavy <b>blue</b> line, a <b>North arrow</b>, and a scale of <b>1 cm = 50 km</b>.<br>Step 1 — the blue line is a <b>river</b> (colour/symbol, confirmed by the legend).<br>Step 2 — if the river measures <b>4 cm</b> on the map, the real river is 4 × 50 = <b>200 km</b> long (using the scale).<br>Step 3 — the North arrow tells you which way is north so you can orient the map. ✅"},

    {type:'text', h:'🌐 Hemispheres & special parallels', html:"The <b>Equator divides the Earth into two halves</b>: the <b>Northern Hemisphere</b> (above) and the <b>Southern Hemisphere</b> (below).<br>Some special parallels: <b>Tropic of Cancer</b> (23½°N), <b>Tropic of Capricorn</b> (23½°S), and the Arctic and Antarctic Circles."},

{
  id:'social-d5', subject:'social', week:1, day:5, title:'Day 5 · Time Zones, GMT & the Date Line', emoji:'🕐',
  blurb:'Why time differs around the world, GMT as the reference, and the International Date Line.',
  objective:"Explain why time zones exist (15° = 1 hour), what GMT is, and what the International Date Line does.",
  sections:[
    {type:'mascot', text:"Why is it morning in India but still last night in America? Time zones! Let's find out. 🕐🌍"},
    {type:'text', h:'🕐 Why time changes around the world', html:"The Earth <b>rotates once (360°) in 24 hours</b>. Dividing 360° by 24 gives <b>15° of longitude for every 1 hour</b> of time. As the Earth turns, different longitudes face the Sun at different moments — so they have different <b>local times</b>.<br><br>Places to your <b>east</b> see the Sun <b>earlier</b>, so their clocks are <b>ahead</b>. Places to your <b>west</b> are <b>behind</b>."},
    {type:'text', h:"🇬🇧 GMT — the world reference time", html:"<b>GMT (Greenwich Mean Time)</b> is the time at the <b>Prime Meridian (0°)</b> in Greenwich. The world uses it as a <b>reference point</b> to set other times. Because India lies east of Greenwich, <b>Indian Standard Time (IST) = GMT + 5½ hours</b>."},

{"id": "maths-w2-d1", "subject": "maths", "week": 2, "day": 1, "title": "Day 1 · What is a Fraction?", "emoji": "🍕", "blurb": "Deeper meaning of fractions: parts of large collections, fractions on a number line with bigger denominators, and tricky 'fraction of' word problems.", "objective": "Read and interpret fractions of large collections, find a fraction of a quantity in multi-step word problems, and locate fractions accurately on a number line.", "sections": [{"type": "mascot", "text": "Welcome to Week 2! 🦉 I'm Hooty. The idea of a fraction is the same, but today the numbers get bigger and the problems need a little more thinking. Ready? 💪"}, {"type": "text", "h": "🔢 A fraction of a big collection", "html": "Remember: the <b>denominator</b> says how many equal groups to make, and the <b>numerator</b> says how many groups to take. With big numbers, work in two steps.<br><br>To find <b>5/8 of 240</b>: first divide by the bottom (240 ÷ 8 = 30, the size of one group), then multiply by the top (30 × 5 = <b>150</b>). So 5/8 of 240 = 150."}, {"type": "text", "h": "📏 Fractions on a finer number line", "html": "Between two whole numbers you can split the gap into many equal steps. If the gap from 0 to 1 is cut into <b>10 equal steps</b>, the 7th mark is 7/10. Past 1, the marks keep going: the mark after 10/10 is 11/10, which is the same as 1 and 1/10."}, {"type": "worked", "h": "a harder 'fraction of' problem", "html": "<b>A library has 360 books. 3/5 are story books and the rest are textbooks. How many textbooks are there?</b><br>Step 1 — story books = 3/5 of 360 = (360 ÷ 5) × 3 = 72 × 3 = <b>216</b>.<br>Step 2 — textbooks = total − story books = 360 − 216 = <b>144</b>.<br>Check: textbooks are 2/5 of 360 = 72 × 2 = 144. ✅"}, {"type": "practice", "q": {"text": "A school has 480 students. 7/12 of them walk to school. How many students walk to school?", "choices": ["240", "280", "320", "350"], "answer": 1, "explain": "480 ÷ 12 = 40; 40 × 7 = 280."}}, {"type": "practice", "q": {"text": "On a number line from 0 to 2 split into 8 equal steps, what fraction does the 5th mark stand for?", "choices": ["5/8", "5/4", "5/2", "5/16"], "answer": 1, "explain": "From 0 to 2 in 8 equal steps, each step is 2/8 = 1/4; the 5th mark is 5 × 1/4 = 5/4."}}, {"type": "mascot", "text": "Strong start to Week 2! 🌟 Take today's 10-question test — you need <b>95%</b> (10/10) to earn the star. ⭐"}], "test": {"passScore": 95, "questions": [{"level": "Medium", "text": "In the fraction 9/16, which number tells how many equal parts the whole is divided into?", "choices": ["9", "16", "7", "25"], "answer": 1, "explain": "The denominator (bottom) 16 is the number of equal parts."}, {"level": "Medium", "text": "What is 3/7 of 84?", "choices": ["28", "36", "42", "12"], "answer": 1, "explain": "84 ÷ 7 = 12; 12 × 3 = 36."}, {"level": "Medium-Hard", "text": "What is 5/8 of 240 marbles?", "choices": ["120", "150", "180", "200"], "answer": 1, "explain": "240 ÷ 8 = 30; 30 × 5 = 150."}, {"level": "Medium-Hard", "text": "A farmer has 360 eggs. He sells 5/9 of them. How many eggs are left?", "choices": ["160", "200", "240", "120"], "answer": 0, "explain": "Sold = 360 ÷ 9 × 5 = 200; left = 360 − 200 = 160."}, {"level": "Medium-Hard", "text": "On a number line from 0 to 3 divided into 12 equal steps, the 8th mark stands for…", "choices": ["8/12", "2", "8/3", "2/3"], "answer": 1, "explain": "Each step is 3 ÷ 12 = 1/4; 8 × 1/4 = 2."}, {"level": "Medium-Hard", "text": "7/10 of a number is 63. What is the number?", "choices": ["70", "81", "90", "99"], "answer": 2, "explain": "One tenth = 63 ÷ 7 = 9; whole = 9 × 10 = 90."}, {"level": "Hard", "text": "A box has 600 sweets. 2/5 are red, 1/3 are green, the rest are yellow. How many are yellow?", "choices": ["120", "160", "200", "240"], "answer": 1, "explain": "Red = 240, green = 200, used = 440; yellow = 600 − 440 = 160."}, {"level": "Hard", "text": "In a class, 5/9 of 36 students play football and 1/4 of 36 play chess. How many more play football than chess?", "choices": ["9", "11", "13", "20"], "answer": 1, "explain": "Football = 20, chess = 9; difference = 20 − 9 = 11."}, {"level": "Hard", "text": "3/4 of a basket of apples is 27 apples. How many apples are in the whole basket?", "choices": ["30", "32", "36", "40"], "answer": 2, "explain": "One quarter = 27 ÷ 3 = 9; whole = 9 × 4 = 36."}, {"level": "Hard", "text": "A water tank holds 480 litres. It is 5/6 full. How many more litres are needed to fill it completely?", "choices": ["80", "60", "100", "120"], "answer": 0, "explain": "Empty part = 1/6 of 480 = 80 litres."}]}},
{"id": "maths-w2-d2", "subject": "maths", "week": 2, "day": 2, "title": "Day 2 · Proper, Improper & Mixed Fractions", "emoji": "🍕", "blurb": "Converting larger improper fractions to mixed numbers and back, and ordering mixed and improper fractions.", "objective": "Convert larger improper fractions to mixed numbers and back, and compare improper fractions with mixed numbers.", "sections": [{"type": "mascot", "text": "Back again! 🦉 You already know the three families of fractions. Today we convert with bigger numbers and decide which mixed or improper fraction is larger. 🔄"}, {"type": "text", "h": "🔁 Converting with bigger numbers", "html": "<b>Improper → Mixed:</b> divide top by bottom; the quotient is the whole number, the remainder is the new top, the bottom stays the same.<br><b>Mixed → Improper:</b> multiply the whole number by the bottom, add the top, and keep the bottom.<br><br>These rules never change — only the numbers get bigger, so be careful with your division."}, {"type": "worked", "h": "two harder conversions", "html": "<b>Improper → Mixed (47/6):</b> 47 ÷ 6 = 7 remainder 5. So 47/6 = <b>7 5/6</b>. ✅<br><br><b>Mixed → Improper (5 7/9):</b> (5 × 9) + 7 = 45 + 7 = 52, keep the bottom 9 → <b>52/9</b>. ✅<br><br><b>Compare:</b> Which is bigger, 23/4 or 5 1/2? 23/4 = 5 3/4. Since 3/4 &gt; 1/2, <b>23/4 is bigger</b>. ✅"}, {"type": "practice", "q": {"text": "Write 59/8 as a mixed number.", "choices": ["7 1/8", "7 3/8", "6 5/8", "8 3/8"], "answer": 1, "explain": "59 ÷ 8 = 7 remainder 3 → 7 3/8."}}, {"type": "practice", "q": {"text": "Write 6 5/7 as an improper fraction.", "choices": ["42/7", "47/7", "41/7", "11/7"], "answer": 1, "explain": "(6 × 7) + 5 = 47, keep bottom 7 → 47/7."}}, {"type": "mascot", "text": "Conversions mastered with big numbers! 🌟 Take the 10-question test — 95% to earn your star. ⭐"}], "test": {"passScore": 95, "questions": [{"level": "Medium", "text": "Which of these is an improper fraction?", "choices": ["7/12", "11/4", "3/10", "5/9"], "answer": 1, "explain": "11/4 has top bigger than bottom → improper."}, {"level": "Medium", "text": "15/15 is equal to…", "choices": ["0", "1", "15", "1/15"], "answer": 1, "explain": "Top equals bottom → one whole = 1."}, {"level": "Medium-Hard", "text": "Write 38/5 as a mixed number.", "choices": ["7 3/5", "6 4/5", "7 2/5", "8 1/5"], "answer": 0, "explain": "38 ÷ 5 = 7 remainder 3 → 7 3/5."}, {"level": "Medium-Hard", "text": "Write 4 7/8 as an improper fraction.", "choices": ["39/8", "32/8", "47/8", "11/8"], "answer": 0, "explain": "(4 × 8) + 7 = 39 → 39/8."}, {"level": "Medium-Hard", "text": "Write 73/9 as a mixed number.", "choices": ["8 1/9", "7 9/9", "8 2/9", "9 1/9"], "answer": 0, "explain": "73 ÷ 9 = 8 remainder 1 → 8 1/9."}, {"level": "Medium-Hard", "text": "Write 9 5/6 as an improper fraction.", "choices": ["54/6", "59/6", "49/6", "95/6"], "answer": 1, "explain": "(9 × 6) + 5 = 59 → 59/6."}, {"level": "Hard", "text": "Which is larger: 27/4 or 6 1/2?", "choices": ["27/4", "6 1/2", "They are equal", "Cannot tell"], "answer": 0, "explain": "27/4 = 6 3/4; 3/4 > 1/2 so 27/4 is larger."}, {"level": "Hard", "text": "Write 100/7 as a mixed number.", "choices": ["14 1/7", "14 2/7", "13 6/7", "15 1/7"], "answer": 1, "explain": "100 ÷ 7 = 14 remainder 2 → 14 2/7."}, {"level": "Hard", "text": "Which is the SMALLEST: 17/3, 5 2/3, 16/3?", "choices": ["16/3", "17/3", "5 2/3", "All equal"], "answer": 0, "explain": "5 2/3 = 17/3, so the values are 16/3, 17/3, 17/3; smallest is 16/3."}, {"level": "Hard", "text": "A recipe needs 11/4 cups of flour. Written as a mixed number this is…", "choices": ["2 3/4", "2 1/4", "3 1/4", "1 3/4"], "answer": 0, "explain": "11 ÷ 4 = 2 remainder 3 → 2 3/4."}]}},
{"id": "maths-w2-d3", "subject": "maths", "week": 2, "day": 3, "title": "Day 3 · Equivalent Fractions & Simplifying", "emoji": "🍕", "blurb": "Simplifying tougher fractions using the HCF, finding missing terms, and checking equality of larger fractions.", "objective": "Simplify fractions with larger numbers using the highest common factor, find missing numerators or denominators, and check equality by cross-multiplying.", "sections": [{"type": "mascot", "text": "Equivalent fractions again — but tougher! 🦉 Today the numbers are bigger, so we find the highest common factor to simplify in one clean step. 🟰"}, {"type": "text", "h": "➗ Simplify using the HCF", "html": "To simplify quickly, divide the top and bottom by their <b>highest common factor</b> (HCF) — the biggest number that divides both.<br><br>Example: 36/48. The HCF of 36 and 48 is 12. 36 ÷ 12 = 3 and 48 ÷ 12 = 4, so 36/48 = <b>3/4</b> in one step."}, {"type": "text", "h": "🔎 Finding a missing term", "html": "If two fractions are equal, find what the bottom (or top) was multiplied by, and do the same to the other number.<br>Example: 5/8 = ?/56. The bottom went 8 → 56, that is × 7, so the top is 5 × 7 = <b>35</b>. So 5/8 = 35/56."}, {"type": "worked", "h": "simplify, fill in & check", "html": "<b>Simplify 84/108.</b> HCF of 84 and 108 is 12. 84 ÷ 12 = 7, 108 ÷ 12 = 9 → <b>7/9</b>. ✅<br><br><b>Fill in:</b> 7/9 = 63/?. The top went 7 → 63, that is × 9, so the bottom is 9 × 9 = <b>81</b>. ✅<br><br><b>Check equal:</b> Is 6/14 = 15/35? Cross-multiply: 6 × 35 = 210 and 14 × 15 = 210. They match → <b>yes, equal</b>. ✅"}, {"type": "practice", "q": {"text": "Simplify 45/60 to its lowest terms.", "choices": ["3/4", "5/6", "9/12", "2/3"], "answer": 0, "explain": "HCF of 45 and 60 is 15; 45 ÷ 15 = 3, 60 ÷ 15 = 4 → 3/4."}}, {"type": "practice", "q": {"text": "Find the missing number: 4/7 = ?/49.", "choices": ["21", "24", "28", "35"], "answer": 2, "explain": "Bottom × 7 (7 → 49), so top = 4 × 7 = 28."}}, {"type": "mascot", "text": "You simplify like a pro now! 🌟 Take the 10-question test — 95% to earn your star. ⭐"}], "test": {"passScore": 95, "questions": [{"level": "Medium", "text": "To simplify a fraction in one step, divide the top and bottom by their…", "choices": ["highest common factor", "sum", "largest digit", "difference"], "answer": 0, "explain": "Dividing by the HCF gives lowest terms in one step."}, {"level": "Medium", "text": "Simplify 16/20 to lowest terms.", "choices": ["4/5", "8/10", "3/4", "2/3"], "answer": 0, "explain": "Divide both by 4 → 4/5."}, {"level": "Medium-Hard", "text": "Simplify 36/48 to lowest terms.", "choices": ["3/4", "2/3", "6/8", "9/12"], "answer": 0, "explain": "HCF is 12; 36 ÷ 12 = 3, 48 ÷ 12 = 4 → 3/4."}, {"level": "Medium-Hard", "text": "Find the missing number: 5/8 = ?/56.", "choices": ["30", "35", "40", "45"], "answer": 1, "explain": "Bottom × 7, so top = 5 × 7 = 35."}, {"level": "Medium-Hard", "text": "Simplify 72/96 to lowest terms.", "choices": ["3/4", "2/3", "4/5", "6/8"], "answer": 0, "explain": "HCF is 24; 72 ÷ 24 = 3, 96 ÷ 24 = 4 → 3/4."}, {"level": "Medium-Hard", "text": "Find the missing number: 9/? = 63/77.", "choices": ["9", "10", "11", "13"], "answer": 2, "explain": "Top × 7 (9 → 63), so bottom = 77 ÷ 7 = 11."}, {"level": "Hard", "text": "Simplest form of 84/108 is…", "choices": ["7/9", "6/8", "3/4", "14/18"], "answer": 0, "explain": "HCF is 12; 84 ÷ 12 = 7, 108 ÷ 12 = 9 → 7/9."}, {"level": "Hard", "text": "Is 6/14 equal to 15/35?", "choices": ["Yes", "No", "Only sometimes", "Cannot say"], "answer": 0, "explain": "Cross-multiply: 6 × 35 = 210 = 14 × 15 → equal."}, {"level": "Hard", "text": "Simplest form of 105/135 is…", "choices": ["7/9", "5/7", "3/4", "21/27"], "answer": 0, "explain": "HCF is 15; 105 ÷ 15 = 7, 135 ÷ 15 = 9 → 7/9."}, {"level": "Hard", "text": "Which fraction is NOT equivalent to 3/5?", "choices": ["18/30", "27/45", "21/35", "24/35"], "answer": 3, "explain": "24/35 is not 3/5 (cross: 3×35=105, 5×24=120); the others all equal 3/5."}]}},
{"id": "maths-w2-d4", "subject": "maths", "week": 2, "day": 4, "title": "Day 4 · Comparing & Ordering Fractions", "emoji": "🍕", "blurb": "Comparing and ordering unlike fractions using LCM and cross-multiplication, including mixed numbers.", "objective": "Compare unlike fractions using the LCM or cross-multiplication and order sets of fractions and mixed numbers.", "sections": [{"type": "mascot", "text": "Which is bigger — 5/7 or 7/10? 🤔 Today we compare trickier fractions where the easy tricks do not work. Time for LCM and cross-multiplying! ⚖️"}, {"type": "text", "h": "🔁 The two reliable methods", "html": "When tops and bottoms both differ:<br><b>1) Common denominator:</b> rewrite both fractions over the LCM of the bottoms, then compare the tops.<br><b>2) Cross-multiply:</b> multiply each top by the other bottom; the bigger product sits over the bigger fraction.<br><br>For mixed numbers, compare the whole parts first; only compare the fractions if the wholes are equal."}, {"type": "worked", "h": "compare and order", "html": "<b>Compare 5/7 and 7/10.</b> Cross-multiply: 5 × 10 = 50 (over 5/7) and 7 × 7 = 49 (over 7/10). Since 50 &gt; 49, <b>5/7 &gt; 7/10</b>. ✅<br><br><b>Order 3/4, 5/8, 11/16, 7/8 (small → big).</b> Use sixteenths: 3/4 = 12/16, 5/8 = 10/16, 11/16 = 11/16, 7/8 = 14/16. Order of tops 10, 11, 12, 14 → <b>5/8, 11/16, 3/4, 7/8</b>. ✅"}, {"type": "practice", "q": {"text": "Which is greater: 5/7 or 7/10?", "choices": ["5/7", "7/10", "They are equal", "Can't tell"], "answer": 0, "explain": "Cross-multiply: 5 × 10 = 50 > 7 × 7 = 49 → 5/7 is greater."}}, {"type": "practice", "q": {"text": "Which is the GREATEST: 2/3, 5/6, 7/9, 11/18?", "choices": ["2/3", "5/6", "7/9", "11/18"], "answer": 1, "explain": "As eighteenths: 12, 15, 14, 11 → greatest is 15/18 = 5/6."}}, {"type": "mascot", "text": "You can order any fractions now! 🌟 Take the 10-question test — 95% to earn your star. ⭐"}], "test": {"passScore": 95, "questions": [{"level": "Medium", "text": "Which is greater: 11/13 or 9/13?", "choices": ["11/13", "9/13", "Equal", "Can't tell"], "answer": 0, "explain": "Same bottom; bigger top wins → 11/13."}, {"level": "Medium", "text": "Which is greater: 4/5 or 4/9?", "choices": ["4/5", "4/9", "Equal", "Can't tell"], "answer": 0, "explain": "Same top; fifths are bigger pieces than ninths → 4/5."}, {"level": "Medium-Hard", "text": "Which is greater: 5/8 or 2/3?", "choices": ["2/3", "5/8", "Equal", "Can't tell"], "answer": 0, "explain": "As 24ths: 16/24 > 15/24 → 2/3."}, {"level": "Medium-Hard", "text": "Which is greater: 7/9 or 5/6?", "choices": ["5/6", "7/9", "Equal", "Can't tell"], "answer": 0, "explain": "As 18ths: 15/18 > 14/18 → 5/6."}, {"level": "Medium-Hard", "text": "Cross-multiply: which is greater, 4/7 or 5/9?", "choices": ["4/7", "5/9", "Equal", "Can't tell"], "answer": 0, "explain": "4 × 9 = 36 > 7 × 5 = 35 → 4/7 is greater."}, {"level": "Medium-Hard", "text": "Which is the SMALLEST: 3/4, 5/8, 7/12, 2/3?", "choices": ["7/12", "5/8", "2/3", "3/4"], "answer": 0, "explain": "As 24ths: 18, 15, 14, 16 → smallest is 14/24 = 7/12."}, {"level": "Hard", "text": "Put in order (small → big): 5/6, 3/4, 7/12.", "choices": ["7/12, 3/4, 5/6", "3/4, 7/12, 5/6", "5/6, 3/4, 7/12", "7/12, 5/6, 3/4"], "answer": 0, "explain": "As twelfths: 10, 9, 7 → 7/12, 3/4, 5/6."}, {"level": "Hard", "text": "Which is greater: 3 2/5 or 17/5?", "choices": ["They are equal", "3 2/5", "17/5", "Can't tell"], "answer": 0, "explain": "3 2/5 = 17/5, so they are equal."}, {"level": "Hard", "text": "Which is the GREATEST: 9/10, 13/15, 5/6, 7/8?", "choices": ["9/10", "13/15", "5/6", "7/8"], "answer": 0, "explain": "As 120ths: 108, 104, 100, 105 → greatest is 108/120 = 9/10."}, {"level": "Hard", "text": "Order from biggest to smallest: 2 1/3, 11/4, 9/4.", "choices": ["11/4, 2 1/3, 9/4", "9/4, 2 1/3, 11/4", "2 1/3, 11/4, 9/4", "11/4, 9/4, 2 1/3"], "answer": 0, "explain": "Values: 2 1/3 ≈ 2.33, 11/4 = 2.75, 9/4 = 2.25 → 11/4, 2 1/3, 9/4."}]}},
{"id": "maths-w2-d5", "subject": "maths", "week": 2, "day": 5, "title": "Day 5 · Adding, Subtracting & Multiplying", "emoji": "🍕", "blurb": "Multi-step operations on unlike and mixed fractions with bigger denominators, plus multi-step word problems.", "objective": "Add, subtract and multiply unlike and mixed fractions with larger denominators and solve multi-step word problems.", "sections": [{"type": "mascot", "text": "Final fractions day of Week 2! ➕➖✖️ Today the denominators are bigger and the word problems need two or three steps. Take your time and work neatly. 💪"}, {"type": "text", "h": "➕➖ Unlike and mixed", "html": "<b>Unlike fractions:</b> rewrite both over the LCM of the bottoms, then add or subtract the tops.<br><b>Mixed numbers:</b> the safest way is to change both into improper fractions, give them a common bottom, then add or subtract.<br>Always simplify your final answer."}, {"type": "text", "h": "✖️ Multiplying mixed numbers", "html": "To multiply mixed numbers, first change each to an improper fraction, multiply tops together and bottoms together, then simplify.<br>Example: 2 1/2 × 1 1/3 = 5/2 × 4/3 = 20/6 = <b>10/3 = 3 1/3</b>."}, {"type": "worked", "h": "one tough word problem", "html": "<b>A tailor had 7 1/2 m of cloth. He used 2 3/4 m for a shirt and 1 5/6 m for a bag. How much cloth is left?</b><br>Used = 2 3/4 + 1 5/6. LCM of 4 and 6 is 12: 2 9/12 + 1 10/12 = 3 19/12 = <b>4 7/12 m</b>.<br>Left = 7 1/2 − 4 7/12 = 7 6/12 − 4 7/12 = 6 18/12 − 4 7/12 = <b>2 11/12 m</b>. ✅"}, {"type": "practice", "q": {"text": "What is 5/6 + 3/8? (give the simplest form)", "choices": ["8/14", "1 5/24", "29/24", "1 1/4"], "answer": 1, "explain": "LCM 24: 20/24 + 9/24 = 29/24 = 1 5/24."}}, {"type": "practice", "q": {"text": "What is 2 1/4 × 1 1/3? (simplest form)", "choices": ["3", "2 1/2", "3 1/3", "2 3/4"], "answer": 0, "explain": "9/4 × 4/3 = 36/12 = 3."}}, {"type": "mascot", "text": "You have mastered harder fraction operations! 🌟 This is the final Week 2 Maths test — 95% to earn your star and finish the week. ⭐"}], "test": {"passScore": 95, "questions": [{"level": "Medium", "text": "5/12 + 1/12 = ? (simplest form)", "choices": ["1/2", "6/24", "5/12", "1/3"], "answer": 0, "explain": "6/12 simplifies to 1/2."}, {"level": "Medium", "text": "7/9 − 1/3 = ?", "choices": ["4/9", "6/6", "2/3", "5/9"], "answer": 0, "explain": "1/3 = 3/9; 7/9 − 3/9 = 4/9."}, {"level": "Medium-Hard", "text": "3/4 + 2/3 = ? (simplest form)", "choices": ["1 5/12", "5/7", "17/12", "1 1/3"], "answer": 0, "explain": "LCM 12: 9/12 + 8/12 = 17/12 = 1 5/12."}, {"level": "Medium-Hard", "text": "5/6 − 3/8 = ? (simplest form)", "choices": ["11/24", "2/2", "1/2", "13/24"], "answer": 0, "explain": "LCM 24: 20/24 − 9/24 = 11/24."}, {"level": "Medium-Hard", "text": "4/9 × 3/8 = ? (simplest form)", "choices": ["1/6", "12/72", "2/9", "1/4"], "answer": 0, "explain": "12/72 simplifies to 1/6."}, {"level": "Medium-Hard", "text": "2 2/3 × 1 1/2 = ? (simplest form)", "choices": ["4", "3 1/2", "4 1/2", "3 2/3"], "answer": 0, "explain": "8/3 × 3/2 = 24/6 = 4."}, {"level": "Hard", "text": "📖 A jug holds 3 3/4 L. If 1 5/8 L is poured out, how much is left?", "choices": ["2 1/8 L", "2 3/8 L", "1 7/8 L", "2 1/4 L"], "answer": 0, "explain": "30/8 − 13/8 = 17/8 = 2 1/8 L."}, {"level": "Hard", "text": "📖 Meera read 2/5 of a book on Monday and 1/3 on Tuesday. What fraction is still left?", "choices": ["4/15", "11/15", "2/15", "1/3"], "answer": 0, "explain": "Read 6/15 + 5/15 = 11/15; left = 4/15."}, {"level": "Hard", "text": "📖 A rope is 12 m long. 5/8 of it is cut off. How long is the remaining piece?", "choices": ["4 1/2 m", "7 1/2 m", "5 m", "4 m"], "answer": 0, "explain": "Cut = 5/8 × 12 = 7 1/2 m; left = 12 − 7 1/2 = 4 1/2 m."}, {"level": "Hard", "text": "📖 A recipe needs 2/3 cup of sugar. How much sugar is needed to make 4 1/2 times the recipe?", "choices": ["3 cups", "2 2/3 cups", "3 1/2 cups", "4 cups"], "answer": 0, "explain": "2/3 × 9/2 = 18/6 = 3 cups."}]}},
{"id": "english-w2-d1", "subject": "english", "week": 2, "day": 1, "title": "Day 1 · Fables, Folk Tales & 'A Bottle of Dew'", "emoji": "📖", "blurb": "Going deeper into fables, folk tales and the hidden lessons inside 'A Bottle of Dew'.", "objective": "Compare fables and folk tales more closely, infer deeper meanings from 'A Bottle of Dew', and understand why the father chose a trick instead of a lecture.", "sections": [{"type": "mascot", "text": "Welcome back, reader! 🦉 Last week we learned what fables and folk tales are. This week we dig <b>under</b> the surface — why characters act as they do, and what the story is really teaching. Think hard! 🤔📖"}, {"type": "text", "h": "📖 Fable vs folk tale — a closer look", "html": "Both teach wisdom, but they differ in <b>origin</b> and <b>style</b>. A <b>fable</b> is usually short, often uses <b>talking animals</b>, and points to <b>one clear moral</b>. A <b>folk tale</b> grows out of a whole <b>community's traditions</b>, is passed on <b>by word of mouth</b>, and may have many human characters and twists. So a fable feels <i>designed to teach</i>, while a folk tale feels <i>handed down to remember</i>."}, {"type": "example", "html": "In 'A Bottle of Dew', the father never says 'Stop being lazy.' Instead he lets Rama Natha <b>discover the truth himself</b> through daily work. A good story often teaches by <b>showing</b>, not by <b>telling</b>."}, {"type": "text", "h": "🌅 Reading between the lines", "html": "The father knew that simply <b>ordering</b> his son to work would not change him — Rama Natha had to <b>feel the reward of effort</b> on his own. The 'magic' was a gentle lie that led to a real truth: <b>steady hard work</b>, repeated day after day, is what made the farm <b>prosper</b>. The bottle of dew was never the point — the daily watering was."}, {"type": "practice", "q": {"text": "Why did the father use a trick about magic instead of simply telling Rama Natha to work hard?", "choices": ["So his son would discover the value of hard work through his own experience", "Because the father himself believed the dew was magic", "Because Rama Natha was too poor to buy seeds", "Because the king had ordered him to grow the crop"], "answer": 0, "explain": "The father knew experience would teach his lazy son better than a lecture would."}}, {"type": "practice", "q": {"text": "'Rama Natha was clever but lazy.' This tells us that being clever alone…", "choices": ["is not enough for success without effort", "always makes a person rich", "is the same as being hard-working", "is a kind of magic"], "answer": 0, "explain": "The story shows cleverness is wasted unless joined with honest effort."}}, {"type": "mascot", "text": "You're reading like a detective now! 🌟 The test is harder this week — take the 10-question test and aim for <b>95%</b> (10/10) to earn your star. ⭐"}], "test": {"passScore": 95, "questions": [{"level": "Medium", "text": "Which feature most clearly marks a story as a FABLE rather than a folk tale?", "choices": ["A short tale, often with talking animals, built around one clear moral", "A long story with many kings and battles", "A story printed only in newspapers", "A story with no lesson at all"], "answer": 0, "explain": "Fables are short, often use talking animals, and centre on one moral."}, {"level": "Medium", "text": "The phrase 'passed down by word of mouth' best describes how a…", "choices": ["folk tale travels through generations", "dictionary is printed", "fable's moral is calculated", "textbook is written"], "answer": 0, "explain": "Folk tales are handed down orally before being written."}, {"level": "Medium-Hard", "text": "In 'A Bottle of Dew', the real reason the farm prospered was…", "choices": ["the daily hard work Rama Natha was tricked into doing", "the dew collected in the magic bottle", "money given by his father", "good luck from a lucky coin"], "answer": 0, "explain": "Honest daily labour, not magic, made the farm rich."}, {"level": "Medium-Hard", "text": "What does Rama Natha's character change suggest about people in general?", "choices": ["People can change their habits when they experience the rewards of effort", "People never change once they are lazy", "Only magic can change a lazy person", "Hard work makes people poorer"], "answer": 0, "explain": "Experiencing the fruits of his labour reformed him — habits can change."}, {"level": "Medium-Hard", "text": "The word 'prosper' in the story is closest in meaning to…", "choices": ["thrive", "fail", "sleep", "escape"], "answer": 0, "explain": "To prosper is to thrive — grow successful or wealthy."}, {"level": "Medium-Hard", "text": "Which sentence best captures the IRONY in 'A Bottle of Dew'?", "choices": ["The 'magic' he chased was really ordinary hard work", "He found a real magic bottle in the end", "His father turned out to be a magician", "The dew made the crops grow instantly"], "answer": 0, "explain": "Irony: the magic he wanted was just the effort he avoided."}, {"level": "Hard", "text": "The father's plan works mainly because it relies on which idea?", "choices": ["A habit formed by daily repetition becomes lasting", "Children always obey direct orders", "Magic spells truly exist", "Wealth comes only from inheritance"], "answer": 0, "explain": "Daily watering built a lasting habit of work in Rama Natha."}, {"level": "Hard", "text": "A 'fable' and a 'folk tale' are alike in that both…", "choices": ["aim to pass on a lesson or value", "must use only animal characters", "were first shown on television", "avoid teaching anything"], "answer": 0, "explain": "Both carry wisdom or values, though in different ways."}, {"level": "Hard", "text": "Which proverb LEAST matches the moral of 'A Bottle of Dew'?", "choices": ["A rolling stone gathers no moss", "No pain, no gain", "Hard work is the key to success", "There is no shortcut to success"], "answer": 0, "explain": "The other three praise effort; the rolling-stone proverb is about a different idea."}, {"level": "Hard", "text": "If Rama Natha had been given gold instead of being tricked into farming, the story's moral would have been…", "choices": ["weakened, because he would not have learned the value of work", "exactly the same as before", "stronger, because gold is better than dew", "about flattery instead of effort"], "answer": 0, "explain": "Handing him gold would skip the lesson that effort itself brings reward."}]}},
{"id": "english-w2-d2", "subject": "english", "week": 2, "day": 2, "title": "Day 2 · 'The Raven and the Fox' & 'Rama to the Rescue'", "emoji": "📖", "blurb": "Deeper character study and the clever thinking behind both tales.", "objective": "Analyse the motives and traits of the fox, raven, and the brave couple, and infer the lessons more deeply.", "sections": [{"type": "mascot", "text": "Back to our cunning fox and proud raven! 🦊🐦 This week we study <b>why</b> the characters behave as they do, not just <b>what</b> happens. Watch their thinking closely. 🧠"}, {"type": "text", "h": "🧀 The fox's clever plan", "html": "The fox could not reach the cheese, so he attacked the raven's <b>weakest point</b> — its <b>pride</b>. By praising the raven's 'beautiful voice', the fox tempted it to <b>open its beak</b> and prove him right. The fox did not need strength; he needed to understand the raven's <b>vanity</b>. That is what makes him <i>cunning</i> rather than merely lucky."}, {"type": "example", "html": "Notice the chain of cause and effect: <b>flattery → pride → the open beak → the dropped cheese</b>. Remove the pride, and the trick fails completely."}, {"type": "text", "h": "🛡️ Presence of mind in 'Rama to the Rescue'", "html": "When the thief enters, Rama and his wife do <b>not</b> rely on shouting or strength. They stay <b>calm</b> and use <b>quick, clever thinking</b> — their <b>presence of mind</b> — to outwit him. The tale shows that a calm, thinking mind can defeat a stronger opponent."}, {"type": "practice", "q": {"text": "The fox's flattery only worked because the raven had which weakness?", "choices": ["Pride / vanity", "Hunger", "Poor eyesight", "Kindness"], "answer": 0, "explain": "The fox exploited the raven's pride, tempting it to show off its voice."}}, {"type": "practice", "q": {"text": "Both tales share a common lesson. What is it?", "choices": ["A clever, thinking mind can succeed where strength alone cannot", "Animals are smarter than humans", "Honesty always loses", "Loud voices win arguments"], "answer": 0, "explain": "In both, clever thinking — not strength — wins the day."}}, {"type": "mascot", "text": "Sharp thinking! 🌟 Now take the harder 10-question test (95% to earn your star). ⭐"}], "test": {"passScore": 95, "questions": [{"level": "Medium", "text": "The fox aims his praise at the raven's voice in order to make it…", "choices": ["open its beak and drop the cheese", "fly higher into the tree", "share the cheese fairly", "fall asleep"], "answer": 0, "explain": "If the raven sings, the cheese falls — that is the fox's goal."}, {"level": "Medium", "text": "In 'Rama to the Rescue', the couple's main strength against the thief is their…", "choices": ["calm, clever thinking", "great physical power", "loud screaming", "large amount of money"], "answer": 0, "explain": "They rely on presence of mind, not force."}, {"level": "Medium-Hard", "text": "Which word pair best describes the fox AND the raven, in that order?", "choices": ["cunning … vain", "honest … brave", "timid … wise", "generous … cruel"], "answer": 0, "explain": "The fox is cunning; the raven is vain (proud)."}, {"level": "Medium-Hard", "text": "The raven's real mistake was that it…", "choices": ["let praise blind it to the fox's true intention", "flew too slowly", "chose the wrong tree", "ate the cheese too quickly"], "answer": 0, "explain": "It was so flattered that it ignored the fox's trick."}, {"level": "Medium-Hard", "text": "'Flattery' differs from honest praise because flattery is…", "choices": ["false praise given to fool or gain something", "always spoken loudly", "praise about someone's voice only", "praise that is fully deserved"], "answer": 0, "explain": "Flattery is insincere praise meant to deceive."}, {"level": "Medium-Hard", "text": "The phrase 'presence of mind' in 'Rama to the Rescue' means…", "choices": ["staying calm and thinking quickly under pressure", "remembering an old memory", "being physically present in a room", "feeling great fear"], "answer": 0, "explain": "Presence of mind is calm, quick thinking in a crisis."}, {"level": "Hard", "text": "Which statement about the fox is an INFERENCE rather than a stated fact?", "choices": ["The fox understood that the raven would believe praise about itself", "The fox was hungry", "The fox stood below the tree", "The cheese fell into the fox's mouth"], "answer": 0, "explain": "We infer the fox's understanding of the raven; the rest is stated."}, {"level": "Hard", "text": "If the raven had stayed silent, the fox's plan would have…", "choices": ["failed, because the cheese would not have fallen", "still succeeded by force", "worked even faster", "made the raven lose anyway"], "answer": 0, "explain": "Silence keeps the beak closed, so the cheese stays safe."}, {"level": "Hard", "text": "What deeper idea links 'The Raven and the Fox' with 'A Bottle of Dew'?", "choices": ["A character's flaw or virtue decides the outcome", "Both stories are set at night", "Both feature a thief", "Both end with magic"], "answer": 0, "explain": "Pride ruins the raven; effort saves Rama Natha — traits drive the result."}, {"level": "Hard", "text": "Which proverb fits 'The Raven and the Fox' BEST?", "choices": ["Beware of those who flatter you", "Slow and steady wins the race", "Honesty is the best policy", "Strike while the iron is hot"], "answer": 0, "explain": "The tale warns against being fooled by flattery."}]}},
{"id": "english-w2-d3", "subject": "english", "week": 2, "day": 3, "title": "Day 3 · Subject & Predicate", "emoji": "📖", "blurb": "Finding subjects and predicates in longer, trickier sentences.", "objective": "Identify the subject and predicate even when the subject is long, hidden, or not at the start of the sentence.", "sections": [{"type": "mascot", "text": "Grammar gets sneaky today! 🕵️ The subject is not always the first word, and predicates can be long. Let's learn to find them no matter where they hide. 🧩"}, {"type": "text", "h": "🧱 Quick recap, then a twist", "html": "The <b>subject</b> names who or what the sentence is about; the <b>predicate</b> tells what the subject does or is, and <b>contains the verb</b>. The twist: sometimes the sentence <b>begins with extra words</b> (like 'In the morning…') that are <b>not</b> the subject. Always find the <b>verb</b> first, then ask <b>who or what does it</b>."}, {"type": "worked", "h": "🔎 Worked example", "html": "<i>'Early in the morning, the tired farmer watered his field.'</i><br>Step 1: find the verb → <b>watered</b>.<br>Step 2: who watered? → <b>the tired farmer</b> = <b>subject</b>.<br>Step 3: everything telling about that doer → <b>watered his field</b> = <b>predicate</b>. The opening 'Early in the morning' is an extra phrase, not the subject."}, {"type": "example", "html": "<i>'The proud raven on the high branch dropped the cheese.'</i> → Subject = <b>The proud raven on the high branch</b>; Predicate = <b>dropped the cheese</b>. The whole naming group, including 'on the high branch', is the subject."}, {"type": "practice", "q": {"text": "In 'After a long day, the clever fox returned to its den.', the SUBJECT is…", "choices": ["the clever fox", "After a long day", "returned to its den", "its den"], "answer": 0, "explain": "Find the verb 'returned'; who returned? — the clever fox is the subject. The opening phrase is extra."}}, {"type": "practice", "q": {"text": "In 'The brave couple in the small house outwitted the thief.', the PREDICATE is…", "choices": ["outwitted the thief", "The brave couple in the small house", "in the small house", "The brave couple"], "answer": 0, "explain": "The verb 'outwitted' begins the telling part; the whole naming group is the subject."}}, {"type": "mascot", "text": "You can spot hidden subjects now! 🌟 Take the harder 10-question test (95% to earn your star). ⭐"}], "test": {"passScore": 95, "questions": [{"level": "Medium", "text": "The part of a sentence that contains the verb is the…", "choices": ["predicate", "subject", "title", "comma"], "answer": 0, "explain": "The verb always sits inside the predicate."}, {"level": "Medium", "text": "The best first step to find the subject in a tricky sentence is to…", "choices": ["find the verb, then ask who or what does it", "count the words", "look for the last word", "find the longest word"], "answer": 0, "explain": "Locate the verb, then ask who/what performs it."}, {"level": "Medium-Hard", "text": "In 'In the dark forest, a hungry tiger roared loudly.', the SUBJECT is…", "choices": ["a hungry tiger", "In the dark forest", "roared loudly", "the dark forest"], "answer": 0, "explain": "Who roared? — a hungry tiger. The opening phrase is not the subject."}, {"level": "Medium-Hard", "text": "In 'The old man with the long white beard told a story.', the SUBJECT is…", "choices": ["The old man with the long white beard", "told a story", "with the long white beard", "a story"], "answer": 0, "explain": "The whole naming group, including the describing phrase, is the subject."}, {"level": "Medium-Hard", "text": "In 'Down the hill rolled the heavy round stone.', the SUBJECT is…", "choices": ["the heavy round stone", "Down the hill", "rolled", "the hill"], "answer": 0, "explain": "What rolled? — the heavy round stone, even though it comes after the verb."}, {"level": "Medium-Hard", "text": "In 'My two younger cousins from Delhi visit us every summer.', the PREDICATE is…", "choices": ["visit us every summer", "My two younger cousins from Delhi", "from Delhi", "every summer"], "answer": 0, "explain": "The telling part with the verb 'visit' is 'visit us every summer'."}, {"level": "Hard", "text": "In 'Quietly, the thief opened the wooden door.', which is the SUBJECT?", "choices": ["the thief", "Quietly", "opened the wooden door", "the wooden door"], "answer": 0, "explain": "'Quietly' is an adverb; the doer of 'opened' is the thief."}, {"level": "Hard", "text": "In which sentence is 'the children' NOT the subject?", "choices": ["The teacher praised the children.", "The children sang a song.", "The children were playing outside.", "The children laughed loudly."], "answer": 0, "explain": "Here 'the teacher' is the subject; 'the children' is part of the predicate."}, {"level": "Hard", "text": "In 'There stood a tall, ancient temple beside the river.', the SUBJECT is…", "choices": ["a tall, ancient temple", "There", "stood", "the river"], "answer": 0, "explain": "'There' is just an introducer; what stood? — a tall, ancient temple."}, {"level": "Hard", "text": "Identify the PREDICATE: 'The sacred rivers that flow from the Himalayas reach the sea.'", "choices": ["reach the sea", "The sacred rivers that flow from the Himalayas", "that flow from the Himalayas", "from the Himalayas"], "answer": 0, "explain": "The main verb is 'reach'; the long naming group before it is the subject."}]}},
{"id": "english-w2-d4", "subject": "english", "week": 2, "day": 4, "title": "Day 4 · Phrases & Clauses", "emoji": "📖", "blurb": "Telling phrases from clauses in longer, trickier word-groups.", "objective": "Apply the subject-plus-verb test confidently, even with dependent clauses and long phrases.", "sections": [{"type": "mascot", "text": "Phrases and clauses again — but trickier! 🔗 Some word-groups look long yet are still phrases, and some short ones are clauses. The test stays the same: find a <b>subject + verb</b>. 🔍"}, {"type": "text", "h": "🔗 Recap with a warning", "html": "A <b>phrase</b> has <b>no subject-and-verb pair</b>; a <b>clause</b> has <b>both</b>. Warning: a phrase can be <b>long</b> (<i>after the heavy rain of the cold winter night</i>) and still have <b>no verb doing an action by a subject</b>. Do not be fooled by length — only the <b>subject + verb test</b> decides."}, {"type": "text", "h": "🧩 A note on dependent clauses", "html": "Some clauses cannot stand alone yet are <b>still clauses</b> because they contain a subject and verb. Example: <i>because the farmer worked hard</i> — subject <b>the farmer</b> + verb <b>worked</b> = a <b>clause</b>, even though it begins with 'because' and feels incomplete."}, {"type": "tip", "html": "<b>Trap to avoid:</b> words ending in -ing or 'to + verb' are often NOT a full verb with a subject. <i>'running through the field'</i> has no subject doing it → <b>phrase</b>. <i>'the dog ran through the field'</i> has subject + verb → <b>clause</b>."}, {"type": "practice", "q": {"text": "Is 'after the long and tiring journey home' a phrase or a clause?", "choices": ["Phrase", "Clause", "Sentence", "Question"], "answer": 0, "explain": "It is long but has no subject + verb pair, so it is a phrase."}}, {"type": "practice", "q": {"text": "Is 'although she felt very tired' a phrase or a clause?", "choices": ["Clause", "Phrase", "Title", "Word"], "answer": 0, "explain": "Subject 'she' + verb 'felt' make it a clause, even thoug
