h it starts with 'although'."}}, {"type": "mascot", "text": "No more traps can fool you! 🌟 Take the harder 10-question test (95% to earn your star). ⭐"}], "test": {"passScore": 95, "questions": [{"level": "Medium", "text": "The single test that separates a phrase from a clause is the presence of a…", "choices": ["subject and a verb", "full stop", "capital letter", "long word"], "answer": 0, "explain": "A clause has a subject + verb; a phrase does not."}, {"level": "Medium", "text": "A word-group can be long and still be a PHRASE if it…", "choices": ["has no subject-and-verb pair", "contains more than four words", "starts with 'the'", "ends without a comma"], "answer": 0, "explain": "Length does not matter; absence of subject + verb makes it a phrase."}, {"level": "Medium-Hard", "text": "Which one is a CLAUSE?", "choices": ["because the river had risen overnight", "after the heavy monsoon rain", "a bottle of cold morning dew", "in the middle of the dark forest"], "answer": 0, "explain": "'the river had risen' is a subject + verb pair, so it is a clause."}, {"level": "Medium-Hard", "text": "Which one is a PHRASE?", "choices": ["running quickly across the open field", "the boy ran across the field", "she was running fast", "the field was very wide"], "answer": 0, "explain": "'running...' has no subject performing the verb, so it is a phrase."}, {"level": "Medium-Hard", "text": "'while the raven sang on the branch' is a…", "choices": ["clause", "phrase", "sentence", "command"], "answer": 0, "explain": "Subject 'the raven' + verb 'sang' → a clause (a dependent one)."}, {"level": "Medium-Hard", "text": "'to win the difficult race' is a…", "choices": ["phrase", "clause", "question", "statement"], "answer": 0, "explain": "'to win' is not a finite verb with a subject, so it is a phrase."}, {"level": "Hard", "text": "Which option is a PHRASE, even though it is the longest?", "choices": ["a small wooden bottle filled with morning dew", "the farmer watered his crop", "the thief crept inside", "Rama answered calmly"], "answer": 0, "explain": "The long option has no subject doing a verb, so it is a phrase."}, {"level": "Hard", "text": "'if you work hard every single day' is a…", "choices": ["clause", "phrase", "title", "word"], "answer": 0, "explain": "Subject 'you' + verb 'work' → a clause, though it cannot stand alone."}, {"level": "Hard", "text": "Which pair correctly labels these? A: 'under the old stone bridge' B: 'the children swam there'", "choices": ["A is a phrase; B is a clause", "A is a clause; B is a phrase", "Both are phrases", "Both are clauses"], "answer": 0, "explain": "A has no subject + verb (phrase); B has 'the children swam' (clause)."}, {"level": "Hard", "text": "Which one is NOT a clause?", "choices": ["hoping for a better harvest", "the fox tricked the raven", "because he was proud", "she sat by the river"], "answer": 0, "explain": "'hoping for a better harvest' has no subject + finite verb, so it is a phrase."}]}},
{"id": "english-w2-d5", "subject": "english", "week": 2, "day": 5, "title": "Day 5 · Sentence Types & Converting Them", "emoji": "📖", "blurb": "Harder conversions between statements, questions, requests and instructions.", "objective": "Convert between sentence types accurately, including trickier tenses and negative or longer sentences.", "sections": [{"type": "mascot", "text": "Final grammar stop, level two! 🔄 This week the conversions are trickier — different tenses, negatives and longer sentences. Stay careful with the verbs! 🛑"}, {"type": "text", "h": "❓ Recap of the four types", "html": "<b>Statement</b> ends with a full stop; <b>question</b> ends with a question mark; <b>request</b> politely asks (often with 'Please' or 'Could you'); <b>instruction/command</b> usually begins with the verb. This week, watch the <b>tense</b> when you convert."}, {"type": "worked", "h": "🔄 Converting with care", "html": "<i>'The farmer has watered the crop.'</i> → question: bring the helping verb 'has' to the front → <i>'Has the farmer watered the crop?'</i><br><i>'They went to the fair.'</i> → there is no helping verb, so use <b>did</b> and change 'went' back to 'go' → <i>'Did they go to the fair?'</i><br><i>'You must not touch the wires.'</i> → instruction → <i>'Do not touch the wires.'</i>"}, {"type": "example", "html": "Tense trap: 'He <b>caught</b> the ball.' → <b>NOT</b> 'Did he caught…?' but '<b>Did he catch</b> the ball?' — after 'did', the verb returns to its base form."}, {"type": "practice", "q": {"text": "Change to a QUESTION: 'The children have finished their homework.'", "choices": ["Have the children finished their homework?", "Did the children finished their homework?", "The children finished homework!", "Finish your homework."], "answer": 0, "explain": "Move the helping verb 'have' to the front and add '?'."}}, {"type": "practice", "q": {"text": "Change to a QUESTION: 'The fox stole the cheese.'", "choices": ["Did the fox steal the cheese?", "Did the fox stole the cheese?", "Stole the fox the cheese?", "The fox did steal it."], "answer": 0, "explain": "Use 'Did', and the verb returns to its base form 'steal'."}}, {"type": "mascot", "text": "That completes Unit 1, week two! 🌟 Take the final harder 10-question test (95% to earn your star) and finish English Week 2. ⭐"}], "test": {"passScore": 95, "questions": [{"level": "Medium", "text": "A sentence beginning with the verb, such as 'Close the gate.', is usually a(n)…", "choices": ["instruction (command)", "question", "request", "statement"], "answer": 0, "explain": "Commands/instructions often begin with the verb."}, {"level": "Medium", "text": "'Could you please lend me your umbrella?' is a…", "choices": ["request", "statement", "command", "exclamation"], "answer": 0, "explain": "'Could you please…' marks a polite request."}, {"level": "Medium-Hard", "text": "Change to a QUESTION: 'She has written the letter.'", "choices": ["Has she written the letter?", "Did she wrote the letter?", "She has written it!", "Write the letter."], "answer": 0, "explain": "Move 'has' to the front: Has she written the letter?"}, {"level": "Medium-Hard", "text": "Change to a QUESTION: 'They went to the temple yesterday.'", "choices": ["Did they go to the temple yesterday?", "Did they went to the temple yesterday?", "Went they to the temple?", "They did go yesterday."], "answer": 0, "explain": "Use 'Did' and change 'went' back to base form 'go'."}, {"level": "Medium-Hard", "text": "Turn into a polite REQUEST: 'Pass me the salt.'", "choices": ["Could you please pass me the salt?", "Pass me the salt now!", "You passed me the salt.", "Did you pass the salt?"], "answer": 0, "explain": "A polite request adds 'Could you please…'."}, {"level": "Medium-Hard", "text": "Change to an INSTRUCTION: 'You must not waste water.'", "choices": ["Do not waste water.", "Is water wasted?", "Water is not wasted.", "Why waste water?"], "answer": 0, "explain": "Drop the subject and form a negative command: Do not waste water."}, {"level": "Hard", "text": "Convert to a QUESTION: 'The raven dropped the cheese into the fox's mouth.'", "choices": ["Did the raven drop the cheese into the fox's mouth?", "Did the raven dropped the cheese?", "Dropped the raven the cheese?", "The raven did drop it."], "answer": 0, "explain": "Use 'Did' and return 'dropped' to its base form 'drop'."}, {"level": "Hard", "text": "Which conversion of 'He can swim well.' into a question is CORRECT?", "choices": ["Can he swim well?", "Does he can swim well?", "Did he swim well?", "Can he swims well?"], "answer": 0, "explain": "Move the modal 'can' to the front: Can he swim well?"}, {"level": "Hard", "text": "Change the statement 'The farmer waters the crop every day.' into a QUESTION.", "choices": ["Does the farmer water the crop every day?", "Do the farmer waters the crop?", "Waters the farmer the crop?", "Did the farmer waters it?"], "answer": 0, "explain": "Use 'Does' for a singular subject and base verb 'water'."}, {"level": "Hard", "text": "Which sentence is correctly turned into a polite REQUEST from 'Give me your book.'?", "choices": ["Would you please give me your book?", "Give me your book at once!", "You gave me your book.", "Have you given the book?"], "answer": 0, "explain": "'Would you please…' makes it a polite request."}]}},
{"id": "science-w2-d1", "subject": "science", "week": 2, "day": 1, "title": "Day 1 · Diversity & Types of Plants", "emoji": "🌿", "blurb": "Sharpen your eye: classify brand-new plants as herbs, shrubs or trees, and reason from stem clues.", "objective": "Classify unfamiliar plants as herbs, shrubs or trees using stem thickness, height, woodiness and lifespan, and justify the choice.", "sections": [{"type": "mascot", "text": "Welcome back to Learn Quest! 🦉 Last week you sorted easy plants. This week I will throw NEW plants at you and ask you to think harder. Ready to level up? 🌿"}, {"type": "text", "h": "🔁 Quick recap, levelled up", "html": "Remember the three stem-groups: <b>herbs</b> (small, soft green bendy stem, short-lived), <b>shrubs</b> (medium, hard woody stem branching <b>near the ground</b>, bushy) and <b>trees</b> (tall, one thick woody trunk, branches high up, live for years).<br><br>The tricky part is that <b>size alone can fool you</b>. A young mango sapling is short, but it is still a <b>tree</b> because of its woody trunk and the fact that it will grow tall and live for years. Always read <b>all</b> the clues together: stem hardness, where branches start, and lifespan."}, {"type": "worked", "h": "classify three NEW plants", "html": "<b>Brinjal (baingan):</b> waist-high, stem woody at the base but soft above, lives one season. The branching-near-ground bushy look points to a <b>shrub-like herb</b>, but because the stem stays mostly soft and it lives only a season, CBSE treats it as a <b>herb</b>. ✅<br><b>Hibiscus (gudhal):</b> medium height, hard woody stem, many branches starting near the soil, lives several years → a <b>shrub</b>. ✅<br><b>Coconut:</b> very tall, single hard trunk, branches (fronds) only at the top, lives many years → a <b>tree</b>. ✅"}, {"type": "practice", "q": {"text": "A sugarcane plant is tall but has a soft, jointed, non-woody stem and lives about a year. It is best classified as a…", "choices": ["Tree, because it is tall", "Herb, because its stem is soft and non-woody", "Shrub, because it is medium height", "Climber, because it is thin"], "answer": 1, "explain": "Height is not enough; a soft non-woody stem means herb, not tree."}}, {"type": "practice", "q": {"text": "You see a woody plant about 1.5 m tall with several hard branches all starting close to the ground, living for many years. Which clue MOST confirms it is a shrub and not a tree?", "choices": ["It is green", "Branches start near the ground instead of one tall single trunk", "It has leaves", "It grows in soil"], "answer": 1, "explain": "Shrubs branch near the base; trees have one tall single trunk."}}, {"type": "mascot", "text": "Nicely reasoned! 🌟 Now prove it on the 10-question test. You need 95% (10/10) to earn the star. ⭐"}], "test": {"passScore": 95, "questions": [{"level": "Medium", "text": "Which feature is MOST reliable for telling a tree from a tall herb like sugarcane?", "choices": ["A single thick woody trunk", "Being green in colour", "Having leaves", "Growing in soil"], "answer": 0, "explain": "A thick woody trunk marks a tree; sugarcane stays soft."}, {"level": "Medium", "text": "Banana plants are large but have a soft, juicy, non-woody 'stem'. They are therefore grouped as…", "choices": ["trees", "large herbs", "shrubs", "creepers"], "answer": 1, "explain": "No woody stem means it is a herb, despite its size."}, {"level": "Medium-Hard", "text": "Which group lists plants whose stems branch near the ground and stay woody and bushy?", "choices": ["Hibiscus, henna, lemon", "Mango, neem, coconut", "Mint, grass, wheat", "Money plant, pea, grapevine"], "answer": 0, "explain": "Hibiscus, henna and lemon are woody bushy shrubs."}, {"level": "Medium-Hard", "text": "A short young neem sapling is only knee-high. Why is it still called a tree?", "choices": ["Because it is green", "Because it has a woody trunk and will grow tall and live for years", "Because it has leaves", "Because it grows fast"], "answer": 1, "explain": "Lifespan and a woody trunk define a tree, not present height."}, {"level": "Medium-Hard", "text": "Which plant does NOT belong with the others: rose, lemon, henna, wheat?", "choices": ["rose", "lemon", "henna", "wheat"], "answer": 3, "explain": "Rose, lemon and henna are shrubs; wheat is a herb."}, {"level": "Medium-Hard", "text": "Which pair of clues together BEST identifies a herb?", "choices": ["Soft green stem and short lifespan", "Woody stem and many years", "Tall trunk and high branches", "Thin stem and needs support"], "answer": 0, "explain": "Herbs have soft green stems and are usually short-lived."}, {"level": "Hard", "text": "A papaya plant is tall with a single soft, hollow, non-woody stem and branches only at the top. The single 'trunk' may tempt you to call it a tree, but the correct group is…", "choices": ["herb", "tree", "shrub", "climber"], "answer": 0, "explain": "The stem is soft and non-woody, so it is a herb, not a tree."}, {"level": "Hard", "text": "A gardener says: 'This plant is medium-sized, woody, and bushy from the base.' Then adds it lives only one rainy season and the stem is soft. The two statements conflict; the stem evidence makes it a…", "choices": ["herb", "shrub", "tree", "creeper"], "answer": 0, "explain": "A soft, one-season stem points to a herb over a shrub."}, {"level": "Hard", "text": "Why can height alone be a misleading clue when classifying plants?", "choices": ["Because tall plants like banana and sugarcane can still have soft non-woody stems", "Because all tall plants are trees", "Because short plants are always herbs", "Because colour decides the group"], "answer": 0, "explain": "Stem woodiness, not height, separates herbs from trees."}, {"level": "Hard", "text": "Which single observation would let you rule OUT 'tree' for an unknown plant?", "choices": ["It has several woody branches starting at ground level instead of one trunk", "It is green", "It grows outdoors", "It has many leaves"], "answer": 0, "explain": "Branching at ground level fits a shrub, not a single-trunk tree."}]}},
{"id": "science-w2-d2", "subject": "science", "week": 2, "day": 2, "title": "Day 2 · Climbers, Creepers & Leaf Venation", "emoji": "🌿", "blurb": "Tell climbers from creepers in tricky cases, and use venation as a detective clue.", "objective": "Distinguish climbers from creepers by how they handle support, and connect venation patterns to plant identity.", "sections": [{"type": "mascot", "text": "Back for more! 🍃 Today the climbers and creepers get sneaky, and leaf veins become detective clues. Look closely! 🔍"}, {"type": "text", "h": "🔁 Recap with a twist", "html": "<b>Climbers</b> have weak stems but <b>climb up a support</b> using tendrils, hooks or twining. <b>Creepers</b> have weak stems that cannot climb, so they <b>spread flat on the ground</b>.<br><br>Twist: the SAME plant can sometimes do both depending on whether a support is nearby. A pumpkin given a fence may climb a little, but its natural habit is to <b>creep</b>. We classify by the plant's <b>usual habit</b>, not a one-off. Tendrils are the giveaway for true climbers like grapevine and pea."}, {"type": "text", "h": "🍃 Venation as a clue", "html": "<b>Reticulate venation</b> = veins in a <b>net</b> (mango, peepal, hibiscus, rose). <b>Parallel venation</b> = veins <b>side by side</b> (grass, wheat, maize, banana, sugarcane).<br><br>Detective rule: if you only see a leaf, the vein pattern hints at the whole plant family — we will use this in tomorrow's Big Link."}, {"type": "worked", "h": "identify the tricky cases", "html": "<b>(a)</b> A bean plant twines its whole stem around a stick to climb. No support nearby, it flops. → it climbs using support → a <b>climber</b>. ✅<br><b>(b)</b> A strawberry plant sends runners flat across the soil, rooting as it goes. → spreads on the ground → a <b>creeper</b>. ✅<br><b>(c)</b> A sugarcane leaf is long and narrow with straight veins side by side → <b>parallel venation</b> (so likely a monocot). ✅"}, {"type": "practice", "q": {"text": "A bitter gourd (karela) plant has a thin weak stem and grabs a fence with curly tendrils to grow upward. It is a…", "choices": ["Creeper, because the stem is weak", "Climber, because it uses tendrils to climb a support", "Shrub, because it is bushy", "Herb, because it is small"], "answer": 1, "explain": "Weak stem PLUS tendrils climbing a support means climber."}}, {"type": "practice", "q": {"text": "A leaf is broad with veins branching into a net. Which plant could it belong to?", "choices": ["Grass", "Wheat", "Peepal", "Maize"], "answer": 2, "explain": "Net-like veins are reticulate; peepal has reticulate venation."}}, {"type": "mascot", "text": "Sharp eyes! 🌟 Take the 10-question test now. 95% earns the star. ⭐"}], "test": {"passScore": 95, "questions": [{"level": "Medium", "text": "The TRUE test of a climber versus a creeper is whether the plant…", "choices": ["climbs up a support or spreads flat on the ground", "is green or brown", "has flowers", "grows fast"], "answer": 0, "explain": "Climbers go up a support; creepers spread on the ground."}, {"level": "Medium", "text": "Tendrils are special structures that mainly help a climber to…", "choices": ["grip a support and pull itself up", "store water", "make seeds", "spread on the ground"], "answer": 0, "explain": "Tendrils grip supports so the climber can rise."}, {"level": "Medium-Hard", "text": "A watermelon plant left in an open field spreads flat over the soil. This shows its natural habit is that of a…", "choices": ["creeper", "climber", "tree", "shrub"], "answer": 0, "explain": "Spreading flat on the ground is the creeper habit."}, {"level": "Medium-Hard", "text": "Which group shows ONLY parallel venation?", "choices": ["Banana, maize, sugarcane", "Mango, rose, hibiscus", "Peepal, mango, rose", "Hibiscus, peepal, banana"], "answer": 0, "explain": "Banana, maize and sugarcane all have parallel veins."}, {"level": "Medium-Hard", "text": "A pea plant climbs a stick using tendrils, while a sweet potato spreads on the ground. The MAIN difference is…", "choices": ["how their weak stems get off the ground", "leaf colour", "number of seeds", "flower size"], "answer": 0, "explain": "Both have weak stems; one climbs, the other creeps."}, {"level": "Medium-Hard", "text": "You find only a leaf with net-like veins. The plant most likely is one with…", "choices": ["reticulate venation, like mango or rose", "parallel venation, like grass", "no venation", "fibrous leaves"], "answer": 0, "explain": "Net-like veins mean reticulate venation."}, {"level": "Hard", "text": "A money plant on a wall climbs upward; the same plant on a bare table trails downward over the edge. Its correct group is still…", "choices": ["climber, because its habit is to climb a support when available", "creeper, because it can trail", "tree", "herb"], "answer": 0, "explain": "Its usual habit with support is climbing, so it is a climber."}, {"level": "Hard", "text": "Which statement is CORRECT?", "choices": ["Grass leaves show parallel venation and hibiscus leaves show reticulate venation", "Grass shows reticulate and hibiscus shows parallel", "Both show parallel venation", "Both show reticulate venation"], "answer": 0, "explain": "Grass is parallel; hibiscus is reticulate."}, {"level": "Hard", "text": "Why is venation a useful clue when you can see ONLY a leaf?", "choices": ["The vein pattern hints whether the plant is a monocot or a dicot", "It tells the plant's exact age", "It shows the soil type", "It reveals the flower colour"], "answer": 0, "explain": "Parallel hints monocot; reticulate hints dicot."}, {"level": "Hard", "text": "A gourd plant given no support spreads on the ground, but given a trellis it climbs with tendrils. The safest single label, by tendrils present, is…", "choices": ["climber", "creeper", "tree", "shrub"], "answer": 0, "explain": "Tendrils that grip a support are the mark of a climber."}]}},
{"id": "science-w2-d3", "subject": "science", "week": 2, "day": 3, "title": "Day 3 · Roots, Seeds & the Big Link", "emoji": "🌿", "blurb": "Chain the clues: seed type to venation to root type, forwards and backwards.", "objective": "Use the Big Link to reason between seed cotyledons, leaf venation and root type in either direction.", "sections": [{"type": "mascot", "text": "The best day! 🌱 Today you become a plant detective who can start from ANY clue and predict the rest. Let's master the Big Link. 🔗"}, {"type": "text", "h": "🔁 Recap the two chains", "html": "<b>Roots:</b> a <b>taproot</b> is one main thick root with side branches (carrot, radish, mustard, mango). <b>Fibrous roots</b> are a bunch of thin equal roots (grass, wheat, maize, onion).<br><b>Seeds:</b> a <b>dicot</b> splits into two cotyledons (gram, bean, pea, peanut); a <b>monocot</b> stays in one piece (maize, wheat, rice)."}, {"type": "tip", "html": "🔗 <b>The Big Link (memorise both lines):</b><br><b>Dicot</b> seed ↔ <b>reticulate</b> venation ↔ <b>taproot</b>.<br><b>Monocot</b> seed ↔ <b>parallel</b> venation ↔ <b>fibrous</b> roots.<br>You can travel this chain in EITHER direction: any one clue reveals the other two."}, {"type": "worked", "h": "multi-step detective work", "html": "<b>(a)</b> Clue: the plant has <b>fibrous roots</b>. Step back along the chain → fibrous means <b>monocot</b> → so its leaves show <b>parallel</b> venation and its seed has <b>one cotyledon</b> (like wheat). ✅<br><b>(b)</b> Clue: a peanut seed <b>splits into two halves</b> → <b>dicot</b> → expect <b>reticulate</b> leaves and a <b>taproot</b>. ✅<br><b>(c)</b> Clue: a leaf shows <b>net-like</b> veins → reticulate → <b>dicot</b> → <b>taproot</b>, two-cotyledon seed. ✅"}, {"type": "practice", "q": {"text": "A plant is dug up and shows many thin roots of equal size with no main root. Working the Big Link, its seed and venation are…", "choices": ["dicot seed and reticulate venation", "monocot seed and parallel venation", "dicot seed and parallel venation", "monocot seed and reticulate venation"], "answer": 1, "explain": "Fibrous roots mean monocot, which goes with parallel venation."}}, {"type": "practice", "q": {"text": "You are told ONLY that a plant has reticulate venation. Which TWO other facts follow?", "choices": ["Monocot seed and fibrous roots", "Dicot seed and taproot", "Dicot seed and fibrous roots", "Monocot seed and taproot"], "answer": 1, "explain": "Reticulate to dicot to taproot along the Big Link."}}, {"type": "mascot", "text": "You can run the chain both ways now! 🌟 Take the 10-question test. 95% earns the star. ⭐"}], "test": {"passScore": 95, "questions": [{"level": "Medium", "text": "A taproot system is best described as…", "choices": ["one main thick root with smaller side roots", "many thin roots of equal size", "roots that climb", "roots in water only"], "answer": 0, "explain": "A taproot has one main root with side branches."}, {"level": "Medium", "text": "A seed that does NOT split into halves and has one cotyledon is a…", "choices": ["monocot", "dicot", "taproot", "tricot"], "answer": 0, "explain": "One cotyledon, no split, equals monocot."}, {"level": "Medium-Hard", "text": "Maize has parallel venation. Using the Big Link, its root type is…", "choices": ["fibrous roots", "a taproot", "no roots", "climbing roots"], "answer": 0, "explain": "Parallel venation links to monocot and fibrous roots."}, {"level": "Medium-Hard", "text": "A mustard plant has a taproot. Its seed and venation should be…", "choices": ["dicot seed, reticulate venation", "monocot seed, parallel venation", "dicot seed, parallel venation", "monocot seed, reticulate venation"], "answer": 0, "explain": "Taproot links to dicot and reticulate venation."}, {"level": "Medium-Hard", "text": "Which row is INCORRECTLY matched?", "choices": ["Dicot to reticulate to taproot", "Monocot to parallel to fibrous", "Dicot to parallel to fibrous", "Monocot seed has one cotyledon"], "answer": 2, "explain": "Dicot goes with reticulate and taproot, not parallel and fibrous."}, {"level": "Medium-Hard", "text": "An onion plant has fibrous roots. Therefore its leaves most likely show…", "choices": ["parallel venation", "reticulate venation", "net venation", "no venation"], "answer": 0, "explain": "Fibrous roots mean monocot, which has parallel venation."}, {"level": "Hard", "text": "A soaked seed splits cleanly into two halves. Predict BOTH its venation and root type.", "choices": ["Reticulate venation and a taproot", "Parallel venation and fibrous roots", "Reticulate venation and fibrous roots", "Parallel venation and a taproot"], "answer": 0, "explain": "Splitting in two means dicot, so reticulate plus taproot."}, {"level": "Hard", "text": "You see ONLY a fibrous root clump. Which seed could it have grown from?", "choices": ["Wheat grain", "Gram (chana)", "Bean", "Peanut"], "answer": 0, "explain": "Fibrous roots mean monocot; wheat is the monocot seed here."}, {"level": "Hard", "text": "A leaf shows a net of veins, but a friend insists the plant has fibrous roots. The Big Link says this is…", "choices": ["impossible, because reticulate venation goes with a taproot", "correct", "true only in water", "true for all plants"], "answer": 0, "explain": "Reticulate venation pairs with dicot and taproot, not fibrous roots."}, {"level": "Hard", "text": "Starting from 'one cotyledon', the full correct chain is…", "choices": ["monocot to parallel venation to fibrous roots", "monocot to reticulate venation to taproot", "dicot to parallel venation to fibrous roots", "dicot to reticulate venation to taproot"], "answer": 0, "explain": "One cotyledon is monocot, then parallel venation, then fibrous roots."}]}},
{"id": "science-w2-d4", "subject": "science", "week": 2, "day": 4, "title": "Day 4 · Animals & Their Habitats", "emoji": "🐾", "blurb": "Match unfamiliar animals to habitats using body clues, and reason about why bodies fit homes.", "objective": "Group new animals as terrestrial, aquatic or amphibious from body features, and explain why body and habitat match.", "sections": [{"type": "mascot", "text": "Habitat day, levelled up! 🐾 This time I give you the body clues and you must work out the home. Think like a scientist! 🌊"}, {"type": "text", "h": "🔁 Recap with reasoning", "html": "A <b>habitat</b> supplies food, water, air and shelter. <b>Terrestrial</b> animals live on land, <b>aquatic</b> in water, and <b>amphibians</b> use both. The harder skill is reading the <b>body</b> to predict the home: gills and fins point to water; strong legs and lungs point to land; moist skin plus the ability to do both points to amphibian."}, {"type": "text", "h": "🐪 Same habitat, different deserts of the world", "html": "Many habitats exist on land: <b>desert, forest, grassland, mountains, polar ice</b>. An animal's tools must match its exact home. A polar bear and a camel both live on land, yet one needs warmth-trapping fur while the other needs heat-beating long legs."}, {"type": "worked", "h": "read the body, find the home", "html": "<b>(a)</b> A dolphin has a streamlined body, flippers and holds its breath underwater. Streamlined plus flippers means it lives in <b>water</b> → <b>aquatic</b> (even though it breathes air). ✅<br><b>(b)</b> A toad has moist skin, lays eggs in water but hops about on land. Both worlds → <b>amphibian</b>. ✅<br><b>(c)</b> A deer has long legs for running and lungs to breathe air on land → <b>terrestrial</b>. ✅"}, {"type": "practice", "q": {"text": "A newly seen animal has gills, a streamlined body and fins. The BEST reason to call its habitat 'water' is that…", "choices": ["it is grey", "gills let it breathe in water and fins help it swim", "it has eyes", "it lays eggs"], "answer": 1, "explain": "Gills for underwater breathing and fins for swimming both point to water."}}, {"type": "practice", "q": {"text": "A frog is called an amphibian rather than purely aquatic because it…", "choices": ["lives only in water", "can live and survive both on land and in water", "lives only on land", "flies between ponds"], "answer": 1, "explain": "Amphibians manage life in both water and on land."}}, {"type": "mascot", "text": "Great reasoning! 🌟 Take the 10-question test. 95% earns the star. ⭐"}], "test": {"passScore": 95, "questions": [{"level": "Medium", "text": "A habitat must provide an animal with food, water, air and…", "choices": ["shelter", "toys", "music", "sand"], "answer": 0, "explain": "Shelter is the fourth basic need a habitat supplies."}, {"level": "Medium", "text": "An animal with gills and fins almost certainly lives in…", "choices": ["water", "desert sand", "high mountains", "tree tops"], "answer": 0, "explain": "Gills and fins are tools for living in water."}, {"level": "Medium-Hard", "text": "A dolphin breathes air at the surface yet is called aquatic because…", "choices": ["its whole body is built to live and move in water", "it can walk on land", "it has fur", "it lays eggs on land"], "answer": 0, "explain": "A streamlined, finned body means it lives in water, so it is aquatic."}, {"level": "Medium-Hard", "text": "Which animal would you expect to be amphibious based on its body?", "choices": ["A toad with moist skin that breeds in water but hops on land", "A camel with a hump", "An eagle with wings", "A shark with gills"], "answer": 0, "explain": "Moist skin and life in both water and land mark an amphibian."}, {"level": "Medium-Hard", "text": "A polar bear and a camel are both terrestrial, yet their bodies differ because…", "choices": ["their land habitats (cold ice versus hot desert) demand different tools", "one is bigger", "one has a tail", "they eat the same food"], "answer": 0, "explain": "Different land habitats need different body features."}, {"level": "Medium-Hard", "text": "An animal has strong legs and lungs and lives in a forest. Its habitat group is…", "choices": ["terrestrial", "aquatic", "amphibian", "aerial"], "answer": 0, "explain": "Legs and lungs for land life mean terrestrial."}, {"level": "Hard", "text": "Why does reading an animal's BODY help you guess its habitat?", "choices": ["Body features are matched to the home that helps it survive", "Bodies change colour daily", "All bodies are the same", "Habitat has no effect on the body"], "answer": 0, "explain": "Bodies are suited to the habitat, so features reveal the home."}, {"level": "Hard", "text": "A creature has webbed feet, moist skin, and is found both swimming in a pond and resting on its bank. It is best grouped as…", "choices": ["amphibian", "purely aquatic", "purely terrestrial", "aerial"], "answer": 0, "explain": "Living in both water and on land defines an amphibian."}, {"level": "Hard", "text": "A fish removed from water soon struggles to breathe. The BEST explanation is that…", "choices": ["its gills are adapted to take oxygen from water, not air", "it is tired", "it dislikes land", "it cannot see"], "answer": 0, "explain": "Gills work in water; out of water the fish cannot breathe well."}, {"level": "Hard", "text": "Which single clue would most strongly RULE OUT a land (terrestrial) habitat for an unknown animal?", "choices": ["It has gills as its main breathing organ", "It has four legs", "It has eyes", "It has a tail"], "answer": 0, "explain": "Gills for breathing point to water, ruling out a land habitat."}]}},
{"id": "science-w2-d5", "subject": "science", "week": 2, "day": 5, "title": "Day 5 · Body Movements & Adaptation", "emoji": "🐾", "blurb": "Explain WHY each adaptation works and link movement to body and habitat.", "objective": "Explain how adaptations help survival and connect an animal's movement to its body and habitat with reasoning.", "sections": [{"type": "mascot", "text": "Final Science day of Week 2! 🏃 Today is all about WHY. Not just what an adaptation is, but why it helps the animal survive. 🐫🐟🌵"}, {"type": "text", "h": "🔁 Movement matches the home", "html": "Movement fits both body and habitat: legs to walk or run on land, fins to swim, wings to fly, no legs to slither, strong back legs to hop. The key idea: a body part has a <b>job</b>, and that job helps the animal <b>survive in its habitat</b>."}, {"type": "text", "h": "🐫 Why each adaptation works", "html": "<b>Camel</b> — the hump stores fat as a food and water source so it can cross the desert without eating for days; long legs lift its body away from burning sand; wide feet stop it sinking. <b>Fish</b> — a streamlined shape reduces water resistance, gills pull oxygen from water, fins steer and push. <b>Polar bear</b> — thick fur and a fat layer trap body heat in the freezing cold; white fur hides it against snow while hunting."}, {"type": "text", "h": "🌵 Plants reason too", "html": "A <b>cactus</b> has spines (not broad leaves) so it loses very little water in the dry desert, and a thick green stem stores water and makes food. The 'why' is always survival in a tough habitat."}, {"type": "worked", "h": "answer a WHY question", "html": "<b>Question:</b> Why does a fish have a streamlined body rather than a boxy one?<br><b>Think:</b> water pushes back hard on anything moving through it. A boxy body would face huge resistance and tire the fish.<br><b>Answer:</b> a streamlined body slips through water with less resistance, so the fish swims faster using less energy — a survival <b>adaptation</b> to water. ✅"}, {"type": "practice", "q": {"text": "Why does a camel have a hump rather than a flat back?", "choices": ["To look tall", "To store fat as food and water for long desert journeys", "To swim better", "To fly over sand"], "answer": 1, "explain": "The stored fat lets it survive long desert trips without food and water."}}, {"type": "practice", "q": {"text": "A polar bear's white fur helps it MOST by…", "choices": ["keeping it cool", "hiding it against the snow while it hunts", "helping it swim", "letting it fly"], "answer": 1, "explain": "White fur camouflages it in snow, aiding survival and hunting."}}, {"type": "mascot", "text": "You have finished Science Week 2! 🌟 Take the final 10-question test. 95% earns the star. ⭐"}], "test": {"passScore": 95, "questions": [{"level": "Medium", "text": "Special features that help a living thing survive in its habitat are called…", "choices": ["adaptations", "habitats", "movements", "veins"], "answer": 0, "explain": "Survival features are adaptations."}, {"level": "Medium", "text": "A snake has no legs, so it moves by…", "choices": ["crawling and slithering with body muscles", "flying", "swimming with fins", "galloping"], "answer": 0, "explain": "Legless snakes slither using their muscles."}, {"level": "Medium-Hard", "text": "Why does a fish have gills instead of lungs like a dog?", "choices": ["To take oxygen from water where it lives", "To run faster", "To fly", "To dig in sand"], "answer": 0, "explain": "Gills draw oxygen from water, suiting the fish's habitat."}, {"level": "Medium-Hard", "text": "A kangaroo has powerful back legs. The MAIN survival benefit is that it can…", "choices": ["hop quickly to travel and escape danger", "swim deep underwater", "fly over trees", "breathe in water"], "answer": 0, "explain": "Strong back legs let it hop fast to move and flee."}, {"level": "Medium-Hard", "text": "Why are a camel's legs long?", "choices": ["To lift its body away from the hot desert sand", "To help it swim", "To let it climb trees", "To help it fly"], "answer": 0, "explain": "Long legs keep the body above the burning sand."}, {"level": "Medium-Hard", "text": "A duck has webbed feet. These MOST help it to…", "choices": ["push against water and swim well", "run fast on rock", "grip tree branches", "dig tunnels"], "answer": 0, "explain": "Webbed feet act like paddles for swimming."}, {"level": "Hard", "text": "Why does a cactus have spines instead of broad leaves?", "choices": ["Broad leaves would lose too much water, so spines reduce water loss in the desert", "Spines look attractive", "Spines help it fly", "Spines store seeds"], "answer": 0, "explain": "Spines lose little water, a key desert adaptation."}, {"level": "Hard", "text": "A streamlined body helps a fish MAINLY because it…", "choices": ["reduces water resistance so the fish swims with less effort", "makes the fish colourful", "helps the fish breathe air", "keeps the fish warm"], "answer": 0, "explain": "Less resistance means faster, easier swimming."}, {"level": "Hard", "text": "A polar bear has a thick fat layer under its skin. The BEST reason is that it…", "choices": ["traps body heat to survive the freezing cold", "helps it run on sand", "lets it breathe underwater", "makes it lighter"], "answer": 0, "explain": "The fat layer insulates against extreme cold."}, {"level": "Hard", "text": "Which statement BEST captures the idea of adaptation?", "choices": ["Body features and habits are matched to help the animal survive in its habitat", "Animals choose any random feature", "All animals have the same features", "Features have nothing to do with survival"], "answer": 0, "explain": "Adaptations are features matched to survival in a habitat."}]}},
{"id": "social-w2-d1", "subject": "social", "week": 2, "day": 1, "title": "Day 1 · Maps, Their Components & the Atlas", "emoji": "🗺️", "blurb": "Deeper map reading: trickier scale sums, unit conversion and using the legend like a pro.", "objective": "Use a map scale to convert between map distance and real distance (including cm-to-km and reverse problems), and apply the three components and the atlas confidently.", "sections": [{"type": "mascot", "text": "Welcome back, explorer! 🦉 This week the scale sums get bigger and we will even work them backwards. Sharpen your pencil! 🧭"}, {"type": "text", "h": "🧩 Quick recap of the three components", "html": "Every map has <b>distance (scale)</b>, <b>direction</b> and <b>symbols (legend)</b>. The <b>scale</b> is the powerful one: it lets us turn a tiny map measurement into a real-world distance, and a real distance back into a map measurement. An <b>atlas</b> is just many maps bound into one book."}, {"type": "text", "h": "📏 Working the scale both ways", "html": "If the scale is <b>1 cm = 20 km</b>, then:<br><b>Map to real:</b> multiply the map cm by 20.<br><b>Real to map:</b> divide the real km by 20.<br>So a real distance of <b>240 km</b> would be drawn as 240 ÷ 20 = <b>12 cm</b> on the map."}, {"type": "worked", "h": "a two-step scale problem", "html": "A map has a scale of <b>1 cm = 25 km</b>. On the map, a railway line measures <b>6 cm</b> and a separate road measures <b>4 cm</b>.<br>Step 1 — railway: 6 × 25 = <b>150 km</b>.<br>Step 2 — road: 4 × 25 = <b>100 km</b>.<br>Step 3 — total real length = 150 + 100 = <b>250 km</b>. ✅"}, {"type": "worked", "h": "a backwards (real to map) problem", "html": "Two towns are <b>180 km</b> apart in real life. The map scale is <b>1 cm = 30 km</b>. How far apart are they on the map?<br>Step 1 — we go from real to map, so we <b>divide</b>.<br>Step 2 — 180 ÷ 30 = <b>6 cm</b>. ✅"}, {"type": "practice", "q": {"text": "A map scale is 1 cm = 15 km. A river is 8 cm long on the map. How long is the real river?", "choices": ["23 km", "120 km", "8 km", "60 km"], "answer": 1, "explain": "8 × 15 = 120 km."}}, {"type": "practice", "q": {"text": "Two cities are 200 km apart. On a map with scale 1 cm = 40 km, how far apart are they on the map?", "choices": ["8 cm", "40 cm", "160 cm", "5 cm"], "answer": 3, "explain": "200 ÷ 40 = 5 cm (real to map means divide)."}}, {"type": "mascot", "text": "Scale sums both ways — nice work! 🌟 Now take the 10-question test. You need 95% (10/10) to earn the star. ⭐"}], "test": {"passScore": 95, "questions": [{"level": "Medium", "text": "Which component of a map lets you convert a map distance into a real-world distance?", "choices": ["The legend", "The title", "The scale", "The border"], "answer": 2, "explain": "The scale relates map distance to real distance."}, {"level": "Medium", "text": "An atlas is best described as a…", "choices": ["book of many maps bound together", "single large wall map", "list of place names only", "globe in a box"], "answer": 0, "explain": "An atlas is a collection of maps bound into a book."}, {"level": "Medium-Hard", "text": "A map scale is 1 cm = 35 km. A road is 7 cm long on the map. The real road is…", "choices": ["42 km", "5 km", "70 km", "245 km"], "answer": 3, "explain": "7 × 35 = 245 km."}, {"level": "Medium-Hard", "text": "On a map with scale 1 cm = 60 km, two towns are 9 cm apart on paper. The real distance is…", "choices": ["69 km", "540 km", "15 km", "6 km"], "answer": 1, "explain": "9 × 60 = 540 km."}, {"level": "Medium-Hard", "text": "A real distance of 360 km must be drawn on a map with scale 1 cm = 45 km. On the map it is…", "choices": ["8 cm", "9 cm", "315 cm", "405 cm"], "answer": 0, "explain": "360 ÷ 45 = 8 cm (real to map means divide)."}, {"level": "Medium-Hard", "text": "A map scale is 1 cm = 5 km. A path measures 5 cm, and 1 km = 1000 m. The real path length in metres is…", "choices": ["2500 m", "250 m", "25000 m", "5000 m"], "answer": 2, "explain": "5 × 5 = 25 km, and 25 × 1000 = 25000 m."}, {"level": "Hard", "text": "On a map, a river is 12 cm long and the real river is 300 km. What is the map scale?", "choices": ["1 cm = 12 km", "1 cm = 25 km", "1 cm = 300 km", "1 cm = 36 km"], "answer": 1, "explain": "300 ÷ 12 = 25, so 1 cm = 25 km."}, {"level": "Hard", "text": "A map uses scale 1 cm = 50 km. A trip has two legs on the map: 3 cm then 5 cm. The total real distance is…", "choices": ["150 km", "250 km", "8 km", "400 km"], "answer": 3, "explain": "(3 + 5) × 50 = 8 × 50 = 400 km."}, {"level": "Hard", "text": "Map A has scale 1 cm = 20 km and Map B has scale 1 cm = 80 km. For the SAME real distance, which map shows it as a LONGER line?", "choices": ["Map A", "Map B", "Both the same", "Cannot be decided"], "answer": 0, "explain": "A smaller km-per-cm value spreads the same distance over more centimetres, so Map A is longer."}, {"level": "Hard", "text": "A road is 18 cm on a map with scale 1 cm = 25 km. Half of the real road is paved. How long is the paved part?", "choices": ["450 km", "9 km", "225 km", "112 km"], "answer": 2, "explain": "18 × 25 = 450 km total, and half of 450 is 225 km."}]}},
{"id": "social-w2-d2", "subject": "social", "week": 2, "day": 2, "title": "Day 2 · Types of Maps & Directions", "emoji": "🗺️", "blurb": "Sharper sorting of map types and multi-step direction reasoning with turns and bearings.", "objective": "Match maps to their type from clues, and work out directions after several turns, including opposite and intermediate directions.", "sections": [{"type": "mascot", "text": "Time to spin the compass! 🧭 This week you will make several turns and still know exactly which way you face."}, {"type": "text", "h": "🌐 Recap: the three map families", "html": "<b>Physical</b> maps show natural features (mountains, rivers, plains). <b>Political</b> maps show countries, states, capitals and boundaries. <b>Thematic</b> maps show one special theme such as rainfall, crops, roads or population."}, {"type": "text", "h": "🧭 The compass in order", "html": "Going clockwise from the top: <b>N, NE, E, SE, S, SW, W, NW</b>, then back to N. The <b>opposite</b> of any direction is straight across the circle: opposite of N is S, opposite of E is W, opposite of NE is SW, and opposite of SE is NW.<br><br>A right-angle (<b>quarter</b>) turn moves you two steps around this circle, for example from N to E."}, {"type": "worked", "h": "following several turns", "html": "You start facing <b>North</b>. You turn to face <b>East</b>, then make a quarter (90°) turn clockwise.<br>Step 1 — facing East.<br>Step 2 — a clockwise quarter turn from East goes to <b>South</b>.<br>Step 3 — so you now face <b>South</b>. ✅"}, {"type": "worked", "h": "naming an in-between direction", "html": "You walk from the school gate so that the gate ends up to your <b>South-West</b>. In which direction did you walk?<br>Step 1 — the direction you walked is the <b>opposite</b> of where the gate now sits.<br>Step 2 — the opposite of SW is <b>NE</b>.<br>Step 3 — so you walked towards the <b>North-East</b>. ✅"}, {"type": "practice", "q": {"text": "You face West, then turn a quarter (90°) turn clockwise. Which direction do you now face?", "choices": ["South", "North", "East", "West"], "answer": 1, "explain": "Clockwise from West goes to North."}}, {"type": "practice", "q": {"text": "A map of India coloured to show which crop grows in each state is a…", "choices": ["physical map", "political map", "globe", "thematic map"], "answer": 3, "explain": "It shows one theme (crops), so it is a thematic map."}}, {"type": "mascot", "text": "Directions sorted, even with turns! 🌟 Take the 10-question test now. 95% (10/10) earns the star. ⭐"}], "test": {"passScore": 95, "questions": [{"level": "Medium", "text": "A map showing the Himalayas, the Ganga and the Thar Desert is a ___ map.", "choices": ["political", "thematic", "physical", "road"], "answer": 2, "explain": "Natural features mean a physical map."}, {"level": "Medium", "text": "A map showing states, capitals and their boundaries is a ___ map.", "choices": ["political", "physical", "thematic", "weather"], "answer": 0, "explain": "Boundaries and capitals mean a political map."}, {"level": "Medium-Hard", "text": "The direction exactly opposite to North-East (NE) is…", "choices": ["North-West (NW)", "South-East (SE)", "South (S)", "South-West (SW)"], "answer": 3, "explain": "Straight across the compass from NE is SW."}, {"level": "Medium-Hard", "text": "You face South and make a quarter (90°) turn clockwise. You now face…", "choices": ["East", "West", "North", "South"], "answer": 1, "explain": "Clockwise from South goes to West."}, {"level": "Medium-Hard", "text": "You face East and turn a half (180°) turn. You now face…", "choices": ["West", "North", "South", "East"], "answer": 0, "explain": "A half turn gives the opposite direction, so East becomes West."}, {"level": "Medium-Hard", "text": "Walking towards the rising Sun, a tree is on your right. The tree is to your…", "choices": ["North", "West", "South", "East"], "answer": 2, "explain": "Facing East, your right hand points South."}, {"level": "Hard", "text": "You face North, turn 90° clockwise, then 90° clockwise again. You now face…", "choices": ["East", "South", "West", "North"], "answer": 1, "explain": "North to East, then East to South, so you face South."}, {"level": "Hard", "text": "A friend stands so that you are to her North-West. In which direction is she from you?", "choices": ["North-West", "South-West", "North-East", "South-East"], "answer": 3, "explain": "If you are NW of her, she is in the opposite direction, SE, from you."}, {"level": "Hard", "text": "You face North-East and make a quarter (90°) turn clockwise. You now face…", "choices": ["South-East", "North-West", "South-West", "East"], "answer": 0, "explain": "A clockwise quarter turn from NE lands on SE."}, {"level": "Hard", "text": "A map uses shades to show how many people live in each district. The BEST name for it is…", "choices": ["a physical map", "a political map", "a thematic (population) map", "an atlas"], "answer": 2, "explain": "It shows one theme, population, so it is a thematic map."}]}},
{"id": "social-w2-d3", "subject": "social", "week": 2, "day": 3, "title": "Day 3 · Globe, Latitudes & Hemispheres", "emoji": "🌍", "blurb": "Deeper work with latitudes: comparing distances from the Equator and reasoning about hemispheres.", "objective": "Use latitude values to compare how far places are from the Equator, identify hemispheres, and place the special parallels accurately.", "sections": [{"type": "mascot", "text": "Back to the globe! 🌍 This week we will compare latitudes and reason about which place is nearer the Equator or a pole."}, {"type": "text", "h": "↔️ Recap: latitudes", "html": "<b>Latitudes</b> run east-west in parallel circles and tell us how far <b>north or south</b> a place is. The <b>Equator</b> is <b>0°</b>, and values rise to <b>90°N</b> at the North Pole and <b>90°S</b> at the South Pole. The bigger the number, the <b>farther from the Equator</b> (and the nearer a pole)."}, {"type": "text", "h": "📐 Special parallels to remember", "html": "<b>Tropic of Cancer</b> is 23½°N, <b>Tropic of Capricorn</b> is 23½°S, the <b>Arctic Circle</b> is 66½°N and the <b>Antarctic Circle</b> is 66½°S. Anything with N is in the <b>Northern Hemisphere</b>; anything with S is in the <b>Southern Hemisphere</b>."}, {"type": "worked", "h": "comparing distance from the Equator", "html": "Which is farther from the Equator: a place at <b>55°N</b> or a place at <b>40°S</b>?<br>Step 1 — distance from the Equator depends only on the <b>number</b>, not the letter.<br>Step 2 — compare 55 and 40: 55 is bigger.<br>Step 3 — so <b>55°N</b> is farther from the Equator. ✅"}, {"type": "worked", "h": "how many degrees apart?", "html": "Place A is at <b>20°N</b> and Place B is at <b>30°S</b>. How many degrees of latitude lie between them?<br>Step 1 — they are on <b>opposite</b> sides of the Equator, so we <b>add</b>.<br>Step 2 — 20 + 30 = <b>50°</b> apart. ✅<br>(If both were on the same side, we would subtract.)"}, {"type": "practice", "q": {"text": "Which place is NEAREST to the Equator?", "choices": ["19°N", "8°S", "45°S", "60°N"], "answer": 1, "explain": "The smallest number is 8, so 8°S is nearest the Equator."}}, {"type": "practice", "q": {"text": "A place at 12°N and a place at 18°N are how many degrees apart?", "choices": ["30°", "12°", "18°", "6°"], "answer": 3, "explain": "Same side of the Equator, so subtract: 18 - 12 = 6°."}}, {"type": "mascot", "text": "Latitudes mastered, even the comparisons! 🌟 Take the 10-question test. 95% (10/10) earns the star. ⭐"}], "test": {"passScore": 95, "questions": [{"level": "Medium", "text": "Lines of latitude are also called…", "choices": ["meridians", "axes", "parallels", "poles"], "answer": 2, "explain": "Latitudes run in parallel circles, so they are called parallels."}, {"level": "Medium", "text": "A place at 60°S lies in which hemisphere?", "choices": ["Southern", "Northern", "Eastern", "Western"], "answer": 0, "explain": "The letter S means south of the Equator, so the Southern Hemisphere."}, {"level": "Medium-Hard", "text": "Which place is FARTHEST from the Equator?", "choices": ["25°S", "40°N", "10°S", "70°N"], "answer": 3, "explain": "The biggest number, 70, is farthest from the Equator."}, {"level": "Medium-Hard", "text": "The Arctic Circle lies at about…", "choices": ["23½°N", "66½°N", "23½°S", "90°N"], "answer": 1, "explain": "The Arctic Circle is at about 66½° North."}, {"level": "Medium-Hard", "text": "A place at 35°N and a place at 35°S are how far apart in latitude?", "choices": ["70°", "35°", "0°", "90°"], "answer": 0, "explain": "Opposite sides of the Equator, so add: 35 + 35 = 70°."}, {"level": "Medium-Hard", "text": "Which place is NEAREST a pole?", "choices": ["30°N", "40°N", "85°S", "15°S"], "answer": 2, "explain": "The biggest number here is 85, so 85°S is nearest a pole."}, {"level": "Hard", "text": "Place A is at 15°N and Place B is at 50°N. How many degrees of latitude separate them?", "choices": ["65°", "35°", "15°", "50°"], "answer": 1, "explain": "Same side of the Equator, so subtract: 50 - 15 = 35°."}, {"level": "Hard", "text": "The Tropic of Cancer (23½°N) and the Tropic of Capricorn (23½°S) are how far apart?", "choices": ["23½°", "0°", "90°", "47°"], "answer": 3, "explain": "Opposite sides, so add: 23½ + 23½ = 47°."}, {"level": "Hard", "text": "Of these, which pair is in the SAME hemisphere (north or south)?", "choices": ["18°N and 47°N", "18°N and 47°S", "5°S and 60°N", "0° and 30°S"], "answer": 0, "explain": "Both 18°N and 47°N carry the letter N, so both are in the Northern Hemisphere."}, {"level": "Hard", "text": "A ship sails from 10°N straight south to 25°S. Through how many degrees of latitude did it travel?", "choices": ["15°", "25°", "35°", "10°"], "answer": 2, "explain": "It crosses the Equator, so add: 10 + 25 = 35°."}]}},
{"id": "social-w2-d4", "subject": "social", "week": 2, "day": 4, "title": "Day 4 · Longitudes, Prime Meridian & Coordinates", "emoji": "🌍", "blurb": "Tougher coordinate reading, longitude differences, and matching grid addresses to places.", "objective": "Read and compare coordinates, find the gap in degrees between two longitudes, and decide the Eastern or Western hemisphere.", "sections": [{"type": "mascot", "text": "Grid-master training! 📍 This week we will measure the gaps between meridians and read full coordinates carefully."}, {"type": "text", "h": "↕️ Recap: longitudes and coordinates", "html": "<b>Longitudes (meridians)</b> run north-south from pole to pole and tell us how far <b>east or west</b> a place is. The <b>Prime Meridian</b> is <b>0°</b> (through Greenwich), and longitude rises to <b>180°E</b> and <b>180°W</b>. In coordinates we always write <b>latitude first</b> (N/S), then <b>longitude</b> (E/W)."}, {"type": "text", "h": "🌐 Eastern and Western hemispheres", "html": "The <b>Prime Meridian (0°)</b> and the <b>180° meridian</b> together split the globe into the <b>Eastern Hemisphere</b> (E longitudes) and the <b>Western Hemisphere</b> (W longitudes)."}, {"type": "worked", "h": "the gap between two longitudes", "html": "How many degrees of longitude lie between <b>20°E</b> and <b>50°E</b>?<br>Step 1 — both are East, so the same side, meaning we <b>subtract</b>.<br>Step 2 — 50 - 20 = <b>30°</b>. ✅<br>If one were East and one West, we would <b>add</b> them instead."}, {"type": "worked", "h": "reading a full coordinate", "html": "A place is given as <b>34°S, 18°E</b>.<br>Step 1 — <b>34°S</b> is the latitude: 34° south of the Equator, so the <b>Southern Hemisphere</b>.<br>Step 2 — <b>18°E</b> is the longitude: 18° east of the Prime Meridian, so the <b>Eastern Hemisphere</b>.<br>Step 3 — the place is in the Southern and Eastern hemispheres. ✅"}, {"type": "practice", "q": {"text": "How many degrees of longitude are between 40°W and 25°W?", "choices": ["65°", "15°", "40°", "25°"], "answer": 1, "explain": "Both West, so subtract: 40 - 25 = 15°."}}, {"type": "practice", "q": {"text": "In the coordinates 19°N, 73°E, which value is the longitude?", "choices": ["19°N", "19°E", "73°N", "73°E"], "answer": 3, "explain": "The E/W value, 73°E, is the longitude."}}, {"type": "mascot", "text": "You can read any grid address now! 🌟 Take the 10-question test. 95% (10/10) earns the star. ⭐"}], "test": {"passScore": 95, "questions": [{"level": "Medium", "text": "The 0° line of longitude, through Greenwich, is the…", "choices": ["Equator", "Date Line", "Prime Meridian", "Tropic of Cancer"], "answer": 2, "explain": "0° longitude is the Prime Meridian."}, {"level": "Medium", "text": "In the coordinates 28°N, 77°E, the part written first (28°N) is the…", "choices": ["latitude", "longitude", "altitude", "time zone"], "answer": 0, "explain": "Latitude (N/S) is always written first."}, {"level": "Medium-Hard", "text": "How many degrees of longitude lie between 30°E and 75°E?", "choices": ["105°", "30°", "75°", "45°"], "answer": 3, "explain": "Both East, so subtract: 75 - 30 = 45°."}, {"level": "Medium-Hard", "text": "How many degrees of longitude lie between 20°W and 35°E?", "choices": ["15°", "55°", "20°", "35°"], "answer": 1, "explain": "Opposite sides of 0°, so add: 20 + 35 = 55°."}, {"level": "Medium-Hard", "text": "A place at 45°W lies in which hemisphere?", "choices": ["Western", "Eastern", "Northern", "Southern"], "answer": 0, "explain": "The W means west of the Prime Meridian, so the Western Hemisphere."}, {"level": "Medium-Hard", "text": "Which statement about limits is CORRECT?", "choices": ["Latitude reaches 180°, longitude reaches 90°", "Both reach 360°", "Latitude reaches 90°, longitude reaches 180°", "Both reach 90°"], "answer": 2, "explain": "Latitude goes to 90° N or S, longitude to 180° E or W."}, {"level": "Hard", "text": "A place is at 40°N, 74°W. Which two hemispheres is it in?", "choices": ["Northern and Eastern", "Northern and Western", "Southern and Western", "Southern and Eastern"], "answer": 1, "explain": "40°N is Northern and 74°W is Western."}, {"level": "Hard", "text": "Two meridians are 60° apart. One is 25°E. If the other is farther east, it is at…", "choices": ["35°E", "60°E", "85°W", "85°E"], "answer": 3, "explain": "Farther east means add: 25 + 60 = 85°E."}, {"level": "Hard", "text": "City P is at 10°E and City Q is at 50°W. How many degrees of longitude separate them?", "choices": ["60°", "40°", "50°", "10°"], "answer": 0, "explain": "Opposite sides of 0°, so add: 10 + 50 = 60°."}, {"level": "Hard", "text": "Why does the pair 12°N, 12°E point to ONE exact place, while 12°N alone does not?", "choices": ["12°N is a country and 12°E is a city", "Latitude is for sea and longitude for land", "12°N alone is a whole circle; the longitude crosses it at one point", "Two numbers always mean a city"], "answer": 2, "explain": "A single latitude is a full line; adding the longitude crosses it at one spot."}]}},
{"id": "social-w2-d5", "subject": "social", "week": 2, "day": 5, "title": "Day 5 · Time Zones, GMT & the Date Line", "emoji": "🕐", "blurb": "Multi-step time-zone sums with 15° = 1 hour, comparing east and west places, and the Date Line.", "objective": "Calculate time differences from longitude using 15° = 1 hour, decide ahead or behind for east and west, and explain the International Date Line.", "sections": [{"type": "mascot", "text": "Clocks around the world! 🕐 This week we add and subtract hours across longitudes. Remember: east is ahead, west is behind."}, {"type": "text", "h": "🕐 Recap: 15° equals one hour", "html": "The Earth turns <b>360° in 24 hours</b>, so <b>15° of longitude = 1 hour</b>. To find the hours between two longitudes, find the degree gap and <b>divide by 15</b>. Places to the <b>east</b> are <b>ahead</b> (their clocks read later); places to the <b>west</b> are <b>behind</b> (earlier)."}, {"type": "text", "h": "🇬🇧 GMT and the Date Line", "html": "<b>GMT</b> is the time at the <b>Prime Meridian (0°)</b> and the world uses it as a reference. The <b>International Date Line</b> runs roughly along <b>180°</b>; crossing it changes the calendar date by one day."}, {"type": "worked", "h": "east of GMT, in hours", "html": "A place is at <b>75°E</b>. How far ahead of GMT is it?<br>Step 1 — gap from 0° is 75°.<br>Step 2 — 75 ÷ 15 = <b>5 hours</b>.<br>Step 3 — it is east, so it is <b>5 hours AHEAD</b> of GMT. ✅"}, {"type": "worked", "h": "the gap between two cities", "html": "City A is at <b>30°E</b> and City B is at <b>15°W</b>. What is the time difference between them?<br>Step 1 — they are on opposite sides of 0°, so add the degrees: 30 + 15 = <b>45°</b>.<br>Step 2 — 45 ÷ 15 = <b>3 hours</b>.<br>Step 3 — City A is farther east, so City A is <b>3 hours ahead</b> of City B. ✅"}, {"type": "practice", "q": {"text": "A place is at 90°E. How many hours ahead of GMT is it?", "choices": ["9 hours", "6 hours", "90 hours", "4 hours"], "answer": 1, "explain": "90 ÷
