<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Learn Quest — Grade 6</title>
<style>
  :root{
    --bg:#f4f7ff; --card:#ffffff; --ink:#27314d; --muted:#6b779a; --line:#e6ebf7;
    --brand:#5b6cff; --brand2:#8a5bff;
    --maths:#ff7a59; --english:#3ec1d3; --science:#37c978; --social:#ffb23e; --hindi:#ff5d8f;
    --good:#37c978; --bad:#ff5d6c; --star:#ffc83d;
  }
  *{box-sizing:border-box}
  body{margin:0;font-family:'Trebuchet MS',system-ui,-apple-system,"Segoe UI",sans-serif;background:var(--bg);color:var(--ink)}
  .wrap{max-width:980px;margin:0 auto;padding:16px}
  a{color:inherit}
  button{font-family:inherit;cursor:pointer;border:none}

  /* top bar */
  .top{display:flex;align-items:center;gap:12px;justify-content:space-between;
    background:linear-gradient(120deg,var(--brand),var(--brand2));color:#fff;border-radius:18px;padding:16px 20px;margin-bottom:18px}
  .top h1{margin:0;font-size:1.4rem;display:flex;align-items:center;gap:8px}
  .top .who{display:flex;align-items:center;gap:8px;font-size:.95rem}
  .top .who input{border:none;border-radius:8px;padding:6px 10px;font-family:inherit;font-size:.95rem;max-width:130px}
  .pill{background:rgba(255,255,255,.22);border-radius:20px;padding:6px 12px;font-weight:bold;font-size:.85rem}

  /* stat row */
  .stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px;margin-bottom:18px}
  .stat{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:14px 16px;text-align:center}
  .stat .big{font-size:1.6rem;font-weight:800}
  .stat .lbl{color:var(--muted);font-size:.8rem;text-transform:uppercase;letter-spacing:1px}

  /* week tabs */
  .weeks{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:16px}
  .weektab{background:var(--card);border:1px solid var(--line);border-radius:20px;padding:8px 16px;font-weight:bold;color:var(--muted)}
  .weektab.active{background:var(--ink);color:#fff;border-color:var(--ink)}

  /* subject group */
  .subjhead{display:flex;align-items:center;gap:10px;margin:18px 0 10px;font-size:1.1rem;font-weight:800}
  .subjdot{width:14px;height:14px;border-radius:50%}
  .lessons{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:14px}
  .lesson{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:16px;display:flex;flex-direction:column;gap:8px;transition:transform .08s,box-shadow .12s}
  .lesson:hover{transform:translateY(-2px);box-shadow:0 8px 22px rgba(91,108,255,.12)}
  .lesson .emoji{font-size:1.8rem}
  .lesson h3{margin:0;font-size:1.05rem}
  .lesson .meta{color:var(--muted);font-size:.82rem;flex:1}
  .lesson .row{display:flex;align-items:center;justify-content:space-between;gap:8px}
  .badge{font-size:.74rem;font-weight:bold;padding:4px 9px;border-radius:20px}
  .b-new{background:#eef1ff;color:var(--brand)}
  .b-prog{background:#fff3e0;color:#d98600}
  .b-master{background:#e7f9ef;color:var(--good)}
  .b-soon{background:#f0f1f5;color:var(--muted)}
  .lvl{font-size:.66rem;font-weight:bold;padding:2px 9px;border-radius:20px;margin-left:8px;vertical-align:middle;white-space:nowrap}
  .lvl-med{background:#e7f9ef;color:#1f8a4c}
  .lvl-mh{background:#fff3e0;color:#d98600}
  .lvl-hard{background:#ffe1e6;color:#d12f49}
  .go{background:var(--brand);color:#fff;border-radius:10px;padding:8px 12px;font-weight:bold;font-size:.85rem}
  .go.soon{background:#e8eaf2;color:var(--muted);cursor:not-allowed}
  .prog{height:8px;background:#eef1f8;border-radius:6px;overflow:hidden}
  .prog>i{display:block;height:100%;background:var(--good)}

  .btn{background:var(--brand);color:#fff;border-radius:10px;padding:10px 16px;font-weight:bold}
  .btn.ghost{background:#eef1ff;color:var(--brand)}
  .btn.alt{background:var(--ink)}
  .btn.big{font-size:1.05rem;padding:13px 22px}
  .btnrow{display:flex;gap:10px;flex-wrap:wrap}

  /* lesson view */
  .card{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:22px;margin-bottom:16px}
  .crumbs{color:var(--muted);font-size:.85rem;margin-bottom:8px;cursor:pointer}
  .lessontitle{display:flex;align-items:center;gap:12px;margin:0 0 4px;font-size:1.5rem}
  .objective{background:#eef1ff;border-radius:12px;padding:12px 14px;color:#41507f;margin:12px 0}
  .sec{margin:18px 0}
  .sec h4{margin:0 0 6px;font-size:1.1rem;display:flex;align-items:center;gap:8px}
  .sec p{margin:6px 0}
  .example{background:#fff8f3;border-left:4px solid var(--maths);border-radius:10px;padding:12px 14px}
  .tip{background:#e7f9ef;border-left:4px solid var(--good);border-radius:10px;padding:12px 14px}
  .worked{background:#eef3ff;border-left:4px solid var(--brand);border-radius:10px;padding:12px 14px}
  .worked-h{font-weight:800;color:var(--brand);margin-bottom:6px}
  .sec p{margin:8px 0;line-height:1.6}
  .mascot{display:flex;gap:10px;align-items:flex-start;background:#f3f0ff;border-radius:12px;padding:12px 14px}
  .mascot .face{font-size:1.6rem}
  kbd{background:#eef1f8;border-radius:6px;padding:2px 7px;font-family:inherit;font-weight:bold}

  /* fraction widget */
  .fracwidget{text-align:center;background:#fbfcff;border:1px dashed var(--line);border-radius:14px;padding:16px}
  .bar{display:flex;gap:4px;justify-content:center;margin:12px 0;flex-wrap:wrap}
  .seg{width:42px;height:48px;border-radius:8px;background:#eceffb;border:2px solid #d8def1;cursor:pointer;transition:.1s}
  .seg.on{background:var(--maths);border-color:#e85c36}
  .fracval{font-size:2rem;font-weight:800;color:var(--maths)}
  .ctrls{display:flex;gap:8px;justify-content:center;align-items:center;margin-top:8px}
  .ctrls button{background:var(--ink);color:#fff;border-radius:8px;width:34px;height:34px;font-size:1.1rem;font-weight:bold}

  /* quiz */
  .q{border:1px solid var(--line);border-radius:14px;padding:14px 16px;margin:12px 0;background:#fff}
  .q .qtext{font-weight:bold;margin-bottom:10px}
  .choices{display:flex;flex-direction:column;gap:8px}
  .choice{display:flex;align-items:center;gap:10px;border:2px solid var(--line);border-radius:10px;padding:10px 12px;cursor:pointer;transition:.1s;background:#fff}
  .choice:hover{border-color:var(--brand)}
  .choice.sel{border-color:var(--brand);background:#eef1ff}
  .choice.correct{border-color:var(--good);background:#e7f9ef}
  .choice.wrong{border-color:var(--bad);background:#ffeef0}
  .choice .key{width:26px;height:26px;border-radius:50%;background:#eef1f8;display:flex;align-items:center;justify-content:center;font-weight:bold;flex:0 0 auto}
  .feedback{margin-top:8px;font-size:.9rem;padding:8px 10px;border-radius:8px}
  .feedback.ok{background:#e7f9ef;color:#1f8a4c}
  .feedback.no{background:#ffeef0;color:#c0354a}

  /* result */
  .result{text-align:center;padding:8px}
  .scoreRing{font-size:3rem;font-weight:800}
  .stars{font-size:1.8rem;letter-spacing:4px}

  /* modal */
  .modal{position:fixed;inset:0;background:rgba(20,26,48,.55);display:flex;align-items:center;justify-content:center;padding:16px;z-index:50}
  .modal .box{background:#fff;border-radius:18px;max-width:680px;width:100%;max-height:88vh;overflow:auto;padding:22px}
  .repline{display:flex;justify-content:space-between;gap:10px;padding:8px 0;border-bottom:1px dashed var(--line);font-size:.92rem}
  .repsub{font-weight:800;margin:14px 0 4px}
  .x{float:right;background:#eef1f8;border-radius:8px;padding:6px 10px;font-weight:bold;color:var(--muted)}
  .hide{display:none}
  .center{text-align:center}
  .muted{color:var(--muted)}
  .confetti{position:fixed;top:-10px;font-size:1.4rem;animation:fall 2.2s linear forwards;z-index:60}
  @keyframes fall{to{transform:translateY(105vh) rotate(360deg);opacity:.9}}
</style>
</head>
<body>
<div class="wrap" id="app"></div>

const CURRICULUM = { lessons: [

/* ---------- FULL SAMPLE LESSON: MATHS · FRACTIONS (Week 1) ---------- */
/* ===== MATHS · Fractions — 5 day-sessions ===== */
{
  id:'maths-d1', subject:'maths', week:1, day:1, title:'Day 1 · What is a Fraction?', emoji:'🍕',
  blurb:'The meaning of a fraction, numerator & denominator, fractions of a collection, number line.',
  objective:"Understand what a fraction means, name the numerator and denominator, read fractions, find a fraction of a group of objects, and place fractions on a number line.",
  sections:[
    {type:'mascot', text:"Hi! I'm <b>Hooty</b> the owl 🦉. Let's start fractions from the very beginning — with pizzas, chocolate and marbles. Tap things as we go!"},
    {type:'text', h:'🍕 A fraction = an equal part of a whole', html:"Imagine one whole pizza. If we cut it into <b>4 EQUAL slices</b> and take <b>3</b> of them, we have eaten <b>three-fourths</b> of the pizza, written <b>3/4</b>.<br><br>A <b>fraction</b> is a number that names <b>part of a whole</b> when the whole is split into <b>equal</b> parts. The word 'equal' is very important — if the slices are different sizes, we cannot call them a fair fraction!"},
    {type:'frac'},
    {type:'text', h:'🔢 The two numbers of a fraction', html:"Every fraction has two numbers, one above the other:<br><b>Numerator</b> (the TOP number) — how many equal parts we are talking about.<br><b>Denominator</b> (the BOTTOM number) — how many equal parts the whole is divided into.<br><br>In <kbd>3/4</kbd>: the numerator is <b>3</b> and the denominator is <b>4</b>. We read it as 'three-fourths' or 'three by four'.<br><br>💡 Memory hook: <b>D</b>enominator = <b>D</b>own; it tells the total number of pieces."},
    {type:'text', h:'🍬 Fractions of a collection', html:"A fraction can also describe part of a <b>group</b> of things, not just one object. To find <b>1/3 of 12 marbles</b>, split the 12 marbles into <b>3 equal groups</b> (4 in each group) and take <b>1 group</b> → <b>4 marbles</b>.<br>So the denominator tells you <i>how many equal groups</i> to make, and the numerator tells you <i>how many groups</i> to take."},
    {type:'text', h:'📏 Fractions on a number line', html:"Fractions are real numbers that sit <b>between the whole numbers</b>. To show fourths between 0 and 1, divide that gap into <b>4 equal steps</b>. The marks are then 1/4, 2/4, 3/4, and 4/4 (which is 1)."},
    {type:'worked', h:'two quick problems', html:"<b>(a) Show 3/8.</b> Step 1 — the denominator is 8, so draw a shape with <b>8 equal parts</b>. Step 2 — the numerator is 3, so <b>shade 3</b> parts. The shaded amount is 3/8. ✅<br><br><b>(b) Find 1/4 of 12 sweets.</b> Step 1 — denominator 4 → make <b>4 equal groups</b> from 12 (that's 3 in each). Step 2 — numerator 1 → take <b>1 group</b> = <b>3 sweets</b>. ✅"},
    {type:'practice', q:{text:"A chocolate bar has 5 equal pieces and you eat 2. What fraction did you eat?", choices:["5/2","2/5","2/3","1/5"], answer:1, explain:"2 pieces out of 5 equal pieces = 2/5."}},
    {type:'practice', q:{text:"What is 2/3 of 9 pencils?", choices:["3","6","9","2"], answer:1, explain:"Make 3 equal groups of 9 (3 each); take 2 groups = 6 pencils."}},
    {type:'mascot', text:"Great start! 🌟 Take today's 10-question test (you need <b>95%</b> = 10/10) and earn your star. ⭐"},
  ],
  test:{ passScore:95, questions:[
    {level:'Medium', text:"A fraction names a ___ of a whole that has been split into equal parts.", choices:["part","colour","name","price"], answer:0, explain:"A fraction is a part of a whole."},
    {level:'Medium', text:"For a fraction to be fair, the parts of the whole must be…", choices:["equal in size","different colours","very big","numbered"], answer:0, explain:"The parts must be equal."},
    {level:'Medium', text:"In 3/4, the bottom number (4) is the…", choices:["denominator","numerator","whole","remainder"], answer:0, explain:"The bottom number is the denominator (total equal parts)."},
    {level:'Medium', text:"In 3/4, the top number (3) is the…", choices:["numerator","denominator","divisor","decimal"], answer:0, explain:"The top number is the numerator."},
    {level:'Medium', text:"'Three-fifths' written as a fraction is…", choices:["3/5","5/3","3/8","2/5"], answer:0, explain:"Three-fifths = 3/5."},
    {level:'Medium', text:"A pizza is cut into 8 equal slices and you take 5. What fraction did you take?", choices:["5/8","8/5","3/8","5/3"], answer:0, explain:"5 of 8 equal parts = 5/8."},
    {level:'Medium-Hard', text:"What is 1/4 of 12 marbles?", choices:["3","4","6","8"], answer:0, explain:"Split 12 into 4 equal groups (3 each); take 1 group = 3."},
    {level:'Medium-Hard', text:"What is 2/3 of 9 sweets?", choices:["6","3","9","5"], answer:0, explain:"Make 3 groups of 9 (3 each); take 2 groups = 6."},
    {level:'Medium-Hard', text:"On a number line from 0 to 1 split into 5 equal steps, the 2nd mark stands for…", choices:["2/5","5/2","1/5","2/10"], answer:0, explain:"The 2nd of 5 equal steps from 0 = 2/5."},
    {level:'Hard', text:"A box has 20 chocolates. 3/4 of them are dark. How many dark chocolates are there?", choices:["15","5","12","16"], answer:0, explain:"3/4 of 20 = (20÷4)×3 = 5×3 = 15."},
  ]},
},
{
  id:'maths-d2', subject:'maths', week:1, day:2, title:'Day 2 · Proper, Improper & Mixed Fractions', emoji:'🍕',
  blurb:'The three types of fractions and how to convert improper ↔ mixed.',
  objective:"Tell proper, improper and mixed fractions apart, and convert an improper fraction to a mixed number and back.",
  sections:[
    {type:'mascot', text:"Welcome back! 🦉 Today we sort fractions into three families and learn to switch between two of them. 🔄"},
    {type:'text', h:'📏 The three types', html:"<b>Proper fraction</b> — the top is <b>smaller</b> than the bottom (e.g. 3/8). It is <b>less than one whole</b>.<br><b>Improper fraction</b> — the top is <b>equal to or bigger</b> than the bottom (e.g. 9/4, 5/5). It is <b>one whole or more</b>.<br><b>Mixed number</b> — a <b>whole number plus a proper fraction</b> together (e.g. 2¼)."},
    {type:'text', h:'🍕 Why improper and mixed are the SAME amount', html:"Picture 9 quarter-slices of pizza (9/4). Four quarters make one whole pizza, so 8 quarters make 2 whole pizzas, and 1 quarter is left over. That is <b>2 whole pizzas and 1/4</b> = <b>2¼</b>. So <b>9/4 = 2¼</b> — two ways of writing the same amount!"},
    {type:'worked', h:'converting both ways', html:"<b>Improper → Mixed (7/3):</b> Divide the top by the bottom. 7 ÷ 3 = <b>2 remainder 1</b>. The quotient 2 is the whole number, the remainder 1 is the new top, the bottom stays 3 → <b>2 1/3</b>. ✅<br><br><b>Mixed → Improper (2¼):</b> Multiply the whole number by the bottom and add the top. (2 × 4) + 1 = <b>9</b>; keep the bottom 4 → <b>9/4</b>. ✅"},
    {type:'practice', q:{text:"Which of these is an improper fraction?", choices:["3/7","2/5","9/4","1/2"], answer:2, explain:"9/4 has a top bigger than its bottom → improper."}},
    {type:'practice', q:{text:"Write 2¼ as an improper fraction.", choices:["6/4","9/4","8/4","9/2"], answer:1, explain:"(2×4)+1 = 9 over 4 → 9/4."}},
    {type:'mascot', text:"You can sort and convert now! 🌟 Take the 10-question test (95% to earn your star). ⭐"},
  ],
  test:{ passScore:95, questions:[
    {level:'Medium', text:"In a PROPER fraction, the top is ___ the bottom.", choices:["smaller than","bigger than","equal to","double"], answer:0, explain:"Proper = top smaller than bottom (less than 1 whole)."},
    {level:'Medium', text:"Which one is a PROPER fraction?", choices:["3/8","9/4","5/5","7/2"], answer:0, explain:"Only 3/8 has top < bottom."},
    {level:'Medium', text:"Which one is an IMPROPER fraction?", choices:["2/5","9/4","3/7","1/2"], answer:1, explain:"9/4 has top ≥ bottom → improper."},
    {level:'Medium', text:"5/5 is equal to…", choices:["1","0","5","½"], answer:0, explain:"Top = bottom → one whole = 1."},
    {level:'Medium', text:"An improper fraction is always…", choices:["one whole or more","less than one whole","a whole number","negative"], answer:0, explain:"Improper fractions equal 1 or more."},
    {level:'Medium', text:"A mixed number is made of a whole number plus a…", choices:["proper fraction","improper fraction","decimal","remainder"], answer:0, explain:"Mixed = whole number + proper fraction."},
    {level:'Medium-Hard', text:"Write 2¼ as an improper fraction.", choices:["9/4","8/4","6/4","9/2"], answer:0, explain:"(2×4)+1 = 9 → 9/4."},
    {level:'Medium-Hard', text:"Write 7/3 as a mixed number.", choices:["2 1/3","1 1/3","3 1/2","2 2/3"], answer:0, explain:"7 ÷ 3 = 2 r 1 → 2 1/3."},
    {level:'Hard', text:"Write 17/5 as a mixed number.", choices:["3 2/5","2 2/5","3 3/5","4 2/5"], answer:0, explain:"17 ÷ 5 = 3 r 2 → 3 2/5."},
    {level:'Hard', text:"Write 3¾ as an improper fraction.", choices:["15/4","13/4","12/4","7/4"], answer:0, explain:"(3×4)+3 = 15 → 15/4."},
  ]},
},
{
  id:'maths-d3', subject:'maths', week:1, day:3, title:'Day 3 · Equivalent Fractions & Simplifying', emoji:'🍕',
  blurb:'Fractions that look different but are equal, and reducing to simplest form.',
  objective:"Make equivalent fractions by multiplying/dividing, reduce a fraction to its simplest form, and check whether two fractions are equal.",
  sections:[
    {type:'mascot', text:"Did you know one amount can be written many ways? 🤔 Let's discover equivalent fractions. 🟰"},
    {type:'text', h:'🟰 What equivalent means', html:"<b>Equivalent fractions</b> are fractions that look different but stand for <b>exactly the same amount</b>.<br><br>Think of a chocolate bar: half of it can be shown as <b>1/2</b>, or you can score it into more pieces and call it <b>2/4</b>, <b>3/6</b> or <b>4/8</b> — it is still the same amount of chocolate! So <kbd>1/2 = 2/4 = 3/6 = 4/8</kbd>."},
    {type:'text', h:'✖️ Making equivalent fractions', html:"To make an equivalent fraction, <b>multiply (or divide) the top AND the bottom by the same number</b>. You must do the same thing to both — that keeps the value unchanged.<br>Example: 2/3 = (2×2)/(3×2) = <b>4/6</b> = (2×4)/(3×4) = <b>8/12</b>."},
    {type:'text', h:'➗ Simplifying to lowest terms', html:"To <b>simplify</b> (or reduce) a fraction, <b>divide</b> the top and bottom by a common factor until no number (except 1) divides both. The result is the <b>simplest form</b>.<br>Example: 6/8 → divide both by 2 → <b>3/4</b>. Nothing else divides 3 and 4, so 3/4 is simplest."},
    {type:'worked', h:'make, simplify & check', html:"<b>Make:</b> 2/3 = ?/12. The bottom went 3 → 12, that's ×4, so do ×4 on top too: 2×4 = 8 → <b>8/12</b>. ✅<br><br><b>Simplify:</b> 18/24. The biggest number dividing both is 6. 18÷6 = 3, 24÷6 = 4 → <b>3/4</b>. ✅<br><br><b>Check if equal:</b> Is 2/3 = 6/9? Cross-multiply: 2×9 = 18 and 3×6 = 18. They match → <b>yes, equal</b>. ✅"},
    {type:'practice', q:{text:"Which fraction is equivalent to 2/3?", choices:["3/4","4/6","2/6","5/6"], answer:1, explain:"Multiply top & bottom by 2 → 4/6."}},

  test:{ passScore:95, questions:[

    {level:'Medium', text:"Which is equivalent to 3/4?", choices:["6/8","4/6","2/3","5/8"], answer:0, explain:"×2 on both → 6/8."},
    {level:'Medium', text:"Simplify 6/8 to lowest terms.", choices:["3/4","2/4","6/8","1/2"], answer:0, explain:"Divide both by 2 → 3/4."},
    {level:'Medium', text:"4/5 = ?/20", choices:["16/20","8/20","12/20","5/20"], answer:0, explain:"×4 on both → 16/20."},

{

    {type:'text', h:'⚖️ Three easy cases', html:"<b>Same bottom (denominator):</b> the bigger top wins. 7/9 &gt; 5/9 (more ninths).<br><b>Same top (numerator):</b> the bigger bottom means <b>smaller</b> pieces, so it is the smaller fraction. 1/3 &gt; 1/4 (thirds are bigger pieces than quarters)."},
    {type:'text', h:'🔁 Different tops AND bottoms', html:"When both numbers differ, make the comparison fair in one of two ways:<br><b>1) Common denominator:</b> rewrite both with the same bottom (use the LCM), then compare tops.<br><b>2) Cross-multiply:</b> multiply each top by the other bottom and compare the two products."},
    {type:'worked', h:'compare and order', html:"<b>Compare 2/3 and 3/4.</b> LCM of 3 and 4 is 12. 2/3 = 8/12 and 3/4 = 9/12. Since 8 &lt; 9, <b>2/3 &lt; 3/4</b>. (Cross-multiply check: 2×4 = 8, 3×3 = 9 → same answer.) ✅<br><br><b>Order 1/2, 3/4, 2/3 from small to big.</b> Use twelfths: 1/2 = 6/12, 2/3 = 8/12, 3/4 = 9/12 → order is <b>1/2, 2/3, 3/4</b>. ✅"},

  id:'english-d1', subject:'english', week:1, day:1, title:'Day 1 · Fables, Folk Tales & "A Bottle of Dew"', emoji:'📖',
  blurb:'What fables & folk tales are, finding the moral, and the story "A Bottle of Dew".',
  objective:"Understand what fables and folk tales are, learn how to find a story's moral, and read and understand 'A Bottle of Dew' from Poorvi Unit 1.",
  sections:[
    {type:'mascot', text:"Hello reader! 🦉 I'm Hooty. Unit 1 is full of wise old stories. Before we read them, let's understand <b>what kind of stories</b> they are — and the secret 'lesson' hidden inside every one. 📖✨"},
    {type:'text', h:'📖 What exactly is a fable?', html:"A <b>fable</b> is a <b>very short story</b> whose characters are usually <b>animals (or even objects) that talk and behave like people</b>. Because the story is short and simple, the <b>lesson</b> it teaches stands out very clearly. That lesson is called the <b>moral</b>.<br><br>Fables are extremely old. Many famous ones come from <b>Aesop</b> (an ancient Greek storyteller) and from India's own <b>Panchatantra</b> — collections written down thousands of years ago to teach wisdom to children."},
    {type:'text', h:'🗣️ And what is a folk tale?', html:"A <b>folk tale</b> is a <b>traditional story</b> that ordinary people told <b>aloud</b>, passing it from grandparents to parents to children, long <i>before</i> it was ever written in a book. Folk tales belong to the <b>culture</b> of a place. They often celebrate <b>cleverness, kindness and hard work</b>, and they carry the values of the people who told them."},
    {type:'example', html:"Both fables and folk tales teach us something. The difference is mainly <i>how</i> they travel: a <b>fable</b> is a short tale built around one clear moral (often with animals), while a <b>folk tale</b> is a community's story handed down <b>by word of mouth</b> over many years."},
    {type:'text', h:'🎯 How to find the MORAL of a story', html:"The <b>moral</b> is the wise message you carry home. To find it, ask yourself two questions:<br>1) <b>What lesson did the main character learn?</b><br>2) <b>What is the story trying to teach me about life?</b><br>The answer, said in one sentence, is the moral."},
    {type:'practice', q:{text:"The wise lesson hidden inside a fable is called its…", choices:["Moral","Title","Author","Cover"], answer:0, explain:"The life-lesson of a fable or folk tale is its moral."}},

    {type:'text', h:'🍌 The story: "A Bottle of Dew"', html:"A young man named <b>Rama Natha</b> is clever but <b>lazy</b> — he dreams of becoming rich <b>without working</b>. He becomes sure that a single <b>magic 'bottle of dew'</b> will solve everything. His <b>wise father</b> worries about his son's habits, so he gently <b>guides him through a trick</b>: he convinces Rama Natha that the magic will only work if he <b>grows a special crop and waters it daily</b>. To do this, Rama Natha has to <b>work hard in the fields every single day</b>."},
    {type:'text', h:'🌅 What happens — and the lesson', html:"Day after day of honest <b>hard work</b> slowly makes the farm <b>prosper</b> (grow rich). In the end Rama Natha realises the truth: there was never any real magic — the <b>hard work itself</b> was the magic that made him successful.<br><br>👉 <b>Moral:</b> <i>Hard work is more valuable than magic. There is no shortcut to success.</i>"},
    {type:'text', h:'📝 New words to know', html:"<b>dew</b> — tiny drops of water that settle on plants in the early morning.<br><b>lazy</b> — not wanting to work or make an effort.<br><b>prosper</b> — to become successful or wealthy.<br><b>patience</b> — calmly waiting and continuing without giving up."},
    {type:'practice', q:{text:"At first, what does Rama Natha believe will make him rich?", choices:["A magic bottle of dew","Hard work in the fields","His father's money","A lucky coin"], answer:0, explain:"He lazily hopes a magic bottle of dew will make him rich without effort."}},
    {type:'mascot', text:"You've met your first folk tale! 🌟 Take today's 10-question test (you need <b>95%</b> — that's 10/10) and earn your star. ⭐"},
  ],

    {type:'text', h:'🧀 The story: "The Raven and the Fox"', html:"A <b>raven</b> finds a tasty piece of <b>cheese</b> and flies up to a branch to enjoy it. A hungry <b>fox</b> spots the cheese and wants it — but it is too high to reach. So the clever fox uses a trick called <b>flattery</b> (false praise). He loudly admires the raven's beauty and begs to hear its 'wonderful, sweet voice'."},
    {type:'text', h:'🪶 The proud mistake — and the lesson', html:"The <b>proud</b> raven is so pleased by the praise that it opens its beak to <b>caw</b> — and the cheese drops straight into the fox's waiting mouth! The vain raven loses its meal.<br><br>👉 <b>Moral:</b> <i>Do not be fooled by flattery; pride can make you careless.</i><br><br><b>Characters:</b> the <b>fox</b> is <i>cunning/clever</i>; the <b>raven</b> is <i>proud and foolish</i>."},
    {type:'practice', q:{text:"How does the fox get the cheese from the raven?", choices:["By flattering it until it opens its beak","By climbing the tree","By scaring it away","By buying it"], answer:0, explain:"The fox uses flattery (false praise) so the proud raven sings and drops the cheese."}},

    {type:'text', h:'🛡️ The story: "Rama to the Rescue"', html:"One night a <b>thief</b> sneaks into the home of <b>Rama and his wife</b>. Instead of panicking, the quick-thinking couple keep their <b>presence of mind</b>. Using <b>clever thinking and courage</b>, they cleverly outwit the thief and protect their home and belongings."},
    {type:'text', h:'💡 The lesson', html:"👉 <b>Moral:</b> <i>Cleverness, courage and presence of mind can save us from danger.</i> You do not always need strength — a calm, clever mind can be your best protection."},
    {type:'text', h:'📝 New words to know', html:"<b>flattery</b> — false or excessive praise used to fool someone.<br><b>vain / proud</b> — having too high an opinion of oneself.<br><b>cunning</b> — clever in a sly, tricky way.<br><b>courage</b> — bravery; facing danger without giving in to fear.<br><b>presence of mind</b> — staying calm and thinking quickly in a difficult moment."},
    {type:'practice', q:{text:"In 'Rama to the Rescue', how do Rama and his wife defeat the danger?", choices:["With clever thinking and courage","By running far away","By giving the thief money","By shouting only"], answer:0, explain:"They use cleverness, courage and presence of mind to outwit the thief."}},

  id:'english-d3', subject:'english', week:1, day:3, title:'Day 3 · Subject & Predicate', emoji:'📖',
  blurb:'The two parts of every sentence, and how to find each one.',
  objective:"Identify the subject (naming part) and predicate (telling part) of a sentence, and use the verb to locate the predicate.",
  sections:[
    {type:'mascot', text:"Grammar time! 💪 Every sentence is like a little team of TWO players. Let's meet them. 🧩"},
    {type:'text', h:'🧱 The two parts of a sentence', html:"Every complete sentence has two parts:<br><br><b>1) The Subject</b> — the <b>naming part</b>. It tells us <b>who or what</b> the sentence is about.<br><b>2) The Predicate</b> — the <b>telling part</b>. It tells us <b>what the subject does or is</b>. The predicate <b>always contains the verb</b> (the action or 'being' word)."},
    {type:'example', html:"<b>The clever fox</b> | <b>tricked the proud raven.</b><br>↳ Subject = <b>The clever fox</b> (who the sentence is about)<br>↳ Predicate = <b>tricked the proud raven</b> (what the fox did — note the verb <i>tricked</i>)."},
    {type:'text', h:'🔎 How to find the subject', html:"Ask: <b>'Who or what is this sentence about?'</b> The answer — <i>together with its describing words</i> — is the <b>subject</b>. Everything that is left is the <b>predicate</b>.<br><br>The subject can be one word (<i>Birds</i> fly.) or many words (<i>The sacred rivers of India</i> are beautiful.)."},
    {type:'text', h:'🧠 A reliable trick', html:"Find the <b>verb</b> first (the action/being word). The verb is <b>always inside the predicate</b>. The part before the action that names the 'doer' is usually the subject."},
    {type:'practice', q:{text:"In 'The hungry fox waited under the tree.', the SUBJECT is…", choices:["The hungry fox","waited under the tree","under the tree","waited"], answer:0, explain:"The sentence is about 'The hungry fox' → that is the subject."}},
    {type:'practice', q:{text:"In the same sentence, the PREDICATE is…", choices:["waited under the tree","The hungry fox","The hungry","fox"], answer:0, explain:"The telling part (with the verb 'waited') is 'waited under the tree'."}},
    {type:'mascot', text:"You can now split any sentence in two! 🌟 Prove it in today's 10-question test (95% to earn your star). ⭐"},

    {level:'Medium', text:"The predicate always contains a…", choices:["verb","question mark","capital letter only","number"], answer:0, explain:"The verb is always inside the predicate."},

{
  id:'english-d4', subject:'english', week:1, day:4, title:'Day 4 · Phrases & Clauses', emoji:'📖',
  blurb:'Telling apart a phrase (no subject+verb) from a clause (has subject+verb).',
  objective:"Recognise the difference between a phrase and a clause using the 'subject + verb' test.",
  sections:[
    {type:'mascot', text:"Words love to travel in groups! 🚶‍♂️🚶‍♀️ Today we learn the two main kinds of word-groups: phrases and clauses. 🔗"},
    {type:'text', h:'🔗 What is a phrase?', html:"A <b>phrase</b> is a <b>group of words that work together</b> as one unit but does <b>NOT contain a subject-and-verb pair</b>. By itself, a phrase does <b>not</b> give a complete thought.<br><br>Examples: <i>in the early morning</i> · <i>a bottle of dew</i> · <i>under the tall tree</i>. Notice — none of these has someone <i>doing</i> an action."},
    {type:'text', h:'🧩 What is a clause?', html:"A <b>clause</b> is a <b>group of words that DOES contain a subject and a verb</b>. It tells us about an action or a state.<br><br>Examples: <i>the raven sang</i> (subject <b>the raven</b> + verb <b>sang</b>) · <i>Rama worked hard</i> · <i>because she was tired</i>."},
    {type:'tip', html:"<b>The one test you need:</b> look for a <b>subject + a verb</b>. If you can find <b>both</b> → it's a <b>clause</b>. If you cannot → it's a <b>phrase</b>."},
    {type:'example', html:"<i>near the river</i> → no verb → <b>phrase</b>.<br><i>she sat near the river</i> → subject <b>she</b> + verb <b>sat</b> → <b>clause</b>."},
    {type:'practice', q:{text:"Is 'after the heavy rain' a phrase or a clause?", choices:["Phrase","Clause","Sentence","Paragraph"], answer:0, explain:"No subject + verb pair → it is a phrase."}},
    {type:'practice', q:{text:"Is 'the children were playing' a phrase or a clause?", choices:["Clause","Phrase","Title","Word"], answer:0, explain:"Subject 'the children' + verb 'were playing' → a clause."}},
    {type:'mascot', text:"Phrase or clause? You can tell now! 🌟 Take the 10-question test (95% to earn your star). ⭐"},
  ],

{
  id:'english-d5', subject:'english', week:1, day:5, title:'Day 5 · Sentence Types & Converting Them', emoji:'📖',
  blurb:'Statements, questions, requests, instructions — and changing one into another.',
  objective:"Identify statements, questions, requests and instructions, and convert a sentence from one type into another.",
  sections:[
    {type:'mascot', text:"Last grammar stop! 🛑 We use sentences for different jobs — telling, asking, requesting and instructing. Let's master all four, then learn to switch between them. 🔄"},
    {type:'text', h:'❓ The four types of sentences (by purpose)', html:"<b>Statement</b> — gives information; ends with a <b>full stop (.)</b>. <i>The fox was clever.</i><br><b>Question</b> — asks something; ends with a <b>question mark (?)</b>. <i>Was the fox clever?</i><br><b>Request</b> — politely asks someone to do/give something; usually starts with <b>'Please'</b> or <b>'Could/Would you'</b>. <i>Please pass the cheese.</i><br><b>Instruction / Command</b> — tells or orders someone to do something; often <b>begins with the verb</b>. <i>Mix the dew in the pot.</i>"},
    {type:'practice', q:{text:"'Please give me the cheese.' This sentence is a…", choices:["Request","Statement","Question","Instruction"], answer:0, explain:"It politely asks (with 'please') → a request."}},
    {type:'text', h:'🔄 Converting one type into another', html:"The same idea can be re-shaped for a different purpose:<br><br><b>Statement → Question:</b> bring the helping verb to the front, or add do/does/did. <i>'She is singing.'</i> → <i>'Is she singing?'</i> · <i>'He works hard.'</i> → <i>'Does he work hard?'</i><br><b>Order → polite Request:</b> add 'Please' or 'Could you'. <i>'Give me the book.'</i> → <i>'Could you please give me the book?'</i><br><b>Statement → Instruction:</b> drop the subject and start with the verb. <i>'You should close the door.'</i> → <i>'Close the door.'</i>"},
    {type:'example', html:"Making a question: 'The raven <b>dropped</b> the cheese.' → '<b>Did</b> the raven <b>drop</b> the cheese?' (the past 'dropped' becomes 'did…drop')."},
    {type:'practice', q:{text:"Change to a QUESTION: 'The fox is clever.'", choices:["Is the fox clever?","The fox is clever!","Clever fox.","The fox was not clever."], answer:0, explain:"Move 'is' to the front + '?' → Is the fox clever?"}},
    {type:'mascot', text:"That completes Unit 1! 🌟 Take the final 10-question test (95% to earn your star) and finish English Week 1. ⭐"},
  ],
  test:{ passScore:95, questions:[
    {level:'Medium', text:"A sentence that gives information ends with a…", choices:["full stop","question mark","comma","dash"], answer:0, explain:"A statement ends with a full stop."},
    {level:'Medium', text:"A sentence that asks something ends with a…", choices:["question mark","full stop","comma","star"], answer:0, explain:"A question ends with a question mark."},
    {level:'Medium', text:"'Please give me some water.' is a…", choices:["Request","Statement","Question","Instruction"], answer:0, explain:"Polite asking with 'please' → a request."},
    {level:'Medium', text:"'Open your books to page ten.' is an…", choices:["Instruction (command)","Question","Statement","Request"], answer:0, explain:"It tells someone to do something → an instruction."},
    {level:'Medium', text:"'The Himalayas are very tall.' is a…", choices:["Statement","Question","Request","Command"], answer:0, explain:"It gives information → a statement."},
    {level:'Medium-Hard', text:"Change to a QUESTION: 'The raven dropped the cheese.'", choices:["Did the raven drop the cheese?","The raven dropped the cheese!","Drop the cheese.","The raven did not drop it."], answer:0, explain:"Use 'Did … drop?' → Did the raven drop the cheese?"},

    {level:'Medium-Hard', text:"Change to an INSTRUCTION: 'You should water the plants.'", choices:["Water the plants.","Are the plants watered?","The plants are watered.","Water?"], answer:0, explain:"Drop the subject and start with the verb → 'Water the plants.'"},

{
  id:'science-diversity', subject:'science', week:1, title:'Diversity in Plants and Animals', emoji:'🌿',
  blurb:'Plant types, leaves, roots, seeds, animal habitats, movement & adaptation.',
  objective:"Explore the variety of living things — herbs/shrubs/trees, climbers & creepers, leaf venation, roots, monocot/dicot seeds, animal habitats, how animals move, and how living things adapt to where they live.",
  sections:[
    {type:'mascot', text:"Hi again! 🦉 It's Hooty. Today we explore the amazing <b>variety of living things</b> — from tiny herbs to tall trees, and from fish to camels. Let's go on a nature safari! 🌿🐾"},
    {type:'text', h:'🌍 1. Diversity all around us', html:"Look around — there are countless kinds of plants and animals! Scientists <b>group living things</b> by their features so they are easier to study. Let's begin with plants."},

    {type:'text', h:'🌱 2. Types of plants (by stem)', html:"<b>Herbs</b> — small plants with a soft, green stem (e.g. <i>mint, tomato, grass, wheat</i>).<br><b>Shrubs</b> — medium plants with a hard woody stem branching near the ground (e.g. <i>rose, lemon, henna</i>).<br><b>Trees</b> — tall and big with a thick, hard woody trunk (e.g. <i>mango, neem, banyan</i>)."},
    {type:'text', h:'🧗 Weak-stem plants: climbers & creepers', html:"Some plants have a <b>weak stem</b> that cannot stand on its own.<br><b>Climbers</b> — climb up using a support (e.g. <i>money plant, grapevine, pea</i>).<br><b>Creepers</b> — spread along the ground (e.g. <i>pumpkin, watermelon, sweet potato</i>)."},
    {type:'example', html:"Memory trick: <b>Climbers Climb up</b> ⬆️, <b>Creepers Crawl on the ground</b> ➡️."},
    {type:'practice', q:{text:"A rose plant with a medium, hard woody stem branching near the ground is a…", choices:["Herb","Shrub","Tree","Creeper"], answer:1, explain:"Medium height + woody stem branching near the base = a shrub (e.g. rose)."}},
    {type:'practice', q:{text:"A pumpkin plant that spreads along the ground is a…", choices:["Climber","Creeper","Tree","Herb"], answer:1, explain:"Weak stem spreading on the ground = creeper (e.g. pumpkin, watermelon)."}},

    {type:'text', h:'🍃 3. Leaves: venation patterns', html:"The lines on a leaf are called <b>veins</b>, and their pattern is the <b>venation</b>.<br><b>Reticulate venation</b> — a <b>net-like</b> pattern (e.g. <i>mango, peepal, rose, hibiscus</i>).<br><b>Parallel venation</b> — veins run <b>side by side</b> (e.g. <i>grass, wheat, maize, banana</i>)."},
    {type:'practice', q:{text:"A grass leaf has veins running side by side. This is…", choices:["Reticulate venation","Parallel venation","No venation","Random venation"], answer:1, explain:"Side-by-side veins = parallel venation (grass, wheat, banana)."}},

    {type:'text', h:'🌿 4. Roots: taproot & fibrous', html:"<b>Taproot</b> — one main thick root with smaller side roots (e.g. <i>carrot, radish, mustard, gram</i>).<br><b>Fibrous roots</b> — many thin roots of similar size, with no single main root (e.g. <i>grass, wheat, maize, onion</i>)."},
    {type:'tip', html:"Cool link! Leaves and roots go together: <b>reticulate venation → taproot</b>, and <b>parallel venation → fibrous roots</b>."},
    {type:'practice', q:{text:"A carrot is an example of which kind of root?", choices:["Fibrous root","Taproot","Climbing root","No root"], answer:1, explain:"A carrot is one main thick root = taproot."}},

    {type:'text', h:'🌰 5. Seeds: monocots & dicots', html:"<b>Dicot seeds</b> split into <b>TWO</b> halves called cotyledons (e.g. <i>gram/chana, bean, pea, peanut</i>).<br><b>Monocot seeds</b> have only <b>ONE</b> part and do not split (e.g. <i>maize, wheat, rice</i>)."},
    {type:'tip', html:"The big pattern: <b>Dicot</b> = two seed-halves → reticulate leaves → taproot. <b>Monocot</b> = one seed-part → parallel leaves → fibrous roots."},
    {type:'practice', q:{text:"A gram (chana) seed splits into two halves. It is a…", choices:["Monocot","Dicot","Tricot","Not a seed"], answer:1, explain:"Two cotyledons (halves) = dicot seed."}},

    {type:'text', h:'🐾 6. Animals & their habitats', html:"A <b>habitat</b> is the place where a plant or animal lives.<br><b>Terrestrial</b> animals live on <b>land</b> (e.g. <i>cow, lion, camel, ant</i>).<br><b>Aquatic</b> animals live in <b>water</b> (e.g. <i>fish, whale, octopus</i>).<br>Some, like the <b>frog</b>, live both on land and in water (amphibians)."},
    {type:'practice', q:{text:"A fish lives in water, so it is a/an ___ animal.", choices:["Terrestrial","Aquatic","Aerial","Desert"], answer:1, explain:"Lives in water = aquatic animal."}},

    {type:'text', h:'🏃 7. How animals move', html:"Animals move in many ways:<br>🦵 <b>Walk / run</b> with legs — dog, horse<br>🐦 <b>Fly</b> with wings — birds, butterfly<br>🐟 <b>Swim</b> with fins — fish<br>🐍 <b>Crawl / slither</b> — snake, snail<br>🐸 <b>Hop / jump</b> — frog, kangaroo"},
    {type:'practice', q:{text:"A snake has no legs. How does it move?", choices:["Flies","Swims with fins","Crawls / slithers","Hops"], answer:2, explain:"Snakes move by crawling/slithering using their body muscles."}},

    {type:'text', h:'🐫 8. Adaptation', html:"<b>Adaptation</b> means the special features that help a living thing <b>survive in its habitat</b>.<br>🐫 Camel — hump stores fat; long legs &amp; wide feet for hot sand.<br>🐟 Fish — streamlined body, gills to breathe in water, fins to swim.<br>🌵 Cactus — spines instead of leaves and a thick stem to store water in the desert."},
    {type:'example', html:"A <b>polar bear</b> has thick white fur to stay warm and hidden in the snow — that's adaptation to a cold habitat. ❄️"},
    {type:'practice', q:{text:"A cactus has spines instead of leaves and a thick stem. This helps it…", choices:["Look pretty","Store water and lose less water in the desert","Move faster","Make sounds"], answer:1, explain:"Spines reduce water loss and the thick stem stores water — an adaptation to the dry desert."}},

    {type:'mascot', text:"What a journey! 🌟 You've explored plants, leaves, roots, seeds, animals and adaptation. Ready for your star? Take the Mastery Test — <b>medium → hard</b>, and you need <b>95%</b> to master it!"},
  ],

    {level:'Medium-Hard', text:"The place where an animal lives is called its…", choices:["Habitat","Adaptation","Movement","Venation"], answer:0, explain:"Habitat = the place where a living thing lives."},

    {level:'Hard', text:"A camel's hump and wide feet, which help it live in the desert, are examples of…", choices:["Habitat","Adaptation","Venation","Movement"], answer:1, explain:"Special survival features = adaptation."},

    {level:'Hard', text:"A gram (chana) seed splits into two halves. What leaf venation and root type would you expect?", choices:["Reticulate venation, taproot","Parallel venation, fibrous roots","Parallel venation, taproot","Reticulate venation, fibrous roots"], answer:0, explain:"Dicot → reticulate venation → taproot."},

{
  id:'social-maps', subject:'social', week:1, title:'Maps, Globe and Coordinates', emoji:'🗺️',
  blurb:'Maps & types, atlas, directions, globe, latitude/longitude, hemispheres, time zones & GMT.',
  objective:"Learn what maps and globes show — map components and types, cardinal directions, latitudes & longitudes, the equator and Prime Meridian, hemispheres, how coordinates locate any place, and how time zones, GMT and the International Date Line work.",
  sections:[
    {type:'mascot', text:"Hello explorer! 🦉 Hooty here. Grab your compass — today we map the whole world: from a sheet of paper to the round globe, and the secret grid lines that locate <i>any</i> place on Earth. 🧭🌍"},
    {type:'text', h:'🗺️ 1. What is a map?', html:"A <b>map</b> is a drawing of the Earth (or a part of it) on <b>flat paper</b>, as seen from <b>above</b>, and drawn to <b>scale</b>."},

    {type:'text', h:'🧩 2. Components of a map', html:"Every good map has three main parts:<br><b>Distance (Scale)</b> — shows how a small distance on the map stands for a big distance on the ground.<br><b>Direction</b> — a North arrow or compass to show which way is which.<br><b>Symbols</b> — special signs for rivers, roads, railways, etc., explained in a <b>legend/key</b>."},
    {type:'example', html:"On a map, blue usually means <b>water</b> 💧, green means <b>plains/forest</b> 🌳, and brown means <b>mountains</b> ⛰️. The <b>legend</b> tells you what each symbol means."},
    {type:'practice', q:{text:"Which of these is NOT one of the three main components of a map?", choices:["Distance (scale)","Direction","Symbols","Price"], answer:3, explain:"A map's three main components are distance, direction and symbols — not price."}},

    {type:'text', h:'📚 3. Atlas', html:"An <b>atlas</b> is a <b>book or collection of maps</b> bound together — physical maps, political maps and more."},

    {type:'text', h:'🌐 4. Types of maps', html:"<b>Physical maps</b> — natural features like mountains, rivers and plains.<br><b>Political maps</b> — countries, states, cities and their boundaries.<br><b>Thematic maps</b> — one special theme, e.g. rainfall, roads or population."},
    {type:'practice', q:{text:"A map that shows countries, states, capitals and their boundaries is a…", choices:["Physical map","Political map","Thematic map","Weather map"], answer:1, explain:"Boundaries, countries and capitals = a political map."}},

    {type:'text', h:'🧭 5. Cardinal directions', html:"The four main directions are <b>North, South, East and West</b>. Between them lie NE, NW, SE and SW.<br>An easy clue: the <b>Sun rises in the East</b> and sets in the West."},
    {type:'practice', q:{text:"The Sun rises in the…", choices:["East","West","North","South"], answer:0, explain:"The Sun rises in the East — a quick way to find directions."}},

    {type:'text', h:'🌍 6. The globe', html:"A <b>globe</b> is a true, <b>spherical (round) model</b> of the Earth. It shows the real shape, sizes and positions far better than a flat map."},

    {type:'text', h:'↔️ 7. Latitudes (parallels)', html:"<b>Latitudes</b> are imaginary lines running <b>east–west</b> around the globe in parallel circles.<br>The <b>Equator</b> is the biggest, at <b>0°</b>. It divides the Earth into the <b>Northern</b> and <b>Southern</b> hemispheres.<br>Latitude is measured in degrees up to <b>90°</b> at the poles (e.g. Tropic of Cancer 23½°N)."},
    {type:'practice', q:{text:"The 0° latitude line, which divides the Earth into Northern and Southern halves, is the…", choices:["Equator","Prime Meridian","Axis","Tropic of Cancer"], answer:0, explain:"0° latitude = the Equator → Northern & Southern hemispheres."}},

    {type:'text', h:'↕️ 8. Longitudes (meridians)', html:"<b>Longitudes</b>, also called <b>meridians</b>, are imaginary lines running <b>north–south</b> from the North Pole to the South Pole.<br>The <b>Prime Meridian</b> is <b>0°</b> longitude and passes through <b>Greenwich (London)</b>.<br>Longitude is measured up to <b>180°</b> east and west."},
    {type:'tip', html:"Hemispheres made easy: the <b>Equator</b> splits North &amp; South; the <b>Prime Meridian</b> (0°) and 180° split <b>East &amp; West</b>."},

    {type:'text', h:'📍 9. Coordinates', html:"Putting a <b>latitude</b> and a <b>longitude</b> together gives a place's <b>coordinates</b> — its exact address on Earth, like a grid reference.<br>Example: New Delhi is near <b>28°N, 77°E</b>."},
    {type:'practice', q:{text:"To pinpoint the exact location of any place on Earth, we use its…", choices:["colour","latitude and longitude","name only","height"], answer:1, explain:"Latitude + longitude together (coordinates) give an exact location."}},

    {type:'text', h:'🕐 10. Time zones & GMT', html:"The Earth spins <b>360° in 24 hours</b>, so every <b>15° of longitude = 1 hour</b> of time.<br><b>GMT (Greenwich Mean Time)</b> is the time at the Prime Meridian (0°) and is used as the world's reference time.<br>Places to the east are <b>ahead</b>; places to the west are <b>behind</b>. India's time (IST) is <b>GMT + 5½ hours</b>."},
    {type:'example', html:"Since 15° = 1 hour, a place 30° east of Greenwich is about <b>2 hours ahead</b> of GMT."},

    {type:'text', h:'📅 11. International Date Line', html:"The <b>International Date Line (IDL)</b> runs roughly along the <b>180° meridian</b>. When you cross it, the <b>calendar date changes</b> by one day — it keeps the world's dates in order."},
    {type:'practice', q:{text:"Roughly along which meridian does the International Date Line run?", choices:["0°","90°","180°","45°"], answer:2, explain:"The IDL runs roughly along the 180° meridian."}},

    {type:'mascot', text:"Brilliant exploring! 🌟 You can read maps, use the globe's grid, and tell world time. Ready for your star? Take the Mastery Test — <b>medium → hard</b>, and you need <b>95%</b> to master it!"},
  ],

    {level:'Medium', text:"A drawing of the Earth (or a part of it) on flat paper, seen from above, is a…", choices:["Map","Globe","Atlas","Chart"], answer:0, explain:"A flat drawing of the Earth to scale = a map."},
    {level:'Medium', text:"A book or collection of maps bound together is called an…", choices:["Atlas","Album","Almanac","Catalogue"], answer:0, explain:"A collection of maps = an atlas."},
    {level:'Medium', text:"A map that shows mountains, rivers and plains is a ___ map.", choices:["Physical","Political","Thematic","Road"], answer:0, explain:"Natural features = physical map."},
    {level:'Medium', text:"A map showing countries, states, capitals and boundaries is a ___ map.", choices:["Physical","Political","Weather","Picture"], answer:1, explain:"Countries & boundaries = political map."},
    {level:'Medium', text:"The four cardinal (main) directions are:", choices:["North, South, East, West","Up, Down, Left, Right","NE, NW, SE, SW","Front, Back, Left, Right"], answer:0, explain:"The cardinal directions are North, South, East and West."},
    {level:'Medium', text:"The Sun rises in the…", choices:["East","West","North","South"], answer:0, explain:"The Sun rises in the East."},
    {level:'Medium', text:"A true, spherical (round) model of the Earth is a…", choices:["Globe","Map","Atlas","Chart"], answer:0, explain:"A round model of the Earth = a globe."},
    {level:'Medium-Hard', text:"The 0° latitude line is called the…", choices:["Equator","Prime Meridian","Tropic of Cancer","Axis"], answer:0, explain:"0° latitude = the Equator."},
    {level:'Medium-Hard', text:"The Equator divides the Earth into the ___ hemispheres.", choices:["Northern and Southern","Eastern and Western","Left and Right","Hot and Cold"], answer:0, explain:"The Equator splits the Earth into Northern and Southern hemispheres."},
    {level:'Medium-Hard', text:"Imaginary lines running east–west around the globe in parallel circles are called…", choices:["Latitudes","Longitudes","Meridians","Axes"], answer:0, explain:"East–west parallel lines = latitudes (parallels)."},
    {level:'Medium-Hard', text:"Lines of longitude (meridians) run…", choices:["from the North Pole to the South Pole","around the equator","east to west in circles","only near the poles"], answer:0, explain:"Meridians run north–south, pole to pole."},
    {level:'Medium-Hard', text:"The 0° line of longitude is called the…", choices:["Prime Meridian","Equator","International Date Line","Tropic of Capricorn"], answer:0, explain:"0° longitude = the Prime Meridian."},
    {level:'Medium-Hard', text:"The Prime Meridian passes through…", choices:["Greenwich (London)","New Delhi","New York","Tokyo"], answer:0, explain:"The Prime Meridian passes through Greenwich, London."},
    {level:'Medium-Hard', text:"To pinpoint the exact location of a place on Earth, we use its…", choices:["latitude and longitude","colour","name only","height"], answer:0, explain:"Latitude + longitude (coordinates) give an exact location."},
    {level:'Hard', text:"Which statement is CORRECT?", choices:["Latitude goes up to 90°, longitude up to 180°","Latitude up to 180°, longitude up to 90°","Both go up to 90°","Both go up to 360°"], answer:0, explain:"Latitude: up to 90° (poles). Longitude: up to 180° E/W."},
    {level:'Hard', text:"The Prime Meridian (0°) and the 180° meridian divide the Earth into the ___ hemispheres.", choices:["Eastern and Western","Northern and Southern","Top and Bottom","Day and Night"], answer:0, explain:"0° and 180° longitude divide Eastern and Western hemispheres."},
    {level:'Hard', text:"The Earth rotates 360° in 24 hours, so 15° of longitude equals about ___ of time.", choices:["1 hour","1 minute","12 hours","1 day"], answer:0, explain:"360° ÷ 24 hours = 15° per hour."},
    {level:'Hard', text:"The world's standard reference time, taken at the Prime Meridian (0°), is called…", choices:["GMT (Greenwich Mean Time)","IST","Local time","Noon"], answer:0, explain:"Time at the Prime Meridian = GMT, the world reference."},
    {level:'Hard', text:"The line, roughly along the 180° meridian, where the calendar date changes is the…", choices:["International Date Line","Equator","Prime Meridian","Tropic of Cancer"], answer:0, explain:"The date changes at the International Date Line (~180°)."},
    {level:'Hard', text:"A place is at 28°N, 77°E. In these coordinates, the '77°E' is its…", choices:["longitude","latitude","altitude","time zone"], answer:0, explain:"The East/West value (77°E) is the longitude; 28°N is the latitude."},
  ]},
},
{id:'hindi-w1',   subject:'hindi',   week:1, title:'(Your Hindi topic)', emoji:'✍️', comingSoon:true, blurb:'Tell me the topic and I will build it.'},

]};

/* ---------------- progress store ---------------- */
const KEY='learnquest_v1';
function loadStore(){ try{return JSON.parse(localStorage.getItem(KEY))||{}}catch(e){return {}} }
function saveStore(s){ localStorage.setItem(KEY, JSON.stringify(s)); }
let store = loadStore();
if(!store.name) store.name = 'Aarav';
if(!store.progress) store.progress = {};
function prog(id){ return store.progress[id] || {opened:false,bestScore:null,attempts:0,mastered:false,lastDate:null}; }
function setProg(id,patch){ store.progress[id] = Object.assign(prog(id),patch); saveStore(store); }

/* ---------------- helpers ---------------- */
function lvlBadge(l){ if(!l) return ''; const m={'Medium':'lvl-med','Medium-Hard':'lvl-mh','Hard':'lvl-hard'}; return `<span class="lvl ${m[l]||'lvl-med'}">${l}</span>`; }
const subj = id => SUBJECTS.find(s=>s.id===id);
const lessonsIn = (week,sid) => CURRICULUM.lessons.filter(l=>l.week===week && l.subject===sid);
function allWeeks(){ return [...new Set(CURRICULUM.lessons.map(l=>l.week))].sort((a,b)=>a-b); }
function daysIn(week){ const ds=[...new Set(CURRICULUM.lessons.filter(l=>l.week===week).map(l=>l.day||1))].sort((a,b)=>a-b); return ds.length?ds:[1]; }
const lessonsInDay = (week,day,sid) => CURRICULUM.lessons.filter(l=>l.week===week && (l.day||1)===day && l.subject===sid);
let currentWeek = allWeeks()[0] || 1;
let currentDay = 1;
const app = document.getElementById('app');
function today(){ const d=new Date(); return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0'); }

function overallStats(){
  const all = CURRICULUM.lessons.filter(l=>!l.comingSoon);
  const mastered = all.filter(l=>prog(l.id).mastered).length;
  const started = all.filter(l=>prog(l.id).opened).length;
  let scoreSum=0,scoreN=0;
  all.forEach(l=>{const p=prog(l.id); if(p.bestScore!=null){scoreSum+=p.bestScore;scoreN++;}});
  return {total:all.length, mastered, started, avg: scoreN? Math.round(scoreSum/scoreN):0};
}

/* ---------------- views ---------------- */
function topBar(){
  return `<div class="top">
    <h1>🚀 Learn Quest <span style="font-size:.8rem;font-weight:normal;opacity:.85">· Grade 6 · CBSE</span></h1>
    <div class="who">
      <span>👋 Hi,</span>
      <input id="nameIn" placeholder="your name" value="${store.name.replace(/"/g,'&quot;')}">
      <span class="pill" id="reportBtn" style="cursor:pointer">📊 Weekly Report</span>
    </div>
  </div>`;
}

function renderDashboard(){
  const st = overallStats();
  let h = topBar();
  h += `<div class="stats">
    <div class="stat"><div class="big">⭐ ${st.mastered}/${st.total}</div><div class="lbl">Lessons mastered</div></div>
    <div class="stat"><div class="big">📚 ${st.started}</div><div class="lbl">Lessons started</div></div>
    <div class="stat"><div class="big">🎯 ${st.avg}%</div><div class="lbl">Average test score</div></div>
    <div class="stat"><div class="big">🗓️ ${allWeeks().length}</div><div class="lbl">Weeks of content</div></div>
  </div>`;

  h += `<div class="weeks">` + allWeeks().map(w=>
    `<button class="weektab ${w===currentWeek?'active':''}" data-week="${w}">Week ${w}</button>`).join('') + `</div>`;

  const days = daysIn(currentWeek);
  if(!days.includes(currentDay)) currentDay = days[0];
  h += `<div class="weeks daytabs">` + days.map(d=>
    `<button class="weektab ${d===currentDay?'active':''}" data-day="${d}">📅 Day ${d}</button>`).join('') + `</div>`;

  let anyDay=false;
  SUBJECTS.forEach(s=>{
    const ls = lessonsInDay(currentWeek,currentDay,s.id);
    if(!ls.length) return;
    anyDay=true;
    h += `<div class="subjhead"><span class="subjdot" style="background:${s.color}"></span>${s.icon} ${s.name}</div>`;
    h += `<div class="lessons">`;
    ls.forEach(l=>{
      const p = prog(l.id);
      let badge = `<span class="badge b-new">New</span>`;
      if(l.comingSoon) badge = `<span class="badge b-soon">Coming soon</span>`;
      else if(p.mastered) badge = `<span class="badge b-master">⭐ Mastered ${p.bestScore}%</span>`;
      else if(p.opened) badge = `<span class="badge b-prog">In progress${p.bestScore!=null?' · '+p.bestScore+'%':''}</span>`;
      const go = l.comingSoon
        ? `<button class="go soon" disabled>Soon</button>`
        : `<button class="go" data-open="${l.id}">${p.opened?'Continue':'Start'} →</button>`;
      h += `<div class="lesson">
        <div class="emoji">${l.emoji}</div>
        <h3>${l.title}</h3>
        <div class="meta">${l.blurb||''}</div>
        <div class="row">${badge}</div>
        <div class="row">${go}</div>
      </div>`;
    });
    h += `</div>`;
  });
  if(!anyDay) h += `<p class="muted" style="margin-top:18px">No sessions added for this day yet. 🛠️</p>`;

  app.innerHTML = h;
  // wire
  document.getElementById('nameIn').addEventListener('change',e=>{store.name=e.target.value;saveStore(store);});
  document.getElementById('reportBtn').addEventListener('click',renderReport);
  app.querySelectorAll('[data-week]').forEach(b=>b.addEventListener('click',()=>{currentWeek=+b.dataset.week;renderDashboard();}));
  app.querySelectorAll('[data-day]').forEach(b=>b.addEventListener('click',()=>{currentDay=+b.dataset.day;renderDashboard();}));
  app.querySelectorAll('[data-open]').forEach(b=>b.addEventListener('click',()=>openLesson(b.dataset.open)));
}

function openLesson(id){
  setProg(id,{opened:true,lastDate:today()});
  renderLesson(id);
  window.scrollTo(0,0);
}

function renderLesson(id){
  const l = CURRICULUM.lessons.find(x=>x.id===id);
  const s = subj(l.subject);
  let h = `<div class="crumbs" id="backHome">← Back to dashboard</div>`;
  h += `<div class="card">
    <h2 class="lessontitle">${l.emoji} ${l.title} <span class="muted" style="font-size:.9rem">· ${s.icon} ${s.name} · Week ${l.week} · Day ${l.day||1}</span></h2>`;
  if(l.objective) h += `<div class="objective">🎯 <b>Goal:</b> ${l.objective}</div>`;

  (l.sections||[]).forEach((sec,i)=>{
    if(sec.type==='text') h+=`<div class="sec"><h4>${sec.h||''}</h4><p>${sec.html}</p></div>`;
    else if(sec.type==='example') h+=`<div class="sec"><div class="example">📝 ${sec.html}</div></div>`;
    else if(sec.type==='tip') h+=`<div class="sec"><div class="tip">💡 ${sec.html}</div></div>`;
    else if(sec.type==='worked') h+=`<div class="sec"><div class="worked"><div class="worked-h">🧮 Worked Example${sec.h?': '+sec.h:''}</div>${sec.html}</div></div>`;
    else if(sec.type==='mascot') h+=`<div class="sec"><div class="mascot"><div class="face">🦉</div><div>${sec.text}</div></div></div>`;
    else if(sec.type==='frac') h+=`<div class="sec" id="fracMount"></div>`;
    else if(sec.type==='practice') h+=`<div class="sec" data-practice="${i}"></div>`;
  });

  h += `<div class="btnrow" style="margin-top:18px">`;
  if(l.test) h += `<button class="btn big" id="startTest">📝 Take the Mastery Test</button>`;
  h += `<button class="btn ghost" id="backHome2">Back to dashboard</button></div>`;
  h += `</div>`;
  app.innerHTML = h;

  // mount interactive widgets
  if(document.getElementById('fracMount')) mountFractionWidget(document.getElementById('fracMount'));
  (l.sections||[]).forEach((sec,i)=>{
    if(sec.type==='practice'){ mountPractice(app.querySelector(`[data-practice="${i}"]`), sec.q); }
  });
  document.getElementById('backHome').addEventListener('click',renderDashboard);
  document.getElementById('backHome2').addEventListener('click',renderDashboard);
  if(l.test) document.getElementById('startTest').addEventListener('click',()=>renderTest(id));
}

/* interactive fraction bar */
function mountFractionWidget(mount){
  let denom=4, on=[true,true,true,false];
  function draw(){
    const num = on.filter(Boolean).length;
    mount.innerHTML = `<div class="fracwidget">
      <div class="muted">Tap slices to shade them!</div>
      <div class="bar">${on.map((v,i)=>`<div class="seg ${v?'on':''}" data-i="${i}"></div>`).join('')}</div>
      <div class="fracval">${num}/${denom}</div>
      <div class="ctrls"><button data-d="-1">−</button><span class="muted">slices: ${denom}</span><button data-d="1">+</button></div>
    </div>`;
    mount.querySelectorAll('.seg').forEach(s=>s.addEventListener('click',()=>{const i=+s.dataset.i;on[i]=!on[i];draw();}));
    mount.querySelectorAll('[data-d]').forEach(b=>b.addEventListener('click',()=>{
      denom=Math.min(12,Math.max(2,denom+ +b.dataset.d));
      on=Array.from({length:denom},(_,i)=>i<Math.min(on.filter(Boolean).length,denom));
      draw();
    }));
  }
  draw();
}

/* in-lesson practice (instant feedback, not graded) */
function mountPractice(mount,q){
  mount.innerHTML = `<div class="q"><div class="qtext">✏️ Quick check: ${q.text}</div>
    <div class="choices">${q.choices.map((c,i)=>
      `<div class="choice" data-i="${i}"><span class="key">${'ABCD'[i]}</span><span>${c}</span></div>`).join('')}</div>
    <div class="feedback hide"></div></div>`;
  const fb = mount.querySelector('.feedback');
  let answered=false;
  mount.querySelectorAll('.choice').forEach(ch=>ch.addEventListener('click',()=>{
    if(answered) return; answered=true;
    const i=+ch.dataset.i; const ok=i===q.answer;
    mount.querySelectorAll('.choice')[q.answer].classList.add('correct');
    if(!ok) ch.classList.add('wrong');
    fb.classList.remove('hide'); fb.classList.add(ok?'ok':'no');
    fb.innerHTML = (ok?'✅ Correct! ':'❌ Not quite. ')+q.explain;
  }));
}

/* mastery test */
function renderTest(id){
  const l = CURRICULUM.lessons.find(x=>x.id===id);
  const qs = l.test.questions;
  let h = `<div class="crumbs" id="backLesson">← Back to lesson</div>`;
  h += `<div class="card"><h2 class="lessontitle">📝 Mastery Test · ${l.title}</h2>
    <p class="muted">Answer all ${qs.length} questions. Score <b>${l.test.passScore}%+</b> to master this lesson and earn your ⭐.</p>`;
  qs.forEach((q,qi)=>{
    h += `<div class="q" data-q="${qi}"><div class="qtext">${qi+1}. ${q.text}${lvlBadge(q.level)}</div>
      <div class="choices">${q.choices.map((c,i)=>
        `<div class="choice" data-q="${qi}" data-i="${i}"><span class="key">${'ABCD'[i]}</span><span>${c}</span></div>`).join('')}</div></div>`;
  });
  h += `<div class="btnrow"><button class="btn big" id="submitTest">Submit answers ✓</button>
    <button class="btn ghost" id="backLesson2">Back to lesson</button></div></div>`;
  app.innerHTML = h; window.scrollTo(0,0);

  const picks = {};
  app.querySelectorAll('.choice').forEach(ch=>ch.addEventListener('click',()=>{
    const qi=+ch.dataset.q;
    app.querySelectorAll(`.choice[data-q="${qi}"]`).forEach(c=>c.classList.remove('sel'));
    ch.classList.add('sel'); picks[qi]=+ch.dataset.i;
  }));
  document.getElementById('backLesson').addEventListener('click',()=>renderLesson(id));
  document.getElementById('backLesson2').addEventListener('click',()=>renderLesson(id));
  document.getElementById('submitTest').addEventListener('click',()=>{
    if(Object.keys(picks).length<qs.length){ alert('Please answer all questions first! 🙂'); return; }
    gradeTest(id,picks);
  });
}

function gradeTest(id,picks){
  const l = CURRICULUM.lessons.find(x=>x.id===id);
  const qs = l.test.questions;
  let correct=0;
  qs.forEach((q,qi)=>{ if(picks[qi]===q.answer) correct++; });
  const score = Math.round(correct/qs.length*100);
  const passed = score>=l.test.passScore;
  const p = prog(id);
  const best = p.bestScore==null?score:Math.max(p.bestScore,score);
  setProg(id,{attempts:p.attempts+1,bestScore:best,mastered:p.mastered||passed,lastDate:today()});
  if(passed) burstConfetti();

  const stars = passed ? (score===100?'⭐⭐⭐':score>=90?'⭐⭐':'⭐') : '☆☆☆';
  let h = `<div class="card result">
    <div class="stars">${stars}</div>
    <div class="scoreRing" style="color:${passed?'var(--good)':'var(--bad)'}">${score}%</div>
    <h2>${passed?'🎉 Mastered!':'💪 Almost there!'}</h2>
    <p class="muted">You got <b>${correct}/${qs.length}</b> correct. ${passed?'Brilliant work!':'Review the answers below and try again — you need '+l.test.passScore+'%.'}</p>
    <div class="btnrow center" style="justify-content:center">
      <button class="btn" id="retry">↻ Try again</button>
      <button class="btn alt" id="toLesson">Back to lesson</button>
      <button class="btn ghost" id="toHome">Dashboard</button>
    </div>
  </div>`;
  h += `<div class="card"><h3>Review</h3>`;
  qs.forEach((q,qi)=>{
    const mine=picks[qi], ok=mine===q.answer;
    h += `<div class="q"><div class="qtext">${ok?'✅':'❌'} ${qi+1}. ${q.text}${lvlBadge(q.level)}</div>
      <div class="choices">${q.choices.map((c,i)=>{
        let cls='choice'; if(i===q.answer)cls+=' correct'; else if(i===mine)cls+=' wrong';
        return `<div class="${cls}"><span class="key">${'ABCD'[i]}</span><span>${c}</span></div>`;}).join('')}</div>
      <div class="feedback ok" style="background:#f3f5ff;color:#41507f">💡 ${q.explain}</div></div>`;
  });
  h += `</div>`;
  app.innerHTML = h; window.scrollTo(0,0);
  document.getElementById('retry').addEventListener('click',()=>renderTest(id));
  document.getElementById('toLesson').addEventListener('click',()=>renderLesson(id));
  document.getElementById('toHome').addEventListener('click',renderDashboard);
}

/* weekly report (parent view) */
function renderReport(){
  let h = `<div class="modal" id="modal"><div class="box">
    <span class="x" id="closeRep">✕ Close</span>
    <h2>📊 Weekly Report${store.name?' · '+store.name:''}</h2>`;
  allWeeks().forEach(w=>{
    const realW = CURRICULUM.lessons.filter(l=>l.week===w && !l.comingSoon);
    if(!realW.length){ return; }
    const masteredW = realW.filter(l=>prog(l.id).mastered).length;
    h += `<div class="repsub" style="font-size:1.05rem;border-top:2px solid var(--line);padding-top:10px">🗓️ Week ${w} — ${masteredW}/${realW.length} sessions mastered</div>`;
    daysIn(w).forEach(d=>{
      const real = realW.filter(l=>(l.day||1)===d);
      if(!real.length) return;
      const mastered = real.filter(l=>prog(l.id).mastered).length;
      h += `<div class="repsub">📅 Day ${d} — ${mastered}/${real.length} mastered</div>`;
      real.forEach(l=>{
        const p=prog(l.id); const s=subj(l.subject);
        const status = p.mastered?`⭐ Mastered (${p.bestScore}%)`:p.opened?(p.bestScore!=null?`In progress · best ${p.bestScore}%`:'Started'):'Not started';
        h += `<div class="repline"><span>${s.icon} ${s.name} · ${l.title}</span><span class="muted">${status}${p.lastDate?' · '+p.lastDate:''}</span></div>`;
      });
    });
  });
  const st=overallStats();
  h += `<div class="repsub">Overall</div>
    <div class="repline"><span>Lessons mastered</span><span>⭐ ${st.mastered}/${st.total}</span></div>
    <div class="repline"><span>Average test score</span><span>${st.avg}%</span></div>
    <div class="btnrow" style="margin-top:16px"><button class="btn ghost" id="resetAll">Reset all progress</button></div>
  </div></div>`;
  document.body.insertAdjacentHTML('beforeend',h);
  document.getElementById('closeRep').addEventListener('click',()=>document.getElementById('modal').remove());
  document.getElementById('modal').addEventListener('click',e=>{if(e.target.id==='modal')e.target.remove();});
  document.getElementById('resetAll').addEventListener('click',()=>{
    if(confirm('Reset ALL progress for everyone? This cannot be undone.')){
      store.progress={}; saveStore(store); document.getElementById('modal').remove(); renderDashboard();
    }
  });
}

function burstConfetti(){
  const e=['🎉','⭐','🎊','🌟','✨','🏆'];
  for(let i=0;i<26;i++){ const s=document.createElement('div'); s.className='confetti';
    s.textContent=e[i%e.length]; s.style.left=Math.random()*100+'vw';
    s.style.animationDelay=(Math.random()*0.5)+'s'; document.body.appendChild(s);
    setTimeout(()=>s.remove(),2800); }
}

renderDashboard();
</script>
